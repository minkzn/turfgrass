const BANK=[{"id":"m5q001","module":"M5","question":"The five cardinal temperatures for turfgrass growth and survival, from lowest to highest, begin with the minimum survival temperature and end with the:","correct":"maximum survival temperature","options":["maximum survival temperature","maximum growth temperature","optimum temperature","minimum growth temperature"],"feedback":"The five cardinal temperatures, low to high, are: minimum survival, minimum growth, optimum, maximum growth, maximum survival.","source":"M5.1: Overview","kind":"module"},{"id":"m5q002","module":"M5","question":"The minimum ________ temperature is the lowest of the cardinal temperatures for turfgrasses.","correct":"survival","options":["survival","growth","tolerance","acceptance"],"feedback":"The minimum survival temperature is the lowest of the five cardinal temperatures.","source":"M5.1: Overview","kind":"module"},{"id":"m5q003","module":"M5","question":"The optimum growth temperature range for cool-season turfgrasses is:","correct":"60 to 75°F","options":["50 to 65°F","60 to 75°F","70 to 85°F","80 to 95°F"],"feedback":"Cool-season turfgrasses have an optimum growth temperature between 60°F and 75°F.","source":"M5.1: Overview","kind":"module"},{"id":"m5q004","module":"M5","question":"The optimum growth temperature range for warm-season turfgrasses is:","correct":"80 to 95°F","options":["50 to 65°F","60 to 75°F","70 to 85°F","80 to 95°F"],"feedback":"Warm-season turfgrasses have an optimum growth temperature between 80°F and 95°F.","source":"M5.1: Overview","kind":"module"},{"id":"m5q005","module":"M5","question":"The maximum and minimum growth temperatures delimit the range within which growth occurs, while the maximum and minimum survival temperatures delimit the range within which the turfgrass can:","correct":"survive","options":["survive","reach optimum color","flower","go dormant"],"feedback":"Growth temperatures bound the range of active growth; survival temperatures bound the range in which the plant can merely survive.","source":"M5.1: Overview","kind":"module"},{"id":"m5q006","module":"M5","question":"For cool-season turfgrass, shoot growth typically peaks in spring and again in early fall, while root growth tends to peak later, often in:","correct":"fall and into early winter","options":["fall and into early winter","only in mid-summer","only in mid-winter","spring only"],"feedback":"Root growth favors slightly cooler soil temperatures than shoots and continues developing after shoot growth slows, peaking in fall and early winter.","source":"M5.2: Cardinal Temperatures in Turfgrass Growth and Survival","kind":"module"},{"id":"m5q007","module":"M5","question":"In warm-season turfgrasses, atmospheric CO2 is first fixed by converting the three-carbon PEP to the four-carbon:","correct":"OAA (oxaloacetate)","options":["OAA (oxaloacetate)","PGA (phosphoglyceric acid)","PGAL (phosphoglyceraldehyde)","RuBP (ribulose-1,5-bisphosphate)"],"feedback":"Warm-season CO2 fixation converts three-carbon PEP to four-carbon OAA.","source":"M5.2: Cardinal Temperatures in Turfgrass Growth and Survival","kind":"module"},{"id":"m5q008","module":"M5","question":"In warm-season turfgrasses, the first stable intermediary formed in fixing atmospheric carbon dioxide is:","correct":"OAA","options":["PGA","PEP","OAA","PGAL"],"feedback":"OAA (a four-carbon compound) is the first stable intermediary — this is why it's called the C-4 cycle, not PEP, which is the starting substrate.","source":"M5.2: Cardinal Temperatures in Turfgrass Growth and Survival","kind":"module"},{"id":"m5q009","module":"M5","question":"Because the first stable intermediary in warm-season CO2 fixation is a four-carbon compound, this pathway is called the:","correct":"C-4 cycle","options":["C-4 cycle","C-3 cycle","C-2 cycle","Calvin cycle only"],"feedback":"The pathway is named the C-4 cycle because its first stable intermediary (OAA) is a four-carbon compound.","source":"M5.2: Cardinal Temperatures in Turfgrass Growth and Survival","kind":"module"},{"id":"m5q010","module":"M5","question":"By initially fixing CO2 through the C-4 cycle, warm-season species achieve much lower rates of photorespiration and therefore much higher rates of:","correct":"net photosynthesis","options":["net photosynthesis","dark respiration","transpiration","vernalization"],"feedback":"The C-4 cycle's efficient CO2 capture results in lower photorespiration and higher net photosynthesis.","source":"M5.2: Cardinal Temperatures in Turfgrass Growth and Survival","kind":"module"},{"id":"m5q011","module":"M5","question":"Although its cardinal temperature profile is that of a cool-season grass, annual bluegrass behaves more like an opportunistic colonizer, growing whenever conditions allow rather than settling into a season-long pattern like:","correct":"other cool-season species","options":["other cool-season species","warm-season species only","C4 grasses only","panicoid grasses only"],"feedback":"Poa annua's cardinal temperature profile is cool-season, but its opportunistic, margin-pushing growth habit sets it apart from typical cool-season grasses.","source":"M5.3: Annual Bluegrass","kind":"module"},{"id":"m5q012","module":"M5","question":"In perennial-type annual bluegrass, the seasonal shoot-growth pattern is bimodal, while the seasonal root-growth pattern is:","correct":"trimodal","options":["trimodal","unimodal","bimodal as well","tetramodal"],"feedback":"Shoot growth shows a bimodal pattern (spring/fall peaks), while root growth shows a trimodal pattern with dips in mid-spring and mid-summer.","source":"M5.3: Annual Bluegrass","kind":"module"},{"id":"m5q013","module":"M5","question":"In perennial-type annual bluegrass, the mid-spring dip in root growth is associated with a shift to reproductive growth, as photoassimilates are partitioned to support:","correct":"inflorescence (seed-head) development","options":["inflorescence (seed-head) development","rhizome elongation","tiller formation","cold hardening"],"feedback":"The mid-spring root growth dip coincides with the reproductive shift, as photoassimilates go to seed-head development instead of roots.","source":"M5.3: Annual Bluegrass","kind":"module"},{"id":"m5q014","module":"M5","question":"In perennial-type annual bluegrass, the mid-summer dip in growth is due to reduced net photosynthesis under high temperatures, and is most evident in the:","correct":"roots","options":["roots","shoots","seed heads","rhizomes"],"feedback":"Because cultural operations favor sustained shoot growth, the mid-summer decline is most evident in the roots.","source":"M5.3: Annual Bluegrass","kind":"module"},{"id":"m5q015","module":"M5","question":"The \"annual biotype\" (wild-type) of annual bluegrass behaves as a true winter annual: it germinates from seed in fall, produces numerous seeds in spring, and:","correct":"completes its life cycle (dies) in summer","options":["completes its life cycle (dies) in summer","survives indefinitely as a perennial","goes dormant through winter only","never produces seed heads"],"feedback":"The annual biotype germinates in fall, seeds heavily in spring, and dies in summer as a true winter annual.","source":"M5.3: Annual Bluegrass","kind":"module"},{"id":"m5q016","module":"M5","question":"Compared with the bluegrasses, creeping bentgrass is slower to green up in spring, and its summer shoot growth is similar to that of:","correct":"some warm-season species","options":["some warm-season species","annual bluegrass only","fescues only","no other species"],"feedback":"Creeping bentgrass's summer shoot growth resembles that of some warm-season species, despite being a cool-season grass.","source":"M5.4: Seasonal Growth of Creeping Bentgrass","kind":"module"},{"id":"m5q017","module":"M5","question":"Between annual bluegrass and creeping bentgrass in the same community, which is more competitive during the warmer portions of the growing season?","correct":"creeping bentgrass","options":["creeping bentgrass","annual bluegrass","neither — they're equal","both are dormant"],"feedback":"Annual bluegrass is more competitive in cooler periods, while creeping bentgrass is more competitive in warmer periods.","source":"M5.4: Seasonal Growth of Creeping Bentgrass","kind":"module"},{"id":"m5q018","module":"M5","question":"There are ________ identifiable phenological stages for a perennial-type annual bluegrass.","correct":"8","options":["8","4","6","10"],"feedback":"The perennial-type annual bluegrass seasonal cycle has 8 identifiable phenological stages.","source":"M5.13: Summary","kind":"module"},{"id":"m5q019","module":"M5","question":"During Stage 1 (spring greenup), carbohydrate reserves are used to support new shoot and root growth; greenup tends to be earlier and stronger where ________ was practiced the previous fall.","correct":"late-season nitrogen fertilization","options":["late-season nitrogen fertilization","heavy summer irrigation","aggressive spring aerification","early-season fungicide application"],"feedback":"Late-season fall nitrogen fertilization supports earlier, stronger spring greenup.","source":"M5.5: Stage 1: Spring Greenup","kind":"module"},{"id":"m5q020","module":"M5","question":"During Stage 1 (spring greenup), if this nutrient is deficient it should be applied along with some potassium, since late fall greenup already reduces the need for nitrogen:","correct":"phosphorus","options":["phosphorus","nitrogen","sulfur","iron"],"feedback":"If phosphorus is deficient at spring greenup, it should be applied along with some potassium.","source":"M5.5: Stage 1: Spring Greenup","kind":"module"},{"id":"m5q021","module":"M5","question":"During Stage 1 (spring greenup), which two overwintering diseases may be evident?","correct":"Microdochium Patch and Typhula Blight","options":["Microdochium Patch and Typhula Blight","Pythium blight and dollar spot","Brown patch and red thread","Rust and powdery mildew"],"feedback":"Microdochium Patch and Typhula Blight are overwintering diseases that may appear at spring greenup.","source":"M5.5: Stage 1: Spring Greenup","kind":"module"},{"id":"m5q022","module":"M5","question":"During Stage 2 (early spring growth), a washboard appearance of the turf caused by mowing at excessive speeds is called:","correct":"marcelling","options":["marcelling","scalping","syringing","decortication"],"feedback":"Marcelling is a washboard appearance resulting from mowing at excessive speed, and it can lead to scalping at the next mowing.","source":"M5.6: Stage 2 - Early Spring Growth","kind":"module"},{"id":"m5q023","module":"M5","question":"On annual bluegrass greens, viable seed heads can be produced at mowing heights as low as:","correct":"1/8 inch (3.2 mm)","options":["1/8 inch (3.2 mm)","3/8 inch (10 mm)","1/2 inch (13 mm)","1 inch (25 mm)"],"feedback":"Annual bluegrass greens can produce viable seed heads at mowing heights of 1/8 inch or lower.","source":"M5.6: Stage 2 - Early Spring Growth","kind":"module"},{"id":"m5q024","module":"M5","question":"Annual bluegrass greens should be mowed at least how many times per week, with clippings removed?","correct":"6 times","options":["6 times","2 times","3 times","10 times"],"feedback":"Annual bluegrass greens should be mowed at least 6 times weekly with clippings removed.","source":"M5.6: Stage 2 - Early Spring Growth","kind":"module"},{"id":"m5q025","module":"M5","question":"The preferred mowing height range for annual bluegrass fairways is:","correct":"3/8 to 1/2 inch (10-13 mm)","options":["3/8 to 1/2 inch (10-13 mm)","1/8 to 1/4 inch (3-6 mm)","1/2 to 7/8 inch (13-22 mm)","1 to 2 inches (25-50 mm)"],"feedback":"While the acceptable range is 3/8 to 7/8 inch, 3/8 to 1/2 inch is preferred for annual bluegrass fairways.","source":"M5.6: Stage 2 - Early Spring Growth","kind":"module"},{"id":"m5q026","module":"M5","question":"On a reel-type mower, the bedknife pushes aerial shoots forward while the reel knives pull shoots toward the bedknife; when the two cutting edges meet, shoots are:","correct":"clipped","options":["clipped","scalped","marcelled","syringed"],"feedback":"The bedknife and reel knives clip the shoots when they come together.","source":"M5.6: Stage 2 - Early Spring Growth","kind":"module"},{"id":"m5q027","module":"M5","question":"During Stage 3 (seed-head pulse), plant-growth regulators such as mefluidide and ethephon are applied just prior to this stage in order to:","correct":"inhibit seed-head production","options":["inhibit seed-head production","accelerate root growth","increase nitrogen uptake","promote cold hardening"],"feedback":"Mefluidide and ethephon are applied just before the seed-head pulse to inhibit seed-head production.","source":"M5.7: Stage 3 - Seed Head Pulse","kind":"module"},{"id":"m5q028","module":"M5","question":"During Stage 3 (seed-head pulse), nitrogen fertilization and cultivation should generally be avoided because they would place annual bluegrass at a competitive disadvantage with:","correct":"other turfgrasses","options":["other turfgrasses","itself in future stages","weeds only","disease organisms"],"feedback":"Avoiding N and cultivation during seed-head pulse prevents putting annual bluegrass at a disadvantage against competing turfgrasses.","source":"M5.7: Stage 3 - Seed Head Pulse","kind":"module"},{"id":"m5q029","module":"M5","question":"The availability of carbohydrates to support vegetative growth of annual bluegrass is most limiting during which phenological stage?","correct":"mid-spring seed-head pulse","options":["early spring growth","late-spring recuperative growth","late-summer recuperative growth","mid-spring seed-head pulse"],"feedback":"Because seed-head production requires massive photoassimilate partitioning, carbohydrates for vegetative growth are most limited during the seed-head pulse.","source":"M5.7: Stage 3 - Seed Head Pulse","kind":"module"},{"id":"m5q030","module":"M5","question":"During Stage 4 (late-spring recuperative growth), applications of a Class-A plant growth regulator are often initiated; this PGR is:","correct":"trinexapac-ethyl","options":["trinexapac-ethyl","mefluidide","ethephon","gibberellin"],"feedback":"Trinexapac-ethyl (a Class-A PGR) applications often begin during late-spring recuperative growth.","source":"M5.8: Stage 4 - Late Spring Recuperative Growth","kind":"module"},{"id":"m5q031","module":"M5","question":"Stage 4 (late-spring recuperative growth) is an excellent time to hollow-tine cultivate and topdress, with fertilization done ________ to stimulate healthy shoot and root growth.","correct":"immediately afterwards","options":["immediately afterwards","two months later","the following winter","never during this stage"],"feedback":"Fertilization immediately after hollow-tine cultivation and topdressing stimulates healthy growth during favorable temperatures.","source":"M5.8: Stage 4 - Late Spring Recuperative Growth","kind":"module"},{"id":"m5q032","module":"M5","question":"During Stage 5 (summer-stressed growth), the dramatic reduction in root growth is primarily due to reduced net photosynthesis caused by high rates of:","correct":"photorespiration","options":["photorespiration","photophosphorylation","photolysis","vernalization"],"feedback":"High photorespiration rates under summer heat reduce net photosynthesis, driving the dramatic reduction in root growth.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q033","module":"M5","question":"During Stage 5 (summer-stressed growth), nitrogen should be applied at low rates using which method, to minimize foliar burn and carbohydrate depletion?","correct":"foliar application","options":["foliar application","deep-root injection","granular broadcast at high rates","none — nitrogen should be skipped entirely"],"feedback":"Low-rate foliar nitrogen applications sustain growth during summer stress while minimizing foliar burn and carbohydrate depletion.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q034","module":"M5","question":"During Stage 5 (summer-stressed growth), light applications of water to cool the canopy during especially hot days is called:","correct":"syringing","options":["syringing","swathing","topdressing","marcelling"],"feedback":"Syringing — light, brief irrigation — helps turf get through especially hot days during summer stress.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q035","module":"M5","question":"The three phases of the C-3 photosynthetic cycle are carboxylation, reduction, and:","correct":"regeneration","options":["regeneration","oxidation","photolysis","vernalization"],"feedback":"The C-3 cycle's three phases are carboxylation, reduction, and regeneration.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q036","module":"M5","question":"In the C-3 cycle's carboxylation phase, atmospheric CO2 is captured by the five-carbon receptor molecule RuBP to form two three-carbon molecules of:","correct":"PGA (phosphoglyceric acid)","options":["PGA (phosphoglyceric acid)","PGAL (phosphoglyceraldehyde)","OAA (oxaloacetate)","PEP (phosphoenolpyruvate)"],"feedback":"Carboxylation combines CO2 with RuBP to form two molecules of PGA, the first stable intermediary of the C-3 cycle.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q037","module":"M5","question":"In the C-3 cycle's reduction phase, PGA is reduced by NADPH to produce:","correct":"PGAL (phosphoglyceraldehyde)","options":["PGAL (phosphoglyceraldehyde)","RuBP","OAA","glucose directly"],"feedback":"NADPH reduces PGA to PGAL; most PGAL regenerates RuBP, with the remainder eventually forming glucose.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q038","module":"M5","question":"For every ________ molecules of carbon dioxide captured by the C-3 cycle, one six-carbon molecule of glucose is produced.","correct":"6","options":["6","2","3","12"],"feedback":"Six CO2 molecules captured through the C-3 cycle yield one glucose molecule.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q039","module":"M5","question":"The NADPH used to reduce PGA to PGAL comes from the light-________ reactions of photosynthesis.","correct":"dependent","options":["dependent","independent","neutral","inhibited"],"feedback":"NADPH for the C-3 cycle's reduction phase comes from the light-dependent reactions.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q040","module":"M5","question":"In Photosystem II, the hole left in chlorophyll after an excited electron leaves is filled by an electron from a water molecule — this splitting of water is called:","correct":"photolysis","options":["photolysis","photorespiration","photophosphorylation","photoperiodism"],"feedback":"Photolysis is the splitting of water in Photosystem II, releasing electrons, protons, and oxygen.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q041","module":"M5","question":"Photolysis in Photosystem II yields two electrons, two protons, and:","correct":"half of an oxygen molecule (½ O2)","options":["half of an oxygen molecule (½ O2)","a full CO2 molecule","one glucose molecule","an ATP molecule directly"],"feedback":"Splitting one water molecule (photolysis) yields two electrons, two H+ ions, and ½ O2.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q042","module":"M5","question":"The formation of ATP from ADP and phosphate, powered by the energy captured from the excited electron's oxidation-reduction pathway in Photosystem II, is called:","correct":"photophosphorylation","options":["photophosphorylation","photolysis","photorespiration","carboxylation"],"feedback":"Photophosphorylation is the process forming ATP from ADP and phosphate using energy from the excited electron.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q043","module":"M5","question":"The byproducts of Photosystem II include several molecules of:","correct":"ATP","options":["ATP","NADPH","NADP","glucose"],"feedback":"Photosystem II produces ATP via photophosphorylation; NADPH is produced later in Photosystem I.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q044","module":"M5","question":"In Photosystem I, the hole left by an excited, departed electron is filled by the electron arriving from Photosystem II, and the resulting energy is captured to form:","correct":"NADPH","options":["NADPH","ATP","OAA","PGA"],"feedback":"Photosystem I's electron transport chain produces NADPH from NADP+ and H+.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q045","module":"M5","question":"The first photoassimilates formed from photosynthetic CO2 fixation are simple sugars (monosaccharides) called glucose and:","correct":"fructose","options":["fructose","sucrose","starch","fructans"],"feedback":"Glucose and fructose, simple interconverting monosaccharides, are the first photoassimilates formed.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q046","module":"M5","question":"The mobile, disaccharide form of carbohydrate easily transported from leaves to roots, formed by an ether linkage between glucose and fructose, is:","correct":"sucrose","options":["sucrose","fructans","starch","PGAL"],"feedback":"Sucrose is a disaccharide formed from glucose and fructose, making the carbohydrate more mobile within the plant.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q047","module":"M5","question":"The storage form of carbohydrates in cool-season turfgrasses, made of one glucose molecule and a long chain of fructose molecules, is:","correct":"fructans","options":["fructans","starch","sucrose","glucose"],"feedback":"Fructans — a glucose molecule with a long fructose chain — are the storage carbohydrate of cool-season grasses.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q048","module":"M5","question":"The storage form of carbohydrates in warm-season turfgrasses, made of a long chain of glucose molecules, is:","correct":"starch","options":["starch","fructans","sucrose","PGA"],"feedback":"Starch — a long chain of glucose molecules — is the storage carbohydrate of warm-season grasses.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q049","module":"M5","question":"The process in which oxygen substitutes for carbon dioxide in the formation of PGA, occurring under high light, high O2, and high temperature, is called:","correct":"photorespiration","options":["photorespiration","photolysis","photophosphorylation","vernalization"],"feedback":"Photorespiration is the substitution of O2 for CO2 in PGA formation under high light, oxygen, and temperature.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q050","module":"M5","question":"During photorespiration, only one molecule of PGA is produced along with a two-carbon molecule of:","correct":"phosphoglycolic acid","options":["phosphoglycolic acid","PGAL","OAA","RuBP"],"feedback":"Photorespiration produces one PGA plus a two-carbon phosphoglycolic acid molecule, instead of the usual two PGA.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q051","module":"M5","question":"In the C-2 cycle, two molecules of phosphoglycolic acid interact to produce one molecule of PGA and one molecule of CO2, but no:","correct":"glucose","options":["glucose","oxygen","ATP","NADPH"],"feedback":"The C-2 cycle recovers one PGA and releases CO2 from two phosphoglycolic acid molecules, but produces no glucose — a net loss.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q052","module":"M5","question":"The principal cause of photorespiration in cool-season turfgrasses, driving the summertime decline in net photosynthesis, is:","correct":"high temperatures","options":["high temperatures","low light intensity","excess moisture","low oxygen"],"feedback":"High temperatures are the principal cause of photorespiration and the associated summer decline in net photosynthesis for cool-season grasses.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q053","module":"M5","question":"One cultural measure for maximizing carbohydrate production and minimizing photorespiration effects during summer stress is:","correct":"raising the mowing height","options":["raising the mowing height","lowering the mowing height further","applying excessive nitrogen","withholding all irrigation"],"feedback":"Raising mowing height (along with adequate light, moisture, nutrients, and aeration) helps maximize carbohydrate production during summer stress.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q054","module":"M5","question":"Where excessive nitrogen is available under summer heat stress, more carbohydrates are converted to amino acids, depleting the carbohydrates that would otherwise sustain the:","correct":"roots","options":["roots","seed heads","flowers","cuticle"],"feedback":"Excess nitrogen diverts carbohydrates to amino acid production, depleting reserves that would otherwise support root growth.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q055","module":"M5","question":"Under high summer temperatures, production of this hormone in the roots declines, contributing to root-growth stoppage:","correct":"cytokinin","options":["cytokinin","gibberellin","auxin","ethylene"],"feedback":"Cytokinin production in the roots declines under high temperatures, contributing to root-growth stoppage during summer stress.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q056","module":"M5","question":"Research at Rutgers has shown that exogenous applications of ________ can improve root growth during summer months.","correct":"cytokinins","options":["cytokinins","gibberellins","auxins","ethylene"],"feedback":"Rutgers research found that exogenous cytokinin applications can improve summer root growth.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q057","module":"M5","question":"Under temperature and drought stress, oxygen radical production increases while antioxidant production decreases, resulting in a condition called:","correct":"oxidative stress","options":["oxidative stress","photorespiration","devernalization","photolysis"],"feedback":"Rising oxygen radicals combined with declining antioxidants under stress produces oxidative stress.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q058","module":"M5","question":"Research at Virginia Tech has shown that applications of selected ________, begun prior to stress onset, can reduce damage from oxygen radicals.","correct":"biostimulants","options":["biostimulants","herbicides","fungicides","insecticides"],"feedback":"Virginia Tech research showed that biostimulant applications before stress onset can reduce oxidative damage.","source":"M5.9: Stage 5 - Summer-stressed Growth","kind":"module"},{"id":"m5q059","module":"M5","question":"During Stage 6 (late-summer recuperative growth), shoot and root growth become more vigorous once daytime — and especially ________ — temperatures cool.","correct":"nighttime","options":["nighttime","midday","early morning","noon"],"feedback":"Cooling nighttime temperatures especially trigger the more vigorous growth of Stage 6.","source":"M5.10: Stage 6 - Late-summer Recuperative Growth","kind":"module"},{"id":"m5q060","module":"M5","question":"During Stage 6 (late-summer recuperative growth), the nitrogen fertilization rate should be increased to compensate for increased availability of:","correct":"carbohydrates","options":["carbohydrates","water","sunlight","oxygen"],"feedback":"As carbohydrate availability increases with cooling temperatures, nitrogen rates should increase to support recuperative growth.","source":"M5.10: Stage 6 - Late-summer Recuperative Growth","kind":"module"},{"id":"m5q061","module":"M5","question":"During Stage 7 (fall hardening-off), annual bluegrass prepares for winter by reducing cell moisture and storing carbohydrates, as well as synthesizing cold-tolerance proteins that function as:","correct":"antifreeze","options":["antifreeze","fungicide","growth stimulant","herbicide"],"feedback":"Cold-tolerance proteins act as antifreeze, preventing ice crystal formation within plant cells during hardening-off.","source":"M5.11: Stage 7 - Fall Hardening-off Period","kind":"module"},{"id":"m5q062","module":"M5","question":"During Stage 7 (fall hardening-off), which fertilizer nutrient should be avoided, since applying it would undermine the hardening-off process?","correct":"nitrogen","options":["nitrogen","phosphorus","potassium","calcium"],"feedback":"Nitrogen applications during hardening-off would undermine the process, including cold-tolerance protein synthesis.","source":"M5.11: Stage 7 - Fall Hardening-off Period","kind":"module"},{"id":"m5q063","module":"M5","question":"During Stage 8 (mid-fall dormancy), vertical shoot growth has ceased for the year, but the shoots are still:","correct":"green and physiologically active","options":["green and physiologically active","completely dead","turning brown and dormant","producing new seed heads"],"feedback":"In mid-fall dormancy, shoots stop growing vertically but remain green and physiologically active.","source":"M5.12: Stage 8 - Mid-fall Dormancy","kind":"module"},{"id":"m5q064","module":"M5","question":"The initiation of Stage 8 (mid-fall dormancy) presents an excellent window for a late-season application of:","correct":"nitrogen fertilizer","options":["nitrogen fertilizer","fungicide only","herbicide only","plant growth regulator only"],"feedback":"Mid-fall dormancy's onset is a good window for late-season nitrogen fertilization.","source":"M5.12: Stage 8 - Mid-fall Dormancy","kind":"module"},{"id":"m5q065","module":"M5","question":"The last snow-mold fungicide application should be made during Stage 8 to protect against Typhula blight and:","correct":"Microdochium patch","options":["Microdochium patch","dollar spot","anthracnose","fairy ring"],"feedback":"The final snow-mold fungicide application at mid-fall dormancy protects against Typhula blight and Microdochium patch.","source":"M5.12: Stage 8 - Mid-fall Dormancy","kind":"module"},{"id":"m5q066","module":"M5","question":"Which of the eight phenological stages comes immediately after \"seed-head pulse\" and before \"summer-stressed growth\"?","correct":"late-spring recuperative growth","options":["late-spring recuperative growth","early spring growth","fall hardening-off period","late-summer recuperative growth"],"feedback":"The order is: spring greenup, early spring growth, seed-head pulse, late-spring recuperative growth, summer-stressed growth, late-summer recuperative growth, fall hardening-off, mid-fall dormancy.","source":"M5.13: Summary","kind":"module"},{"id":"m5q067","module":"M5","question":"Favorable times for intensive core (hollow-tine) cultivation of annual bluegrass greens include late-spring recuperative growth and:","correct":"late-summer recuperative growth","options":["late-summer recuperative growth","summer-stressed growth","mid-fall dormancy","fall hardening-off period"],"feedback":"Both Stage 4 (late-spring) and Stage 6 (late-summer) recuperative growth stages are favorable windows for hollow-tine cultivation.","source":"M5.10: Stage 6 - Late-summer Recuperative Growth","kind":"module"}];const KEY='turf235_exam1_m5_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M5 cleared</h2><p>You retired all 67 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M5 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
