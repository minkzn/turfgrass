", "correct": "ensure adequate preventive control", "options": ["ensure adequate preventive control", "adenine dinucleotide phosphate (NADP", "intercalary meristem that produces", "systemic acquired resistance [SAR"], "feedback": "The last snow-mold fungicide application should be made at this stage to ensure adequate preventive control of both Typhula blight and Microdochium patch.", "source": "M5 · M5.12_ Stage 8 - Mid-fall Dormancy_ TURF 235 Fall 2026 (WC) · PDF p.1", "kind": "module"}, {"id": "m5q149", "module": "M5", "question": "Complete the source statement: “With a reel-type mower, the bedknife pushes aerial shoots forward while the ________ toward the bed knife.”", "correct": "reel knives pull shoots", "options": ["reel knives pull shoots", "bracts called the lemma", "producing many seed heads.", "crown, the flowering culm"], "feedback": "With a reel-type mower, the bedknife pushes aerial shoots forward while the reel knives pull shoots toward the bed knife.", "source": "M5 · M5.6_ Stage 2 - Early Spring Growth_ TURF 235 Fall 2026 (WC) · PDF p.1", "kind": "module"}, {"id": "m5q150", "module": "M5", "question": "Complete the source statement: “The initiation of this stage ________ for a late-season application of nitrogen fertilizer.”", "correct": "presents an excellent window", "options": ["older leaf initiates sheath", "endosperm starch into simple", "inhibited by auxin, initiation", "presents an excellent window"], "feedback": "The initiation of this stage presents an excellent window for a late-season application of nitrogen fertilizer.", "source": "M5 · M5.12_ Stage 8 - Mid-fall Dormancy_ TURF 235 Fall 2026 (WC) · PDF p.1", "kind": "module"}];const KEY='turf235_exam1_m5_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){state=s;return true}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M5 cleared</h2><p>You retired all 150 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}submit.onclick=submitBatch;next.onclick=nextBatch;restart.onclick=()=>{if(confirm('Restart M5 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
