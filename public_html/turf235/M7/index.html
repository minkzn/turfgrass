const BANK=[{"id":"m7q001","module":"M7","question":"The climatic classification system pioneer who originally developed his system in the early 20th century to align climate types with vegetation zones was:","correct":"Wladimir Köppen","options":["Wladimir Köppen","G. T. Trewartha","Al Turgeon","John Kaminski"],"feedback":"Köppen, a German climatologist and botanist, developed the original system aligning climate types with vegetation zones.","source":"M7.2: Climate classification history","kind":"module"},{"id":"m7q002","module":"M7","question":"Trewartha proposed a refinement to Köppen's system in 1966 (and again in 1968) primarily to address limitations in Köppen's treatment of:","correct":"mid-latitude climates (roughly 30°-60°)","options":["mid-latitude climates (roughly 30°-60°)","tropical rainforest climates","polar icecap climates","ocean current patterns"],"feedback":"Trewartha's refinement addressed limitations in how Köppen's system treated mid-latitude climates, between about 30° and 60°.","source":"M7.2: Climate classification history","kind":"module"},{"id":"m7q003","module":"M7","question":"The climatic classification system used in this course was modified from Trewartha's 1968 edition of An Introduction to Climate, based on climatological data from:","correct":"1961-1990","options":["1961-1990","1900-1930","2000-2020","1850-1900"],"feedback":"The course's classification system is based on 1961-1990 climatological data, modified from Trewartha's 1968 system.","source":"M7.3: Climatic Classification System","kind":"module"},{"id":"m7q004","module":"M7","question":"Of the six climatic groups in this system, how many are humid (precipitation exceeds evaporation, P>E)?","correct":"five","options":["five","one","three","six"],"feedback":"Five of the six groups (tropical, subtropical, temperate, subarctic, polar) are humid; only the dry (B) group has P<E.","source":"M7.3: Climatic Classification System","kind":"module"},{"id":"m7q005","module":"M7","question":"The dry (B) climatic group is defined by which relationship between precipitation and evaporation?","correct":"precipitation is less than evaporation (P<E)","options":["precipitation is less than evaporation (P<E)","precipitation equals evaporation exactly","precipitation exceeds evaporation (P>E)","evaporation is negligible year-round"],"feedback":"The dry (B) group is the one group where total precipitation is less than total evaporation.","source":"M7.3: Climatic Classification System","kind":"module"},{"id":"m7q006","module":"M7","question":"In the climatic matrix, the coldest temperatures are associated with which climate group?","correct":"polar","options":["polar","tropical","subtropical","dry"],"feedback":"Polar climates, at or near the poles, are associated with the coldest temperatures in the classification matrix.","source":"M7.3: Climatic Classification System","kind":"module"},{"id":"m7q007","module":"M7","question":"A tropical (A) climate occurs within a frost-free belt extending from the equator to approximately:","correct":"20 degrees north and south latitude","options":["20 degrees north and south latitude","40 degrees north and south latitude","60 degrees north and south latitude","the Arctic and Antarctic circles"],"feedback":"Tropical climates occur within a frost-free belt from the equator to about 20° north and south latitude.","source":"M7.4: Tropical Climate","kind":"module"},{"id":"m7q008","module":"M7","question":"In a tropical wet (Ar) climate, the wet season lasts:","correct":"10-12 months","options":["10-12 months","1-2 months","5-6 months","less than 1 month"],"feedback":"Tropical wet (Ar) climates have a wet season of 10 months or longer.","source":"M7.4: Tropical Climate","kind":"module"},{"id":"m7q009","module":"M7","question":"Tropical wet and dry (monsoon tropics) climates occur in the transition zones between the rainy tropics and the:","correct":"tropical deserts","options":["tropical deserts","polar tundra","subarctic taiga","temperate oceanic zone"],"feedback":"Monsoon tropics occur in transition zones between the perennially wet rainy tropics and perennially dry tropical deserts.","source":"M7.4: Tropical Climate","kind":"module"},{"id":"m7q010","module":"M7","question":"Key West, Florida — with all 12 months averaging above 65°F and rainfall spread fairly uniformly through the year — is classified as:","correct":"tropical wet (Ar)","options":["tropical wet (Ar)","tropical wet and dry (Aw)","subtropical humid (Cf)","dry, arid (BW)"],"feedback":"Key West's year-round warmth and uniform rainfall place it in the tropical wet (Ar) category.","source":"M7.4: Tropical Climate","kind":"module"},{"id":"m7q011","module":"M7","question":"Saigon, Vietnam — where rainfall is concentrated during the summer monsoons — is classified as:","correct":"tropical wet and dry (Aw)","options":["tropical wet and dry (Aw)","tropical wet (Ar)","subtropical dry-summer (Cs)","subarctic (E)"],"feedback":"Saigon's summer-concentrated monsoon rainfall places it in the tropical wet and dry, or monsoon tropics (Aw), category.","source":"M7.4: Tropical Climate","kind":"module"},{"id":"m7q012","module":"M7","question":"Within dry (B) climates, the boundary between arid (BW) and semiarid (BS) types occurs where precipitation is about half the humid/semiarid boundary amount — usually less than:","correct":"10 inches","options":["10 inches","2 inches","25 inches","50 inches"],"feedback":"The arid/semiarid boundary occurs at roughly half the humid boundary's precipitation, usually under 10 inches.","source":"M7.5: Dry Climate","kind":"module"},{"id":"m7q013","module":"M7","question":"Within dry climates, the cold subtype (k) occurs in temperate and subarctic zones, while the hot subtype (h) occurs in:","correct":"subtropical and tropical zones","options":["subtropical and tropical zones","polar and subarctic zones","temperate zones only","oceanic zones only"],"feedback":"Dry climates split into cold (k, temperate/subarctic) and hot (h, subtropical/tropical) subtypes.","source":"M7.5: Dry Climate","kind":"module"},{"id":"m7q014","module":"M7","question":"Phoenix, Arizona has an annual precipitation (P) well below R/2 in the dry-climate formula, and falls within the subtropical thermal zone (7 months above 65°F); its classification is:","correct":"BWh","options":["BWh","BSk","Csa","Dcfa"],"feedback":"Phoenix is BWh: arid (P < R/2) and hot (h, because it falls in the subtropical zone).","source":"M7.5: Dry Climate","kind":"module"},{"id":"m7q015","module":"M7","question":"Subtropical (C) climates extend poleward from the tropics to about:","correct":"40 degrees north and south latitude","options":["40 degrees north and south latitude","20 degrees north and south latitude","60 degrees north and south latitude","the equator only"],"feedback":"Subtropical climates extend from the tropics to roughly 40° north and south latitude.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q016","module":"M7","question":"A subtropical climate requires at least how many months with average temperatures of 50°F or higher?","correct":"8","options":["8","4","12","1"],"feedback":"Subtropical (C) climates have 8 or more months with average temperatures at or above 50°F.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q017","module":"M7","question":"Subtropical dry-summer (Cs) climates, with a rainy winter season and mild weather year-round, typically occur on which side of continents?","correct":"west side","options":["west side","east side","only in the interior","only at the equator"],"feedback":"Subtropical dry-summer climates typically occur on the west side of continents.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q018","module":"M7","question":"Subtropical humid (Cf) climates, with no dry season and summer as the wettest season, typically occur on which side of continents?","correct":"east side","options":["east side","west side","only in the highlands","only near deserts"],"feedback":"Subtropical humid climates typically occur on the east side of continents.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q019","module":"M7","question":"Within subtropical and temperate climate subtypes, the hot subtype is labeled \"a\" and the cool subtype is labeled:","correct":"b","options":["b","c","k","w"],"feedback":"Hot (a) and cool (b) subtypes distinguish summer temperature within subtropical and temperate climates.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q020","module":"M7","question":"Newport Beach, California — mild year-round with a rainy winter and a warmest-month average below 72°F — is classified as a cool subtropical dry-summer climate, also known as:","correct":"Mediterranean climate","options":["Mediterranean climate","monsoon tropics","boreal climate","transition zone"],"feedback":"Newport Beach's Csb classification is also commonly called a Mediterranean climate.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q021","module":"M7","question":"Tulsa, Oklahoma — with uniform year-round rainfall and a warmest-month average above 80°F — is classified as:","correct":"Cfa (warm subtropical humid)","options":["Cfa (warm subtropical humid)","Csb (Mediterranean)","BWh (hot desert)","Dofb (cool oceanic temperate)"],"feedback":"Tulsa's uniform rainfall and hot summers (warmest month >80°F) place it in the warm subtropical humid (Cfa) category.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q022","module":"M7","question":"In turfgrass management, the \"Transition Zone\" — where warm-season grasses struggle with winter and cool-season grasses struggle with summer heat — generally conforms in the U.S. to which climate type?","correct":"cool subtropical humid (Cfb)","options":["cool subtropical humid (Cfb)","tropical wet (Ar)","polar tundra (Ft)","hot desert (BWh)"],"feedback":"The U.S. Transition Zone generally corresponds to a cool subtropical humid (Cfb) climate: 7-11 months above 50°F, uniform rainfall, warmest month below 80°F.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q023","module":"M7","question":"In the Köppen system, a \"transition zone\" refers not to a formally defined category, but to geographic areas where:","correct":"two or more climate types converge","options":["two or more climate types converge","precipitation is measured incorrectly","only tropical climates occur","elevation has no effect on climate"],"feedback":"A transition zone describes areas where two or more Köppen climate types converge into a gradual or complex shift.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q024","module":"M7","question":"Temperate (D) climates have average temperatures of 50°F or higher for how many months?","correct":"4 to 7","options":["4 to 7","1 to 3","8 or more","all 12"],"feedback":"Temperate (D) climates have 4 to 7 months with average temperatures at or above 50°F.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q025","module":"M7","question":"The two main types of temperate climate are oceanic (Do) and:","correct":"continental (Dc)","options":["continental (Dc)","tropical (Dt)","arid (Dw)","polar (Df)"],"feedback":"Temperate climates split into oceanic (Do) and continental (Dc) main types.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q026","module":"M7","question":"The boundary separating temperate oceanic (Do) from temperate continental (Dc) climates is the ________ isotherm for the coolest month.","correct":"32°F","options":["32°F","50°F","0°F","72°F"],"feedback":"The Do/Dc boundary is defined by the 32°F isotherm for the coldest month.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q027","module":"M7","question":"The 72°F isotherm for the warmest month is used to distinguish between which subtypes in temperate and subtropical climates?","correct":"hot (a) and cool (b)","options":["hot (a) and cool (b)","wet and dry","oceanic and continental","tropical and subarctic"],"feedback":"The 72°F isotherm for the warmest month separates hot (a) from cool (b) subtypes.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q028","module":"M7","question":"Temperate oceanic (Do) climates, with mild wet winters and cool summers, typically occur on which side of continents?","correct":"west side","options":["west side","east side","only at high elevation","only near the equator"],"feedback":"Temperate oceanic climates, like temperate continental's western counterpart, typically occur on the west side of continents.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q029","module":"M7","question":"Temperate continental (Dc) climates, with relatively severe winters, typically occur on which side of continents?","correct":"east side","options":["east side","west side","only along coastlines","only in the tropics"],"feedback":"Temperate continental climates typically occur on the east side of continents, with more severe winters than oceanic counterparts.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q030","module":"M7","question":"St. Andrews, Scotland — with uniform rainfall, a warmest month well below 72°F, and a coldest month above 32°F — is classified as:","correct":"Dofb (cool humid temperate-oceanic)","options":["Dofb (cool humid temperate-oceanic)","Dcfa (warm humid temperate-continental)","BSk (cold semiarid)","Cfa (warm subtropical humid)"],"feedback":"St. Andrews qualifies as Dofb: temperate, oceanic, no dry season, and cool summers.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q031","module":"M7","question":"Pontiac, Michigan — with uniform rainfall and a warmest month above 72°F — is classified as:","correct":"Dcfa (warm humid temperate-continental)","options":["Dcfa (warm humid temperate-continental)","Dofb (cool humid temperate-oceanic)","Aw (tropical wet and dry)","Ft (polar tundra)"],"feedback":"Pontiac's continental setting and warm summer (>72°F) place it in the Dcfa category.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q032","module":"M7","question":"Subarctic (E), or boreal, climates have how many months with average temperatures above 50°F?","correct":"one to three","options":["one to three","four to seven","eight or more","none"],"feedback":"Subarctic climates have just one to three months averaging above 50°F.","source":"M7.8: Subarctic Climate","kind":"module"},{"id":"m7q033","module":"M7","question":"Anchorage, Alaska, with three months above 50°F and relatively low rainfall, is classified as:","correct":"subarctic (E)","options":["subarctic (E)","temperate continental (Dc)","polar tundra (Ft)","tropical wet (Ar)"],"feedback":"Anchorage's short, cool summer window and low rainfall place it in the subarctic (E) category.","source":"M7.8: Subarctic Climate","kind":"module"},{"id":"m7q034","module":"M7","question":"Polar (F) climates occur where average temperatures for all months are below:","correct":"50°F","options":["50°F","32°F","65°F","0°F"],"feedback":"Polar climates are defined by all months averaging below 50°F.","source":"M7.9: Polar Climate","kind":"module"},{"id":"m7q035","module":"M7","question":"Within polar climates, polar tundra (Ft) has a warmest month above 32°F, while polar icecap (Fi) has:","correct":"temperatures below 32°F for all months","options":["temperatures below 32°F for all months","a warmest month above 50°F","only summer precipitation","no distinguishing feature"],"feedback":"Polar icecap (Fi) climates stay below 32°F in every month, unlike polar tundra (Ft), which rises above 32°F in its warmest month.","source":"M7.9: Polar Climate","kind":"module"},{"id":"m7q036","module":"M7","question":"Within the United States, much of the eastern portion is temperate continental in the north and ________ in the south.","correct":"subtropical humid","options":["subtropical humid","polar tundra","tropical wet","subarctic"],"feedback":"The eastern U.S. transitions from temperate continental in the north to subtropical humid in the south.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q037","module":"M7","question":"Within the continental United States, which small area is classified as a tropical climate?","correct":"the southernmost portion of Florida","options":["the southernmost portion of Florida","coastal Southern California","the Gulf Coast of Texas","the Outer Banks of North Carolina"],"feedback":"The southernmost tip of Florida is the only part of the continental U.S. classified as tropical.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q038","module":"M7","question":"Along the U.S. west coast, climates range from subtropical dry-summer in California to which type further north in Oregon and Washington?","correct":"temperate oceanic","options":["temperate oceanic","tropical wet","subarctic","polar tundra"],"feedback":"Moving north along the U.S. west coast, climate shifts from subtropical dry-summer (California) to temperate oceanic (Oregon, Washington).","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q039","module":"M7","question":"Much of Canada, to the north of the U.S., is classified as:","correct":"subarctic","options":["subarctic","tropical","subtropical humid","polar icecap"],"feedback":"Much of Canada falls within the subarctic climate classification.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q040","module":"M7","question":"Because at least half of South America lies within 200 miles of the equator, much of the continent is classified as:","correct":"tropical","options":["tropical","polar","subarctic","dry"],"feedback":"South America's proximity to the equator over much of its area makes tropical the predominant classification.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q041","module":"M7","question":"In South America, temperate climates are largely restricted to:","correct":"the Chilean coast","options":["the Chilean coast","the Amazon basin","the Andes foothills in Peru","northern Brazil"],"feedback":"Unlike the broader temperate belts elsewhere, South America's temperate climates are largely confined to the Chilean coast.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q042","module":"M7","question":"A subtropical dry-summer (Cs) climate occurs within a narrow band in Northern Africa and Southern Europe surrounding the Mediterranean Sea — this is commonly called:","correct":"the Mediterranean climate","options":["the Mediterranean climate","the Transition Zone","the boreal climate","the monsoon climate"],"feedback":"This narrow Cs band around the Mediterranean Sea gives the Mediterranean climate its name.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q043","module":"M7","question":"Because northwestern Europe lacks major mountain ranges (unlike northwestern North America), a temperate-oceanic climate exists across a:","correct":"much larger area","options":["much larger area","much smaller, coastal-only strip","area limited to river valleys","area limited to high elevations"],"feedback":"The absence of major mountain barriers lets temperate-oceanic climate spread much further inland across northwestern Europe than in North America.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q044","module":"M7","question":"Much of the interior of Central and Northern Asia is dry and, at high elevations, cold — largely due to:","correct":"extensive mountain ranges and the vastness of the continent","options":["extensive mountain ranges and the vastness of the continent","proximity to the Arctic Ocean alone","lack of any mountain ranges","excessive rainfall from monsoons"],"feedback":"Extensive mountain ranges and sheer continental size drive the dry, cold interior climate of Central and Northern Asia.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q045","module":"M7","question":"In Australia, subtropical climates occur along the southern coastal areas, while tropical climates cover a substantial portion of the:","correct":"northern coastal area","options":["northern coastal area","central desert interior","southeastern highlands","western coast only"],"feedback":"Australia's tropical climates dominate the northern coast, while subtropical climates occur along the south.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q046","module":"M7","question":"New Zealand, about 1,000 miles east of Australia, has a subtropical-humid climate to the north and which climate to the south?","correct":"temperate-oceanic","options":["temperate-oceanic","tropical wet","polar tundra","subarctic"],"feedback":"New Zealand transitions from subtropical-humid in the north to temperate-oceanic in the south.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q047","module":"M7","question":"In the United States, major mountain ranges run mostly:","correct":"north and south","options":["north and south","east and west","diagonally, northeast to southwest","there are no major mountain ranges"],"feedback":"U.S. mountain ranges (Cascades, Rockies, Appalachians) run predominantly north-south, dramatically shaping regional climate.","source":"M7.11: United States Topographical Map","kind":"module"},{"id":"m7q048","module":"M7","question":"As air passes over the Cascade and Rocky Mountains in the U.S., it loses much of its moisture, resulting in a vast region of ________ to the east.","correct":"dry climates","options":["dry climates","tropical rainforest","subarctic tundra","polar icecap"],"feedback":"Moisture loss as air crosses the Cascades and Rockies creates the vast dry region to their east.","source":"M7.11: United States Topographical Map","kind":"module"},{"id":"m7q049","module":"M7","question":"Warm, moist air from the Gulf of Mexico provides much of the moisture supporting the humid climates of which part of the United States?","correct":"the eastern portion","options":["the eastern portion","the Pacific Northwest","the Great Basin","southern California"],"feedback":"Gulf of Mexico moisture feeds the humid climates found across the eastern United States.","source":"M7.11: United States Topographical Map","kind":"module"},{"id":"m7q050","module":"M7","question":"The Appalachian Mountains, running through the Mid-Atlantic states, result in substantially cooler weather in the highlands compared to:","correct":"the eastern coast","options":["the eastern coast","the Gulf Coast","the desert Southwest","the Great Lakes region"],"feedback":"The Appalachian highlands are substantially cooler than the eastern coastal areas at similar latitudes.","source":"M7.11: United States Topographical Map","kind":"module"},{"id":"m7q051","module":"M7","question":"Unlike in the United States, mountain ranges in continental Europe run mostly:","correct":"east and west","options":["east and west","north and south","diagonally only","Europe has no significant mountain ranges"],"feedback":"European mountain ranges run mostly east-west, unlike the north-south ranges of the U.S., which changes how climate zones spread across the continent.","source":"M7.11: United States Topographical Map","kind":"module"},{"id":"m7q052","module":"M7","question":"Climate fundamentally determines turfgrass species suitability; factors it influences include the length of the growing season, temperature extremes, seasonal precipitation patterns, and:","correct":"drought risk","options":["drought risk","soil color","mower blade sharpness","seed label formatting"],"feedback":"Climate-driven factors like growing season length, temperature extremes, precipitation patterns, and drought risk shape turfgrass management decisions.","source":"M7.2: Climate classification history","kind":"module"},{"id":"m7q053","module":"M7","question":"Local climate factors that directly influence day-to-day turfgrass management practices include microclimates, elevation, urban heat effects, and:","correct":"soil moisture patterns","options":["soil moisture patterns","global ocean currents only","the Köppen classification letter","continental drift"],"feedback":"Local factors like microclimates, elevation, urban heat effects, and soil moisture patterns directly shape daily management, distinct from the broad global framework.","source":"M7.2: Climate classification history","kind":"module"},{"id":"m7q054","module":"M7","question":"Birmingham, Alabama, has a ________ climatic type.","correct":"subtropical-humid","options":["subtropical-humid","subtropical-dry summer","tropical wet","tropical wet&dry"],"feedback":"Birmingham has a humid subtropical climate — warm with rainfall spread through the year, like Tulsa (Cfa) in the module examples.","source":"M7 Quiz","kind":"module"},{"id":"m7q055","module":"M7","question":"Indicate whether warm- or cool-season turfgrasses would be expected to thrive in Bogotá, Colombia.","correct":"cool","options":["warm","cool"],"feedback":"Despite its near-equatorial latitude, Bogotá sits at roughly 8,600 feet elevation, giving it a cool, mild climate (average around 57°F/14°C year-round) better suited to cool-season turf.","source":"M7 Quiz","kind":"module"},{"id":"m7q056","module":"M7","question":"Indicate whether warm- or cool-season turfgrasses would be expected to thrive in Sydney, Australia.","correct":"warm","options":["warm","cool"],"feedback":"Sydney has a humid subtropical climate, and lawns there are dominated by warm-season grasses such as kikuyu, buffalo, and couch (bermuda).","source":"M7 Quiz","kind":"module"},{"id":"m7q057","module":"M7","question":"The wet versus wet-and-dry climatic types (Ar vs. Aw/As) are used within a ________ climate.","correct":"tropical","options":["subarctic","temperate","subtropical","tropical"],"feedback":"Wet (Ar) and wet-and-dry (Aw/As) subtypes distinguish moisture patterns within the tropical (A) climate group.","source":"M7.4: Tropical Climate","kind":"module"},{"id":"m7q058","module":"M7","question":"The continental versus oceanic climatic types (Dc vs. Do) are used within a ________ climate.","correct":"temperate","options":["subarctic","temperate","subtropical","tropical"],"feedback":"Continental (Dc) and oceanic (Do) are the two main types within the temperate (D) climate group.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q059","module":"M7","question":"Orlando, Florida, has a ________ climate type.","correct":"subtropical-humid","options":["subtropical-humid","subtropical-dry summer","tropical wet","tropical wet&dry"],"feedback":"Orlando is humid subtropical (Cfa), not tropical — its winter months average below the 65°F threshold this course uses for a tropical (Ar) classification, unlike year-round-warm Key West.","source":"M7 Quiz","kind":"module"},{"id":"m7q060","module":"M7","question":"Identify the climatic type (using this course's abbreviations) of Durban, South Africa.","correct":"Cf","options":["Cf","Do","Cs","Dc"],"feedback":"Durban has a humid subtropical climate with rainfall year-round, classified Cf (subtropical humid) in this course's scheme.","source":"M7 Quiz","kind":"module"},{"id":"m7q061","module":"M7","question":"Identify the climatic type (using this course's abbreviations) of London, England.","correct":"Do","options":["Cf","Do","Cs","Dc"],"feedback":"London has a mild, wet, temperate oceanic climate — Do — the same classification as St. Andrews, Scotland, in the module's own example.","source":"M7 Quiz","kind":"module"},{"id":"m7q062","module":"M7","question":"A climatic type with mild winters and cool summers is ________.","correct":"temperate-oceanic","options":["temperate-continental","temperate-oceanic","subarctic-continental","subarctic-oceanic"],"feedback":"Temperate oceanic (Do) climates have mild, wet winters and cool summers, typically on the west side of continents.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q063","module":"M7","question":"A steppe (semiarid, BS) is wetter or dryer than a desert (arid, BW)?","correct":"wetter","options":["wetter","dryer"],"feedback":"Steppe (semiarid) climates receive more precipitation than desert (arid) climates; the BW/BS boundary is set at about half the humid/dry boundary's precipitation.","source":"M7.5: Dry Climate","kind":"module"},{"id":"m7q064","module":"M7","question":"A climate in which average temperatures are at least 50°F for 4-7 months is ________.","correct":"temperate","options":["subarctic","temperate","subtropical","tropical"],"feedback":"4 to 7 months above 50°F is the defining range for a temperate (D) climate.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q065","module":"M7","question":"Climates in which evaporation (E) exceeds precipitation (P) are called ________.","correct":"dry","options":["hot","warm","dry","semihumid"],"feedback":"Dry (B) climates are defined by evaporation exceeding precipitation (P<E).","source":"M7.5: Dry Climate","kind":"module"},{"id":"m7q066","module":"M7","question":"A climatic type with cold winters and warm summers is ________.","correct":"temperate-continental","options":["temperate-continental","temperate-oceanic","subarctic-continental","subarctic-oceanic"],"feedback":"Temperate continental (Dc) climates have relatively severe (cold) winters with summers that can be warm (a) or cool (b), unlike the mild winters of temperate oceanic climates.","source":"M7.7: Temperate Climate","kind":"module"},{"id":"m7q067","module":"M7","question":"Indicate whether warm- or cool-season turfgrasses would be expected to thrive in Mexico City, Mexico.","correct":"warm","options":["warm","cool"],"feedback":"Despite its elevation, Mexico City's subtropical latitude keeps it classified for warm-season turf — unlike Bogotá, which sits far enough into cool territory to favor cool-season grasses.","source":"M7 Quiz","kind":"module"},{"id":"m7q068","module":"M7","question":"Identify the climatic type (using this course's abbreviations) of Auckland, New Zealand.","correct":"Cf","options":["Cf","Do","Cs","Dc"],"feedback":"Auckland, in the north of New Zealand, has a subtropical-humid (Cf) climate; the temperate-oceanic climate is found further south on the island.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q069","module":"M7","question":"A climate in which average temperatures are at least 50°F for 8-11 months is ________.","correct":"subtropical","options":["subarctic","temperate","subtropical","tropical"],"feedback":"8 to 11 months above 50°F defines a subtropical (C) climate — 12 months would instead be tropical.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q070","module":"M7","question":"Indicate whether warm- or cool-season turfgrasses would be expected to thrive in Mobile, Alabama.","correct":"warm","options":["warm","cool"],"feedback":"Mobile, on the Gulf Coast, has a hot, humid subtropical climate well suited to warm-season turf such as bermudagrass and St. Augustinegrass.","source":"M7 Quiz","kind":"module"},{"id":"m7q071","module":"M7","question":"Along the northwestern coast of the U.S., a ________ climatic type exists.","correct":"temperate-oceanic","options":["temperate-continental","temperate-oceanic","subarctic-continental","subarctic-oceanic"],"feedback":"The Pacific Northwest coast (Oregon, Washington) has a temperate-oceanic climate.","source":"M7.10: Temperature-Based Climate Classification System","kind":"module"},{"id":"m7q072","module":"M7","question":"The hot (a) and cool (b) subtypes are used within temperate and ________ climates only.","correct":"subtropical","options":["polar","subarctic","subtropical","tropical"],"feedback":"The a/b (hot/cool) subtype distinction applies only within the temperate and subtropical climate groups, not tropical, subarctic, or polar.","source":"M7.6: Subtropical Climate","kind":"module"},{"id":"m7q073","module":"M7","question":"Cool-season turfgrasses are generally adapted to temperate and ________ climates.","correct":"subarctic","options":["subarctic","temperate","subtropical","tropical"],"feedback":"Cool-season turfgrasses are generally adapted to temperate and subarctic climates, where their C3 physiology and vernalization requirements fit the cooler thermal window.","source":"M7.3: Climatic Classification System","kind":"module"}];const KEY='turf235_exam1_m7_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){state=s;return true}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M7 cleared</h2><p>You retired all 73 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}submit.onclick=submitBatch;next.onclick=nextBatch;restart.onclick=()=>{if(confirm('Restart M7 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
