<style>
:root{--g:#0d5722;--good:#187b35;--bad:#b52d2d;--line:#c9d4ca;--muted:#657167}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f8f3;color:#142018}header{padding:25px 14px 13px;text-align:center;background:linear-gradient(135deg,#0c4d1f,#19452a);color:#fff}h1{font-size:clamp(32px,6vw,58px);line-height:1;margin:0}header p{margin:9px auto 0;max-width:850px;color:#dce9df}.progress{height:10px;background:#d6e1d7;max-width:650px;margin:12px auto 0;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#8fd19e}.toolbar{position:sticky;top:0;z-index:10;background:#f7faf6ee;backdrop-filter:blur(8px);border-bottom:1px solid #d7e0d7}.row{max-width:1050px;margin:auto;padding:9px 12px;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}button{font:inherit;font-weight:750;border:1px solid #aebcaf;border-radius:10px;background:#fff;padding:9px 12px;cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:1050px;margin:17px auto 55px;padding:0 14px}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800}.card{background:white;border:1px solid #b9c6ba;border-radius:15px;overflow:hidden;margin:0 0 15px;box-shadow:0 5px 15px rgba(12,70,25,.05)}.card.correct{border:2px solid var(--good)}.card.wrong{border:2px solid var(--bad)}.head{background:#edf3ee;padding:10px 13px;display:flex;justify-content:space-between;gap:10px;font-weight:800}.body{padding:14px}.stem{font-size:16.5px;font-weight:650;margin-bottom:11px}.opt{display:block;padding:10px;border:1px solid #d3dcd4;border-radius:9px;margin:7px 0;cursor:pointer}.opt input{margin-right:9px}.opt.good{background:#eaf7ed;border-color:var(--good)}.opt.bad{background:#fff0f0;border-color:var(--bad)}.feedback{display:non </style></head><body><header><h1>M8 • 45 Questions</h1><p>TURF 235 Exam 1 practice. Ten at a time. Correct questions retire; misses cycle back until you clear the module.</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="toolbar"><div class="row"><button class="primary" id="restart">Restart M8</button><button id="clear">Clear Saved Progress</button><a href="../index.html"><button>All Modules</button></a></div></div><main><div class="stats"><div class="stat" id="remaining">Remaining: 45</div><div class="stat" id="mastered">Mastered: 0</div><div class="stat" id="misses">Misses: 0</div><div class="stat" id="batch">Batch: —</div></div><div id="quiz"></div><div class="actions"><button class="primary" id="submit">Submit 10</button><button class="primary" id="next" disabled>Next 10 →</button></div></main><script>
const BANK=[{"id":"m8q001","module":"M8","question":"Every living thing is identified by two names: its species, and the ________ to which it belongs.","correct":"genus","options":["genus","tribe","subfamily","family"],"feedback":"Every organism is identified by its genus and species — the two components of the Latin binomial.","source":"M8.1: Overview","kind":"module"},{"id":"m8q002","module":"M8","question":"Taxonomic organization proceeds from genera, which are grouped into tribes, then into subfamilies, and finally into:","correct":"families","options":["families","kingdoms","orders","phyla"],"feedback":"The taxonomic hierarchy used here goes genus → tribe → subfamily → family.","source":"M8.1: Overview","kind":"module"},{"id":"m8q003","module":"M8","question":"The thousands of grass species worldwide all belong to a single plant family called the:","correct":"Poaceae","options":["Poaceae","Fabaceae","Asteraceae","Cyperaceae"],"feedback":"All grasses, including every turfgrass species, belong to the single family Poaceae.","source":"M8.1: Overview","kind":"module"},{"id":"m8q004","module":"M8","question":"The grass family was historically called the Gramineae; today it is referred to as the:","correct":"Poaceae","options":["Poaceae","Cyperaceae","Juncaceae","Festucoideae"],"feedback":"The grass family's older name, Gramineae, has been replaced by Poaceae.","source":"M8.2: Taxonomy of Turfgrasses","kind":"module"},{"id":"m8q005","module":"M8","question":"Of the grass family's six subfamilies, how many contain turfgrasses?","correct":"three","options":["three","one","five","six"],"feedback":"Only 3 of the grass family's 6 subfamilies contain turfgrass species.","source":"M8.2: Taxonomy of Turfgrasses","kind":"module"},{"id":"m8q006","module":"M8","question":"Of the roughly 7,500 grass species worldwide, about how many are currently used as turfgrasses?","correct":"40","options":["40","4","400","4,000"],"feedback":"About 40 of the ~7,500 grass species are currently used as turfgrasses.","source":"M8.2: Taxonomy of Turfgrasses","kind":"module"},{"id":"m8q007","module":"M8","question":"Turfgrasses are drawn from 17 of the roughly 600 grass genera, and from how many of the grass family's 25 tribes?","correct":"7","options":["7","3","17","25"],"feedback":"Turfgrasses are drawn from 7 of the grass family's 25 tribes.","source":"M8.2: Taxonomy of Turfgrasses","kind":"module"},{"id":"m8q008","module":"M8","question":"Within the Pooideae (pooid) subfamily, the genus Agrostis (bentgrasses) belongs to which tribe?","correct":"Aveneae","options":["Aveneae","Festuceae","Chlorideae","Paniceae"],"feedback":"Agrostis (bentgrasses) belongs to the Aveneae tribe within the Pooideae subfamily.","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q009","module":"M8","question":"Within the Pooideae subfamily, the tribe Festuceae includes which three genera?","correct":"Poa, Lolium, and Festuca","options":["Poa, Lolium, and Festuca","Cynodon, Buchloe, and Zoysia","Axonopus, Pennisetum, and Paspalum","Agrostis, Eremochloa, and Stenotaphrum"],"feedback":"Festuceae includes Poa (bluegrasses), Lolium (ryegrasses), and Festuca (fescues).","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q010","module":"M8","question":"The Chloridoideae subfamily contains a single tribe, the Chlorideae, which includes Cynodon (bermudagrasses), Buchloe (buffalograss), and:","correct":"Zoysieae (zoysiagrasses)","options":["Zoysieae (zoysiagrasses)","Festuca (fescues)","Agrostis (bentgrasses)","Eremochloa (centipedegrass)"],"feedback":"The Chlorideae tribe includes Cynodon, Buchloe, and Zoysieae.","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q011","module":"M8","question":"Within the Panicoideae subfamily, the genus Eremochloa (centipedegrass) belongs to the tribe:","correct":"Rottboellinae","options":["Rottboellinae","Paniceae","Chlorideae","Festuceae"],"feedback":"Eremochloa belongs to the Rottboellinae tribe, distinct from the Paniceae tribe in the same subfamily.","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q012","module":"M8","question":"Within the Panicoideae's Paniceae tribe are the genera Axonopus (carpetgrass), Pennisetum (kikuyugrass), Stenotaphrum (St. Augustinegrass), and:","correct":"Paspalum (bahiagrass, seashore paspalum)","options":["Paspalum (bahiagrass, seashore paspalum)","Cynodon (bermudagrasses)","Agrostis (bentgrasses)","Poa (bluegrasses)"],"feedback":"Paspalum, covering bahiagrass and seashore paspalum, is the fourth genus in the Paniceae tribe.","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q013","module":"M8","question":"Pooid turfgrasses fix carbon principally through the C3 cycle and occur mostly in temperate and subarctic climates; the panicoids and chloridoids instead fix carbon through the:","correct":"C4 pathway","options":["C4 pathway","C2 pathway","Calvin cycle only","photorespiration pathway"],"feedback":"Panicoid and chloridoid turfgrasses are warm-season species using the C4 pathway, unlike the C3 pooids.","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q014","module":"M8","question":"Pooid turfgrasses are usually long-day plants requiring vernalization; panicoid and chloridoid turfgrasses are usually short-day or day-neutral plants requiring:","correct":"warm nights and no vernalization","options":["warm nights and no vernalization","cold nights and heavy vernalization","constant darkness","no temperature requirement at all"],"feedback":"Panicoid/chloridoid grasses need warm nights and have no vernalization requirement for flowering, unlike the pooids.","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q015","module":"M8","question":"The optimum shoot-growth temperature range for pooid turfgrasses is 60 to 75°F; for panicoid and chloridoid turfgrasses it is:","correct":"80 to 95°F","options":["80 to 95°F","50 to 65°F","70 to 85°F","95 to 110°F"],"feedback":"Panicoid and chloridoid (warm-season) turfgrasses have an optimum shoot growth range of 80-95°F, versus 60-75°F for pooids.","source":"M8.3: Turfgrass Taxonomy","kind":"module"},{"id":"m8q016","module":"M8","question":"In pooid species, root hairs arise from specialized epidermal cells called tricoblasts; in chloridoid and panicoid species, root hairs can arise from:","correct":"all epidermal cells","options":["all epidermal cells","the root cap only","the endodermis only","the pericycle only"],"feedback":"Unlike pooids (tricoblasts only), chloridoid and panicoid species can form root hairs from any epidermal cell.","source":"M8.4: Roots, Stems, Leaves, Inflorescence and Embryo","kind":"module"},{"id":"m8q017","module":"M8","question":"In pooid species, the culm internodes are hollow; in chloridoid and panicoid species, they are:","correct":"solid","options":["solid","also hollow","absent entirely","filled with mucilage"],"feedback":"Pooid culm internodes are hollow, while chloridoid and panicoid culm internodes are solid.","source":"M8.4: Roots, Stems, Leaves, Inflorescence and Embryo","kind":"module"},{"id":"m8q018","module":"M8","question":"Pooid and panicoid species generally have membranous ligules; chloridoid species usually have ligules that are:","correct":"a fringe of hairs","options":["a fringe of hairs","completely absent","waxy and rigid","identical to pooid ligules"],"feedback":"Chloridoid ligules are usually a fringe of hairs, unlike the membranous ligules typical of pooid and panicoid species.","source":"M8.4: Roots, Stems, Leaves, Inflorescence and Embryo","kind":"module"},{"id":"m8q019","module":"M8","question":"Pooid and chloridoid spikelets contain one to several fertile florets; a panicoid spikelet instead contains:","correct":"one fertile and one sterile floret","options":["one fertile and one sterile floret","only sterile florets","exactly five fertile florets","no florets at all"],"feedback":"Panicoid spikelets are distinctive in containing just one fertile floret paired with one sterile floret.","source":"M8.4: Roots, Stems, Leaves, Inflorescence and Embryo","kind":"module"},{"id":"m8q020","module":"M8","question":"The mesocotyl internode is absent in pooid species but present in chloridoid and panicoid species; correspondingly, the pooid embryo occupies about ________ of the caryopsis, versus about half in the other two subfamilies.","correct":"one fifth","options":["one fifth","nine tenths","exactly half","one tenth"],"feedback":"Pooid embryos occupy about 1/5 of the caryopsis (small embryo, no mesocotyl); chloridoid/panicoid embryos occupy about 1/2 (large embryo, mesocotyl present).","source":"M8.4: Roots, Stems, Leaves, Inflorescence and Embryo","kind":"module"},{"id":"m8q021","module":"M8","question":"In the Latin binomial Poa pratensis, \"Poa\" designates the genus and \"pratensis\" designates the:","correct":"species","options":["species","subfamily","tribe","cultivar"],"feedback":"In a Latin binomial, the first word is the genus and the second is the species.","source":"M8.5: Latin Binomial and Authorities","kind":"module"},{"id":"m8q022","module":"M8","question":"The taxonomic authority abbreviation \"L.\" following a Latin binomial refers to:","correct":"Carl Linnaeus","options":["Carl Linnaeus","William Hudson","Johann von Schreber","Christiaan Persoon"],"feedback":"\"L.\" is the abbreviation for Carl Linnaeus, the 18th-century father of plant taxonomy.","source":"M8.5: Latin Binomial and Authorities","kind":"module"},{"id":"m8q023","module":"M8","question":"Carl Linnaeus, the \"father of plant taxonomy,\" is described in the module as working primarily during which century?","correct":"the 18th century","options":["the 18th century","the 15th century","the 20th century","the 12th century"],"feedback":"Linnaeus (1707-1778) was an 18th-century botanist, described as the father of plant taxonomy.","source":"M8.5: Latin Binomial and Authorities","kind":"module"},{"id":"m8q024","module":"M8","question":"In the Latin name Cynodon dactylon [L.] Pers., the bracketed [L.] indicates the secondary (original describing) authority, while Pers. is the:","correct":"primary authority who moved it to its current genus","options":["primary authority who moved it to its current genus","only valid authority; the bracket is disregarded","cultivar name","subspecies designation"],"feedback":"Persoon is the primary authority, having moved the species (originally described by Linnaeus) into the Cynodon genus.","source":"M8.5: Latin Binomial and Authorities","kind":"module"},{"id":"m8q025","module":"M8","question":"In the name Bouteloua gracilis [H.B.K.] Lag. ex Steud., the term \"ex\" indicates that Lagasca first proposed the name, while Steudel:","correct":"later provided the valid description","options":["later provided the valid description","rejected the name entirely","was Lagasca's student","discovered a different species"],"feedback":"\"Ex\" indicates the name was proposed by one authority (Lagasca) but validly described by another (Steudel).","source":"M8.5: Latin Binomial and Authorities","kind":"module"},{"id":"m8q026","module":"M8","question":"Kentucky bluegrass (Poa pratensis L.) is known in Europe by a different common name:","correct":"fine-leaved meadowgrass","options":["fine-leaved meadowgrass","browntop bentgrass","annual meadow-poa","creeping meadowgrass"],"feedback":"Poa pratensis is called Kentucky bluegrass in the U.S. but fine-leaved meadowgrass in Europe — the Latin name stays constant.","source":"M8.6: Names","kind":"module"},{"id":"m8q027","module":"M8","question":"Colonial bentgrass (Agrostis capillaris L.) is known in Europe as:","correct":"browntop bentgrass","options":["browntop bentgrass","fine-leaved meadowgrass","creeping bent","velvet bent"],"feedback":"Agrostis capillaris is called colonial bentgrass in the U.S. and browntop bentgrass in Europe.","source":"M8.6: Names","kind":"module"},{"id":"m8q028","module":"M8","question":"Creeping bentgrass carries two different Latin names, Agrostis stolonifera L. and Agrostis palustris Huds., reflecting two different:","correct":"taxonomic authorities","options":["taxonomic authorities","growth habits","climate adaptations","ploidy levels"],"feedback":"Creeping bentgrass's two Latin names reflect the different taxonomic authorities (Linnaeus and Hudson) credited with naming it.","source":"M8.6: Names","kind":"module"},{"id":"m8q029","module":"M8","question":"Redtop carries two Latin names: Agrostis alba L. and:","correct":"Agrostis gigantea With.","options":["Agrostis gigantea With.","Agrostis palustris Huds.","Agrostis capillaris L.","Agrostis canina L."],"feedback":"Redtop's two Latin names, from Linnaeus and Withering, are Agrostis alba L. and Agrostis gigantea With.","source":"M8.6: Names","kind":"module"},{"id":"m8q030","module":"M8","question":"For some species, such as Poa annua, the Latin name is:","correct":"more popular than the common name (annual bluegrass)","options":["more popular than the common name (annual bluegrass)","never used in practice","identical to its common name","reserved for scientific papers only"],"feedback":"Poa annua is a case where the Latin name is more commonly used in everyday speech than its common name, annual bluegrass.","source":"M8.6: Names","kind":"module"},{"id":"m8q031","module":"M8","question":"When referring to a species by its Latin name, the first reference should use the full name; subsequent references are usually made in the abbreviated form, e.g., Poa pratensis becomes:","correct":"P. pratensis","options":["P. pratensis","Poa p.","P.p.","pratensis P."],"feedback":"After the first full use, subsequent references abbreviate the genus to its initial, e.g., P. pratensis.","source":"M8.6: Names","kind":"module"},{"id":"m8q032","module":"M8","question":"A three-component Latin name that adds an infraspecific designation to the binomial is called a:","correct":"trinomial","options":["trinomial","binomial","tetranomial","cultivar code"],"feedback":"Adding an infraspecific designation to the genus-species binomial creates a trinomial.","source":"M8.6: Names","kind":"module"},{"id":"m8q033","module":"M8","question":"The term \"cultivar\" is a contrived word meaning:","correct":"cultivated variety","options":["cultivated variety","cross-pollinated species","climate variant","cultural variance"],"feedback":"\"Cultivar\" is a contrived term combining \"cultivated\" and \"variety.\"","source":"M8.6: Names","kind":"module"},{"id":"m8q034","module":"M8","question":"Baron, a cultivar of Kentucky bluegrass, is written in Latin trinomial form as either Poa pratensis L. cv. Baron or:","correct":"Poa pratensis L. 'Baron'","options":["Poa pratensis L. 'Baron'","Poa pratensis L. ssp. baron","Poa pratensis L. var. baronii","Poa Baron pratensis L."],"feedback":"The cultivar name can be written as either \"cv. Baron\" or in single quotes, 'Baron.'","source":"M8.6: Names","kind":"module"},{"id":"m8q035","module":"M8","question":"Among infraspecific subdivisions of wild populations, the abbreviation \"ssp.\" stands for:","correct":"subspecies","options":["subspecies","species","subfamily","superspecies"],"feedback":"\"ssp.\" is the abbreviation for subspecies, one of the wild-population infraspecific subdivisions.","source":"M8.6: Names","kind":"module"},{"id":"m8q036","module":"M8","question":"Among infraspecific subdivisions of wild populations, the abbreviation \"var.\" stands for:","correct":"variety","options":["variety","cultivar","form","authority"],"feedback":"\"var.\" abbreviates variety, a wild-population infraspecific designation distinct from subspecies (ssp.) and form (f.).","source":"M8.6: Names","kind":"module"},{"id":"m8q037","module":"M8","question":"Wild populations may be subdivided into subspecies, varieties, or forms; cultivated populations use the designation:","correct":"cv. (cultivar)","options":["cv. (cultivar)","ssp. (subspecies)","f. (form)","auth. (authority)"],"feedback":"Cultivated varieties use \"cv.\" (cultivar), distinct from the wild-population subdivisions ssp., var., and f.","source":"M8.6: Names","kind":"module"},{"id":"m8q038","module":"M8","question":"Chewings fescue, slender creeping red fescue, and strong creeping red fescue are all examples of ________ within the species Festuca rubra.","correct":"subspecies","options":["subspecies","genera","tribes","cultivars only"],"feedback":"These three are subspecies (ssp.) of Festuca rubra, distinguished by infraspecific designation.","source":"M8.6: Names","kind":"module"},{"id":"m8q039","module":"M8","question":"The annual biotype of annual bluegrass is designated Poa annua L. var. annua; the perennial biotype is designated:","correct":"Poa annua L. var. reptans","options":["Poa annua L. var. reptans","Poa annua L. ssp. perennis","Poa annua L. cv. Perennial","Poa annua L. f. greens"],"feedback":"The perennial biotype of annual bluegrass carries the variety designation \"var. reptans.\"","source":"M8.6: Names","kind":"module"},{"id":"m8q040","module":"M8","question":"Where interspecific hybrids occur, the names of the two parent species are included following the genus, separated by:","correct":"an X","options":["an X","a hyphen","an ampersand","a colon"],"feedback":"Interspecific hybrid names join the two parent species with an X, following the genus.","source":"M8.6: Names","kind":"module"},{"id":"m8q041","module":"M8","question":"Hybrid bermudagrass, resulting from a cross between common bermudagrass and African bermudagrass, may be written as Cynodon dactylon X:","correct":"transvaalensis","options":["transvaalensis","stolonifera","japonica","pacifica"],"feedback":"Hybrid bermudagrass is written Cynodon dactylon X transvaalensis, crossing common and African bermudagrass.","source":"M8.6: Names","kind":"module"},{"id":"m8q042","module":"M8","question":"Hybrid zoysiagrass, resulting from a cross between Japanese lawngrass and mascarenegrass, may be written as Zoysia japonica X:","correct":"pacifica","options":["pacifica","dactylon","transvaalensis","stolonifera"],"feedback":"Hybrid zoysiagrass is written Zoysia japonica X pacifica, crossing Japanese lawngrass and mascarenegrass.","source":"M8.6: Names","kind":"module"},{"id":"m8q043","module":"M8","question":"Scientific nomenclature is complicated by the fact that several turfgrasses have more than one accepted scientific name, reflecting different taxonomic:","correct":"authorities","options":["authorities","climates","subfamilies","growth habits"],"feedback":"Multiple accepted scientific names for one species usually trace back to different taxonomic authorities describing it.","source":"M8.1: Overview","kind":"module"},{"id":"m8q044","module":"M8","question":"The taxonomic authority abbreviation \"Pers.\" refers to:","correct":"Christiaan Persoon","options":["Christiaan Persoon","William Hudson","Thomas Walter","Jean de Lamarck"],"feedback":"\"Pers.\" abbreviates Christiaan Persoon, one of the taxonomic authorities associated with turfgrass species.","source":"M8.5: Latin Binomial and Authorities","kind":"module"},{"id":"m8q045","module":"M8","question":"The taxonomic authority abbreviation \"Schreb.\" refers to:","correct":"Johann von Schreber","options":["Johann von Schreber","William Hudson","Thomas Walter","Jean de Lamarck"],"feedback":"\"Schreb.\" abbreviates Johann von Schreber, one of the taxonomic authorities encountered in turfgrass nomenclature.","source":"M8.5: Latin Binomial and Authorities","kind":"module"}];const KEY='turf235_exam1_m8_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){state=s;return true}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M8 cleared</h2><p>You retired all 45 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}submit.onclick=submitBatch;next.onclick=nextBatch;restart.onclick=()=>{if(confirm('Restart M8 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
