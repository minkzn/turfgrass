const BANK=[{"id":"m12q001","module":"M12","question":"Most fungi are \"decomposers\" that function in breaking down organic residues that would otherwise:","correct":"bury the planet in debris","options":["bury the planet in debris","poison the soil microbiome","prevent seed germination","cause turfgrass disease"],"feedback":"Most fungi are decomposers that break down organic residues that would otherwise bury the planet in debris.","source":"M12.1: Overview","kind":"module"},{"id":"m12q002","module":"M12","question":"An endophyte is a type of beneficial fungus whose symbiotic association with host plants imparts greater drought, insect, and ________ resistance than would otherwise occur.","correct":"disease","options":["disease","wind","salinity","temperature"],"feedback":"Endophytes impart greater drought, insect, and disease resistance to their host plants.","source":"M12.1: Overview","kind":"module"},{"id":"m12q003","module":"M12","question":"The appealing prospect raised by endophyte research is:","correct":"pest control without pesticides","options":["pest control without pesticides","fertilizer-free turf establishment","mowing-free turf management","irrigation-free turf in any climate"],"feedback":"Endophyte research raised the appealing prospect of pest control without pesticides.","source":"M12.1: Overview","kind":"module"},{"id":"m12q004","module":"M12","question":"By the end of Module 12, you should be able to define and describe an endophyte and identify which turfgrasses:","correct":"have endophytes","options":["have endophytes","are warm-season species","require vernalization","are classified as pooids"],"feedback":"A learning objective of Module 12 is identifying which turfgrasses have endophytes.","source":"M12.1: Overview","kind":"module"},{"id":"m12q005","module":"M12","question":"Among the Module 12 learning objectives is recognizing diseases associated with the presence of endophytes, and showing how the presence of an endophyte is:","correct":"detected","options":["detected","eliminated","transmitted to humans","measured in parts per million"],"feedback":"A learning objective of Module 12 is showing how the presence of an endophyte is detected.","source":"M12.1: Overview","kind":"module"},{"id":"m12q006","module":"M12","question":"In a side-by-side comparison of two fine fescue plots, the plot heavily infested with dollar spot disease was the one:","correct":"without the endophytic fungus","options":["without the endophytic fungus","populated by plants containing the endophytic fungus","that received more nitrogen","that was mowed more frequently"],"feedback":"The disease-free plot was populated by plants containing an endophytic fungus; the heavily infested plot lacked it.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q007","module":"M12","question":"Microscopically, the endophytic fungus can be seen growing inside cells of the:","correct":"leaf sheaths","options":["leaf sheaths","root hairs","stomata","flower petals"],"feedback":"A microscopic view shows the endophytic fungus growing inside cells of the leaf sheaths.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q008","module":"M12","question":"When grown in petri dishes on an agar medium, endophytic fungal colonies show:","correct":"variation among colonies","options":["variation among colonies","identical growth in every dish","no visible growth at all","growth only in darkness"],"feedback":"Petri dishes of endophytic fungi grown in agar medium show variation among the fungal colonies.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q009","module":"M12","question":"In plots demonstrating the benefits of endophytic fungi, the green, endophyte-containing plots resisted the normal decline under conditions of:","correct":"mid-summer stress","options":["mid-summer stress","early spring frost","winter desiccation","fall overseeding"],"feedback":"Endophyte-containing plots resisted the normal decline seen under mid-summer stress conditions.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q010","module":"M12","question":"Per Gwinn et al. (1991), an endophyte is defined as an organism that lives its life cycle within a host plant:","correct":"without causing disease","options":["without causing disease","while causing mild disease","only during dormancy","only in the root system"],"feedback":"Gwinn et al. (1991) define an endophyte as an organism living its life cycle within a host plant without causing disease.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q011","module":"M12","question":"The Gwinn et al. definition of an endophyte doesn't specifically refer to fungi, because there are also ________ endophytes found in bermudagrasses.","correct":"bacterial","options":["bacterial","viral","protozoan","algal"],"feedback":"Bacterial endophytes are also found in bermudagrasses, though no benefits have yet been observed from them.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q012","module":"M12","question":"As of the module's writing, no benefits have yet been observed from the occurrence of bacterial endophytes in:","correct":"bermudagrasses","options":["bermudagrasses","fine fescues","perennial ryegrass","tall fescue"],"feedback":"No benefits have yet been observed from bacterial endophytes, which occur in bermudagrasses.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q013","module":"M12","question":"Per Table 12.2.1, the fungal endophyte found in perennial ryegrass is:","correct":"Neotyphodium lolii","options":["Neotyphodium lolii","Neotyphodium conophialum","Neotyphodium typhinum","Epichloe typhina"],"feedback":"Table 12.2.1 lists Neotyphodium lolii as the fungal endophyte found in perennial ryegrass.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q014","module":"M12","question":"Per Table 12.2.1, the fungal endophyte found in tall fescue is:","correct":"Neotyphodium conophialum","options":["Neotyphodium conophialum","Neotyphodium lolii","Neotyphodium typhinum","Epichloe typhina"],"feedback":"Table 12.2.1 lists Neotyphodium conophialum as the fungal endophyte found in tall fescue.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q015","module":"M12","question":"Per Table 12.2.1, fine fescue contains two endophytic species: Epichloe typhina and:","correct":"Neotyphodium typhinum","options":["Neotyphodium typhinum","Neotyphodium lolii","Neotyphodium conophialum","Acremonium coenophialum"],"feedback":"Fine fescue hosts two endophytic species: Neotyphodium typhinum and Epichloe typhina.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q016","module":"M12","question":"The turfgrass species in which endophytes occur are perennial ryegrass, tall fescue, and:","correct":"the fine fescues","options":["the fine fescues","Kentucky bluegrass","the bentgrasses","bermudagrass"],"feedback":"Endophytes occur in perennial ryegrass, tall fescue, and the fine fescues.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q017","module":"M12","question":"Endophytes have historically been a problem in forage grasses because they produce alkaloid poisons that adversely affect:","correct":"herbivores grazing on infected populations","options":["herbivores grazing on infected populations","the turfgrass root system","soil microbial communities","nearby pollinator populations"],"feedback":"Alkaloid poisons produced by endophytes adversely affect herbivores grazing on infected forage grass populations.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q018","module":"M12","question":"Endophytic secondary metabolites produced as alkaloid poisons include Lolitrem B, Paxilline, Ergovaline, and permine, which is specifically poisonous to:","correct":"insects","options":["insects","grazing livestock only","soil fungi","turfgrass roots"],"feedback":"Permine is an endophytic secondary metabolite poisonous to insects.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q019","module":"M12","question":"Endophytic alkaloids are produced inside the plant and then translocated to:","correct":"other parts of the plant","options":["other parts of the plant","the surrounding soil only","neighboring uninfected plants","the seed coat exclusively"],"feedback":"Alkaloids produced by the endophyte inside grass tissue are translocated to other parts of the plant.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q020","module":"M12","question":"Among the insects that endophyte-conferred secondary metabolites help resist are sod webworms, billbugs, white grubs, and fall army worms, as well as:","correct":"chinch bugs","options":["chinch bugs","Japanese beetles","aphids","cutworms"],"feedback":"Endophyte resistance extends to sod webworms, billbugs, white grubs, fall army worms, and chinch bugs.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q021","module":"M12","question":"Endophyte infection is associated with resistance to dollar spot disease, but also with greater susceptibility to:","correct":"Pythium disease","options":["Pythium disease","brown patch disease","gray leaf spot disease","summer patch disease"],"feedback":"Endophyte infection confers dollar spot resistance but greater susceptibility to Pythium disease.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q022","module":"M12","question":"The module suggests that endophyte infection's greater susceptibility to Pythium may reflect the higher shoot density and growth rate resulting from:","correct":"reduced insect-related injury","options":["reduced insect-related injury","increased irrigation needs","reduced mowing frequency","increased thatch accumulation"],"feedback":"Higher shoot density and growth rate from reduced insect-related injury may explain the greater Pythium susceptibility seen with endophyte infection.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q023","module":"M12","question":"The presence of endophytes is also associated with improved drought tolerance, although the scientific basis for this effect is:","correct":"unknown","options":["unknown","fully characterized","due solely to deeper rooting","due solely to reduced transpiration"],"feedback":"The scientific basis for endophyte-associated drought tolerance is unknown.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q024","module":"M12","question":"Currently, which turfgrass groups are known to contain fungal endophytes?","correct":"the ryegrasses and fescues","options":["the ryegrasses and fescues","the bluegrasses and bentgrasses","the bermudagrasses and zoysiagrasses","all cool-season turfgrasses"],"feedback":"Currently, only the ryegrasses and fescues contain fungal endophytes.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q025","module":"M12","question":"Turfgrass breeders are actively attempting to incorporate fungal endophytes into which other turfgrass species?","correct":"the bentgrasses and bluegrasses","options":["the bentgrasses and bluegrasses","the ryegrasses and fescues","zoysiagrass and bermudagrass","St. Augustinegrass and centipedegrass"],"feedback":"Breeders are attempting to incorporate fungal endophytes into bentgrasses and bluegrasses, which don't currently have them.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q026","module":"M12","question":"Because the presence of endophytes is believed to result from a long-term, evolutionary process, whether endophytes can be bred into new turfgrass species:","correct":"only time will tell","options":["only time will tell","has already been proven impossible","has already been achieved in all species","depends only on fertilization rate"],"feedback":"Since endophyte symbiosis is believed to result from a long evolutionary process, only time will tell if it can be achieved in new species.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q027","module":"M12","question":"In grass plants, endophytes are found in three locations: the crown tissue, the seed, and the:","correct":"flowering culm","options":["flowering culm","root cap","stomatal guard cells","leaf tip"],"feedback":"Endophytes are found in the crown tissue, the flowering culm, and the seed.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q028","module":"M12","question":"The crown — where the endophyte occurs, along with the lower portion of leaf sheaths emanating from it — is described as a:","correct":"highly compressed stem located at the base of aerial shoots","options":["highly compressed stem located at the base of aerial shoots","swollen underground tuber","cluster of adventitious roots","waxy cuticle layer"],"feedback":"The crown is a highly compressed stem at the base of aerial shoots, where the endophyte occurs.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q029","module":"M12","question":"When the crown changes from vegetative to reproductive growth, the endophyte travels up with the developing inflorescence, leaving traces within the:","correct":"flowering culm","options":["flowering culm","root system","leaf blade tip","seed coat only"],"feedback":"As the crown becomes reproductive, the endophyte travels up with the inflorescence, leaving traces in the flowering culm.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q030","module":"M12","question":"In the fine fescues, the fungal endophyte will sometimes cause a disease known as:","correct":"choke","options":["choke","dollar spot","red thread","take-all patch"],"feedback":"Choke disease is caused by the fungal endophyte in fine fescues.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q031","module":"M12","question":"The disease \"choke\" gets its name because the fungus literally chokes off further development of the:","correct":"inflorescence","options":["inflorescence","root system","crown tissue","leaf blade"],"feedback":"Choke disease is named for the fungus choking off further development of the inflorescence.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q032","module":"M12","question":"In a seed squash preparation used to view fungal hyphae, the hyphae are located just inside the seed coat in the:","correct":"aleurone layer","options":["aleurone layer","endosperm core","embryo axis","coleoptile"],"feedback":"Fungal hyphae are located in the aleurone layer, just inside the seed coat.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q033","module":"M12","question":"To prepare a seed squash for microscopic examination of endophyte hyphae, seeds are first soaked in water and allowed to swell, then stained with a pigment, and finally:","correct":"squashed for microscopic examination","options":["squashed for microscopic examination","frozen for later testing","germinated in soil","dried and weighed"],"feedback":"Seeds are soaked, swelled, stained, and then squashed on a glass slide for microscopic examination.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q034","module":"M12","question":"Initially, the endophyte is restricted to the aleurone layer within the seed; during germination, the fungus infects the developing embryo and, thus, the:","correct":"seedling plant","options":["seedling plant","soil microbiome","pollinating insects","neighboring seeds directly"],"feedback":"During germination, the endophyte spreads from the aleurone layer to infect the embryo and seedling plant.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q035","module":"M12","question":"Because the endophyte fungus does not have the capacity to produce reproductive spores, the only way it can be transmitted is:","correct":"through the seed","options":["through the seed","through wind-borne spores","through irrigation water","through insect vectors"],"feedback":"Lacking reproductive spores, the endophyte can only be transmitted through the seed.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q036","module":"M12","question":"Besides the seed-squash technique, a second method for determining the presence of a fungal endophyte is the:","correct":"grow-out test","options":["grow-out test","soil bioassay","chlorophyll fluorescence test","root-staining test"],"feedback":"The grow-out test is a second method, besides seed squash, for detecting fungal endophytes.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q037","module":"M12","question":"The grow-out test is performed by microscopically examining seedlings to determine the percentage of seedlings containing the endophyte, which yields the:","correct":"percent viability","options":["percent viability","percent germination rate","percent dormancy","percent infection severity"],"feedback":"The grow-out test determines the percentage of seedlings containing the endophyte, yielding percent viability.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q038","module":"M12","question":"The general benefits turfgrass scientists attribute to fungal endophytes include improved root growth, seedling vigor, competitive ability, pest resistance, and greater heat and:","correct":"drought tolerance","options":["drought tolerance","salinity tolerance","shade tolerance","cold tolerance"],"feedback":"Fungal endophyte benefits include improved root growth, seedling vigor, competitive ability, pest resistance, and heat and drought tolerance.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q039","module":"M12","question":"The seed industry markets the benefits of endophytes in packaging using the term:","correct":"endophyte enhanced","options":["endophyte enhanced","endophyte certified","endophyte guaranteed","endophyte pure"],"feedback":"The term \"endophyte enhanced\" is used in seed packaging to indicate the benefits of endophyte presence.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q040","module":"M12","question":"The benefits associated with endophyte presence depend on the endophyte's ability to infect the developing seedling, which in turn depends on the endophyte's survival in the seed during:","correct":"seed storage","options":["seed storage","seed coating","seed scarification","seed sorting"],"feedback":"Endophyte benefits depend on the endophyte surviving storage long enough to infect the developing seedling.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q041","module":"M12","question":"Endophyte-enhanced seed should be stored at temperatures below 5°C and below what percent moisture to extend endophyte viability?","correct":"11 percent","options":["11 percent","5 percent","20 percent","30 percent"],"feedback":"Endophyte-enhanced seed should be stored below 5°C and below 11 percent moisture to extend endophyte viability.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q042","module":"M12","question":"Tall fescue and perennial ryegrass seed stored longer than how many years has probably lost much of its endophyte viability?","correct":"two years","options":["two years","six months","five years","ten years"],"feedback":"Tall fescue and perennial ryegrass seed stored longer than two years has probably lost much of the endophyte's viability.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q043","module":"M12","question":"In fine fescues, endophyte viability may not last beyond:","correct":"one year","options":["one year","six months","two years","five years"],"feedback":"Fine fescue endophyte viability may not last beyond one year — shorter than tall fescue or perennial ryegrass seed.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q044","module":"M12","question":"Which seed loses its endophyte viability faster in storage: fine fescue (about one year) or tall fescue/perennial ryegrass (about two years)?","correct":"fine fescue","options":["fine fescue","tall fescue/perennial ryegrass","they lose viability at the same rate","neither loses viability over time"],"feedback":"Fine fescue endophyte viability may not last beyond one year, shorter than the roughly two years for tall fescue and perennial ryegrass seed.","source":"M12.3: Endophytes","kind":"module"},{"id":"m12q045","module":"M12","question":"Which endophyte species is shared between perennial ryegrass's table entry and no other turfgrass in Table 12.2.1: Neotyphodium lolii or Neotyphodium typhinum?","correct":"Neotyphodium lolii","options":["Neotyphodium lolii","Neotyphodium typhinum","both are shared with tall fescue","neither is species-specific"],"feedback":"Neotyphodium lolii is listed only for perennial ryegrass in Table 12.2.1; Neotyphodium typhinum is one of two species listed for fine fescue.","source":"M12.2: The Good Fungi","kind":"module"},{"id":"m12q046","module":"M12","question":"Per the textbook, the endophytes found in creeping red fescue cultivars are Epichloe typhina and:","correct":"Neotyphodium typhinum","options":["Neotyphodium typhinum","Neotyphodium lolii","Neotyphodium conophialum","Neotyphodium coenophialum"],"feedback":"Creeping red fescue cultivars carry Neotyphodium typhinum and Epichloe typhina endophytes.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q047","module":"M12","question":"Per the textbook, Neotyphodium typhinum and Epichloe typhina were formerly classified under the genus:","correct":"Acremonium","options":["Acremonium","Fusarium","Rhizoctonia","Pythium"],"feedback":"The textbook notes that Neotyphodium typhinum and Epichloe typhina were formerly classified as Acremonium.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q048","module":"M12","question":"Per the textbook, the inclusion of endophytes in creeping red fescue cultivars has been shown to improve drought resistance, insect tolerance, and:","correct":"resistance to some diseases","options":["resistance to some diseases","seed germination rate","cold hardiness only","chlorophyll content"],"feedback":"Endophyte inclusion in creeping red fescue cultivars improves drought resistance, insect tolerance, and resistance to some diseases.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q049","module":"M12","question":"Per the textbook, which fine fescue species carries the SAME pair of endophyte species (Neotyphodium typhinum and Epichloe typhina) as creeping red fescue: slender creeping red fescue and Chewings fescue, or only tall fescue?","correct":"slender creeping red fescue and Chewings fescue","options":["slender creeping red fescue and Chewings fescue","only tall fescue","only hard fescue","none of the other fescues carry it"],"feedback":"Slender creeping red fescue, Chewings fescue, and hard fescue cultivars all carry Neotyphodium typhinum and Epichloe typhina, same as creeping red fescue.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q050","module":"M12","question":"Per the textbook, the endophyte found in hard fescue cultivars is the same species pair found in the red fescues: Neotyphodium typhinum and:","correct":"Epichloe typhina","options":["Epichloe typhina","Neotyphodium lolii","Neotyphodium coenophialum","Acremonium coenophialum"],"feedback":"Hard fescue cultivars carry the same Neotyphodium typhinum and Epichloe typhina endophytes as the red fescues.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q051","module":"M12","question":"Per the textbook, the endophyte found in tall fescue cultivars, Neotyphodium coenophialum, was formerly classified as:","correct":"Acremonium","options":["Acremonium","Epichloe","Neotyphodium lolii","Fusarium"],"feedback":"Neotyphodium coenophialum in tall fescue cultivars was formerly classified as Acremonium, like the other turfgrass endophytes.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q052","module":"M12","question":"Per the textbook, the endophyte found in perennial ryegrass cultivars, Neotyphodium lolii, was formerly classified as:","correct":"Acremonium","options":["Acremonium","Epichloe","Neotyphodium coenophialum","Fusarium"],"feedback":"Neotyphodium lolii in perennial ryegrass cultivars was formerly classified as Acremonium.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q053","module":"M12","question":"Per the textbook, across creeping red fescue, Chewings fescue, hard fescue, tall fescue, and perennial ryegrass cultivars, the inclusion of an endophyte consistently improves drought resistance, resistance to some diseases, and:","correct":"insect tolerance","options":["insect tolerance","cold tolerance","shade tolerance","salinity tolerance"],"feedback":"Across every species the textbook discusses, endophyte inclusion consistently improves drought resistance, insect tolerance, and resistance to some diseases.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"},{"id":"m12q054","module":"M12","question":"Among the endophyte species named in the textbook (Neotyphodium lolii, N. coenophialum, N. typhinum, Epichloe typhina), which one is specific to tall fescue and not shared with any fescue or ryegrass species discussed?","correct":"Neotyphodium coenophialum","options":["Neotyphodium coenophialum","Neotyphodium typhinum","Epichloe typhina","Neotyphodium lolii"],"feedback":"Neotyphodium coenophialum is specific to tall fescue; N. typhinum and Epichloe typhina are shared across the fine/red fescues, and N. lolii is specific to perennial ryegrass.","source":"Textbook Ch. 3, pp. 61-69: Turfgrass Species","kind":"enrichment"}];const KEY='turf235_exam1_m12_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M12 cleared</h2><p>You retired all 54 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M12 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
