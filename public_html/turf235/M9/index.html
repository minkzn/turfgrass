const BANK=[{"id":"m9q001","module":"M9","question":"Kentucky bluegrass (Poa pratensis) is described as the most widely used perennial turfgrass in temperate-continental and subarctic climates, but it is not very shade tolerant nor well adapted to:","correct":"poorly drained soils","options":["poorly drained soils","full-sun locations","sandy, well-drained soils","high-traffic areas"],"feedback":"Kentucky bluegrass's poor shade tolerance and poor adaptation to poorly drained soils are why rough bluegrass often invades those conditions instead.","source":"M9.1: Overview","kind":"module"},{"id":"m9q002","module":"M9","question":"Rough bluegrass (Poa trivialis) is a specialty grass for moist, shaded environments and is also widely used for:","correct":"overseeding bermudagrass turfs in subtropical climates for winter color","options":["overseeding bermudagrass turfs in subtropical climates for winter color","permanent fairway turf in cool climates","desert golf course roughs","athletic field wear zones"],"feedback":"Rough bluegrass is commonly used to overseed dormant bermudagrass turfs for winter color and play in subtropical climates.","source":"M9.1: Overview","kind":"module"},{"id":"m9q003","module":"M9","question":"Annual bluegrass (Poa annua) is rarely planted intentionally, yet it commonly occurs in intensively cultured turfs across which climate zones?","correct":"subarctic, temperate, and subtropical","options":["subarctic, temperate, and subtropical","tropical only","desert (dry) climates only","polar climates only"],"feedback":"Annual bluegrass occurs in intensively cultured turfs worldwide across subarctic, temperate, and subtropical climates, despite rarely being planted on purpose.","source":"M9.1: Overview","kind":"module"},{"id":"m9q004","module":"M9","question":"Kentucky bluegrass's ligule is described as:","correct":"membranous, very short, truncate","options":["membranous, very short, truncate","membranous, 2 to 6 mm long, pointed or notched","membranous, less than 0.8 to 3 mm long, pointed","a fringe of hairs"],"feedback":"Kentucky bluegrass has a membranous, very short, truncate ligule.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q005","module":"M9","question":"The preferred mowing height range for Kentucky bluegrass is:","correct":"0.75 to 2.5 inches","options":["0.75 to 2.5 inches","less than 1 inch","0.5 to 1.0 inch","3 to 5 inches"],"feedback":"Kentucky bluegrass favors mowing heights of 0.75 to 2.5 inches.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q006","module":"M9","question":"On a golf course, Kentucky bluegrass is well adapted to roughs, but is generally rated as:","correct":"not adapted to greens","options":["not adapted to greens","not adapted to roughs","ideal for greens","ideal only for bunkers"],"feedback":"Kentucky bluegrass is not adapted for greens, while it is well adapted for roughs.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q007","module":"M9","question":"Kentucky bluegrass's extensive rhizome development provides the turf with a rhizome base that enhances resiliency and:","correct":"traffic tolerance","options":["traffic tolerance","seed head production","shade tolerance","salinity tolerance"],"feedback":"Extensive rhizome development gives Kentucky bluegrass turf enhanced resiliency and traffic tolerance.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q008","module":"M9","question":"In Kentucky bluegrass, long, determinate rhizome growth typically reflects growth occurring during:","correct":"summer","options":["summer","winter","early spring only","late fall only"],"feedback":"Long, determinate rhizome growth in Kentucky bluegrass usually reflects summer growth conditions.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q009","module":"M9","question":"During spring and fall, Kentucky bluegrass rhizomes tend to turn upward almost immediately, reflecting:","correct":"shorter day lengths and cooler temperatures","options":["shorter day lengths and cooler temperatures","longer day lengths and warmer temperatures","increased nitrogen availability only","reduced soil moisture"],"feedback":"Spring and fall rhizomes turn up quickly in response to shorter days and cooler temperatures.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q010","module":"M9","question":"In a Kentucky bluegrass field study, dollar spot disease was found to be more prevalent under which nitrogen fertilization rate?","correct":"2 lb N/1000 ft²/year (the lower rate)","options":["2 lb N/1000 ft²/year (the lower rate)","6 lb N/1000 ft²/year (the higher rate)","both rates equally","neither rate affected dollar spot"],"feedback":"Dollar spot was much more prevalent where nitrogen applications were lower (2 lb vs. 6 lb/1000 ft²/year).","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q011","module":"M9","question":"In a Kentucky bluegrass field study, summer patch disease was found to be more prevalent under which nitrogen fertilization rate — the opposite pattern from dollar spot?","correct":"8 lb N/1000 ft² (the higher rate)","options":["8 lb N/1000 ft² (the higher rate)","4 lb N/1000 ft² (the lower rate)","both rates equally","neither rate affected summer patch"],"feedback":"Summer patch was more prevalent under the higher nitrogen rate (8 lb vs. 4 lb/1000 ft²) — the opposite relationship seen with dollar spot and low nitrogen.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q012","module":"M9","question":"The older Kentucky bluegrass cultivar Kenblue was especially susceptible to Helminthosporium diseases, including melting out in spring (caused by Dreschlera poae) and leaf spot in summer caused by:","correct":"Bipolaris sorokiniana","options":["Bipolaris sorokiniana","Pythium aphanidermatum","Sclerotinia homoeocarpa","Rhizoctonia solani"],"feedback":"Kenblue's summer leaf spot disease was caused by Bipolaris sorokiniana, while melting out in spring was caused by Dreschlera poae.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q013","module":"M9","question":"The Kentucky bluegrass cultivar Merion, discovered at Merion Golf Club in 1937, was significant as the first cultivar found to be:","correct":"resistant to Helminthosporium diseases","options":["resistant to Helminthosporium diseases","tolerant of full shade","adapted to putting greens","resistant to drought only"],"feedback":"Merion was the first Kentucky bluegrass cultivar found resistant to Helminthosporium diseases, and its popularity paralleled the growth of the U.S. sod industry.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q014","module":"M9","question":"When Merion (leaf-spot resistant) was blended with Kenblue (leaf-spot susceptible), the blend's quality was intermediate at first, but over subsequent years the blend's quality gradually shifted toward that of:","correct":"Merion","options":["Merion","Kenblue","neither — it stayed exactly intermediate","a third, unrelated cultivar"],"feedback":"Over time the stronger, more disease-resistant Merion component came to dominate the blend's botanical composition.","source":"M9.4: Other Kentucky Bluegrass Cultivars","kind":"module"},{"id":"m9q015","module":"M9","question":"Comparing Nugget and Park Kentucky bluegrass cultivars: Nugget was slow to green up but had excellent resistance to which disease, giving it strong May quality?","correct":"leaf spot","options":["leaf spot","dollar spot","summer patch","brown patch"],"feedback":"Nugget's excellent leaf spot resistance gave it strong quality in May when the disease was active, despite slow spring greenup.","source":"M9.4: Other Kentucky Bluegrass Cultivars","kind":"module"},{"id":"m9q016","module":"M9","question":"Unlike the Merion-Kenblue blend (which shifted toward the stronger cultivar), the Nugget-Park blend remained:","correct":"consistently intermediate between the two cultivars","options":["consistently intermediate between the two cultivars","dominated entirely by Nugget within two years","dominated entirely by Park within two years","unstable and prone to complete die-off"],"feedback":"Because Nugget and Park were each strong and weak at different times of year, neither dominated, and the blend stayed consistently intermediate.","source":"M9.4: Other Kentucky Bluegrass Cultivars","kind":"module"},{"id":"m9q017","module":"M9","question":"Texas bluegrass (Poa arachnifera) is described as a:","correct":"non-turf species found in Texas and adjacent states","options":["non-turf species found in Texas and adjacent states","widely planted golf green species","cold-hardy subarctic turfgrass","shade-adapted lawn species"],"feedback":"Texas bluegrass is a non-turf species native to Texas and nearby states, valued mainly for hybridizing with Kentucky bluegrass.","source":"M9.5: Texas Bluegrass","kind":"module"},{"id":"m9q018","module":"M9","question":"The hybrid of Texas bluegrass and Kentucky bluegrass known as Reveille shows improved adaptation to the transition zone and good resistance to:","correct":"brown patch","options":["brown patch","dollar spot","summer patch","leaf spot"],"feedback":"Reveille, the Texas x Kentucky bluegrass hybrid, shows good brown patch resistance along with superior heat and drought tolerance.","source":"M9.5: Texas Bluegrass","kind":"module"},{"id":"m9q019","module":"M9","question":"Most Texas bluegrass x Kentucky bluegrass hybrids end up resembling Kentucky bluegrass because of:","correct":"successive backcrossings with Kentucky bluegrass","options":["successive backcrossings with Kentucky bluegrass","genetic drift under high mowing","random mutation over time","being grown exclusively in Kentucky"],"feedback":"Repeated backcrossing with Kentucky bluegrass causes most hybrids to resemble Kentucky bluegrass despite their Texas bluegrass parentage.","source":"M9.5: Texas Bluegrass","kind":"module"},{"id":"m9q020","module":"M9","question":"Annual bluegrass's ligule is described as:","correct":"membranous, less than 0.8 to 3 mm long, pointed","options":["membranous, less than 0.8 to 3 mm long, pointed","membranous, very short, truncate","membranous, 2 to 6 mm long, pointed or notched","a fringe of hairs, 2 to 5 mm long"],"feedback":"Annual bluegrass has a membranous, pointed ligule less than 0.8 to 3 mm long.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q021","module":"M9","question":"The preferred mowing height for annual bluegrass is:","correct":"less than 1 inch","options":["less than 1 inch","0.75 to 2.5 inches","2 to 4 inches","0.5 to 1.0 inch"],"feedback":"Annual bluegrass is best mowed at less than 1 inch.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q022","module":"M9","question":"On a golf course, annual bluegrass is well adapted to greens, tees, and fairways, but is often considered a weed on:","correct":"greens","options":["greens","roughs only","driving ranges only","cart paths"],"feedback":"Despite being well adapted to greens, annual bluegrass is often considered a weed there because it typically invades unintentionally.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q023","module":"M9","question":"For lawn turf use, annual bluegrass is only adapted at moderate to high intensities of culture, because it is highly susceptible to:","correct":"summer disease and stress","options":["summer disease and stress","winter cold only","shade only","low mowing only"],"feedback":"Annual bluegrass's high susceptibility to summer disease and stress limits it to moderate-to-high-intensity lawn culture.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q024","module":"M9","question":"According to Fenner (1985), Poa annua ranks among the:","correct":"five most widely distributed plants in the world","options":["five most widely distributed plants in the world","rarest plants in the Southern Hemisphere","top ten tallest grass species","most drought-tolerant C4 grasses"],"feedback":"Fenner (1985) documented Poa annua as one of the five most widely distributed plants in the world.","source":"M9.7: Varieties of Annual Bluegrass","kind":"module"},{"id":"m9q025","module":"M9","question":"Poa annua's extraordinary global distribution is illustrated by its presence on:","correct":"Heard Island, in the Antarctic region","options":["Heard Island, in the Antarctic region","the summit of Mount Everest","the Sahara Desert interior","the ocean floor"],"feedback":"Poa annua is found even on remote Heard Island in the Antarctic region, known for having no other human-introduced plants.","source":"M9.7: Varieties of Annual Bluegrass","kind":"module"},{"id":"m9q026","module":"M9","question":"An annual wild-type of Poa annua partitions most of its photoassimilates toward inflorescence development, while a dense greens-type divides its photoassimilates between inflorescence development and:","correct":"new tiller development","options":["new tiller development","root elongation only","rhizome formation","seed dormancy"],"feedback":"Unlike the wild-type (mostly inflorescence), the greens-type splits photoassimilates between inflorescence and new tiller development.","source":"M9.7: Varieties of Annual Bluegrass","kind":"module"},{"id":"m9q027","module":"M9","question":"Rough bluegrass's ligule is described as:","correct":"membranous, 2 to 6 mm long, pointed or notched","options":["membranous, 2 to 6 mm long, pointed or notched","membranous, very short, truncate","membranous, less than 0.8 to 3 mm long, pointed","a fringe of hairs"],"feedback":"Rough bluegrass has a membranous ligule 2 to 6 mm long, pointed or notched — longer than Kentucky bluegrass's.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q028","module":"M9","question":"The preferred mowing height for rough bluegrass is:","correct":"0.5 to 1.0 inch","options":["0.5 to 1.0 inch","0.75 to 2.5 inches","less than 1 inch flat","2 to 4 inches"],"feedback":"Rough bluegrass is mowed at 0.5 to 1.0 inch.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q029","module":"M9","question":"The preferred nitrogen fertilization rate for rough bluegrass, 2.0 to 4.0 lb N/1000 ft²/year, is lower than the rate recommended for:","correct":"Kentucky bluegrass and annual bluegrass (both 2.0-6.0 lb)","options":["Kentucky bluegrass and annual bluegrass (both 2.0-6.0 lb)","bermudagrass only","no other species — it is the highest rate","centipedegrass only"],"feedback":"Both Kentucky bluegrass and annual bluegrass call for 2.0-6.0 lb N/1000 ft²/year, a higher range than rough bluegrass's 2.0-4.0 lb.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q030","module":"M9","question":"On a golf course, rough bluegrass's primary suitable use is:","correct":"overseeding greens (e.g., dormant bermudagrass)","options":["overseeding greens (e.g., dormant bermudagrass)","permanent fairway turf","permanent rough turf","tee surfaces"],"feedback":"Rough bluegrass on golf greens is used specifically for overseeding, not as a permanent greens turf; it's not suitable for tees, fairways, or roughs.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q031","module":"M9","question":"For lawn turf, rough bluegrass is suitable only for:","correct":"shaded lawns","options":["shaded lawns","full-sun lawns","athletic-intensity lawns","utility/roadside turf"],"feedback":"Rough bluegrass is adapted for shaded lawns only, consistent with its preference for moist, shaded environments.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q032","module":"M9","question":"Among Kentucky bluegrass, annual bluegrass, and rough bluegrass, which has the shortest ligule?","correct":"Kentucky bluegrass (very short, truncate)","options":["Kentucky bluegrass (very short, truncate)","annual bluegrass (<0.8-3 mm)","rough bluegrass (2-6 mm)","all three are the same length"],"feedback":"Kentucky bluegrass's ligule is the shortest (very short, truncate); rough bluegrass's is the longest (2-6 mm).","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q033","module":"M9","question":"Among Kentucky bluegrass, annual bluegrass, and rough bluegrass, which is mowed at the lowest height?","correct":"annual bluegrass (less than 1 inch)","options":["annual bluegrass (less than 1 inch)","Kentucky bluegrass (0.75-2.5 inches)","rough bluegrass (0.5-1.0 inch)","they share the same mowing height"],"feedback":"Annual bluegrass tolerates the lowest mowing heights (under 1 inch), consistent with its adaptation to golf greens.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q034","module":"M9","question":"According to the textbook, the most distinguishing vegetative features shared across the bluegrass genus (Poa) are the boat-shaped leaf tip and:","correct":"parallel light lines on either side of the central vein","options":["parallel light lines on either side of the central vein","a fringe-of-hairs ligule","broad, divided auricles","a strongly keeled abaxial surface"],"feedback":"The textbook identifies boat-shaped leaf tips plus parallel light lines flanking the central vein as the bluegrass genus's most distinguishing vegetative features.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q035","module":"M9","question":"Chromosome numbers within Kentucky bluegrass are highly variable, ranging from 24 up to as many as:","correct":"124","options":["124","28","56","14"],"feedback":"Kentucky bluegrass shows an unusually wide chromosome range, from 24 to 124.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q036","module":"M9","question":"Kentucky bluegrass's equatorward adaptation is generally limited to locations where the mean temperature for the warmest month is equal to or lower than:","correct":"75°F","options":["75°F","95°F","60°F","85°F"],"feedback":"Kentucky bluegrass is generally limited toward the equator to sites where the warmest month averages 75°F or cooler.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q037","module":"M9","question":"Among the named Kentucky bluegrass cultivar types, the \"Aggressive Type\" (e.g., A-34, Touchdown, Washington) is notable for high shoot density and lateral growth that tends to:","correct":"dominate other cultivars and species in blends and mixtures","options":["dominate other cultivars and species in blends and mixtures","fail quickly under any nitrogen fertilization","require full shade to survive","resist mowing entirely"],"feedback":"The Aggressive Type's dense, laterally spreading growth tends to dominate other cultivars and species when blended.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q038","module":"M9","question":"Among the named Kentucky bluegrass cultivar types, the \"Common or Midwest Type\" (including Kenblue and Park) is characterized by an erect growth habit, narrow leaves, poor winter quality, and susceptibility to:","correct":"leaf spot disease","options":["leaf spot disease","summer patch only","brown patch only","dollar spot only"],"feedback":"The Common/Midwest Type, including Kenblue and Park, is susceptible to leaf spot disease and shows poor winter quality.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q039","module":"M9","question":"Texas bluegrass (Poa arachnifera) is, like buffalograss, described as dioecious, meaning:","correct":"male and female flowers occur on separate plants","options":["male and female flowers occur on separate plants","it reproduces only by rhizomes, never by seed","each plant has flowers of only one color","it cannot cross-pollinate with any other species"],"feedback":"Dioecious means individual plants bear either male or female flowers, but not both — true of both Texas bluegrass and buffalograss.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q040","module":"M9","question":"Texas bluegrass is typically an octoploid with how many chromosomes (2n = 8x = 56)?","correct":"56","options":["56","28","14","124"],"feedback":"Texas bluegrass is typically octoploid, with 56 chromosomes (2n = 8x = 56).","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q041","module":"M9","question":"In limited tests in Dallas, Texas, the Reveille hybrid bluegrass showed good resistance to:","correct":"white grubs","options":["white grubs","dollar spot","brown patch","chinch bugs"],"feedback":"Dallas field tests found Reveille hybrid bluegrass to have good resistance to white grubs.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q042","module":"M9","question":"Canada bluegrass (Poa compressa) — a species not covered in the course module pages but described in the textbook — is a weakly rhizomatous grass adapted to acid, droughty, infertile soils and used mainly for:","correct":"soil stabilization","options":["soil stabilization","golf greens","athletic fields","overseeding bermudagrass"],"feedback":"Canada bluegrass forms a low-quality, open turf suited to soil stabilization on poor, acidic, droughty sites — not for high-value turf uses.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q043","module":"M9","question":"The cultural intensity required by Canada bluegrass, reflecting its use for low-quality utility turf, is described in the textbook as:","correct":"very low","options":["very low","very high","moderate to high","identical to Kentucky bluegrass"],"feedback":"Canada bluegrass requires very low cultural intensity, consistent with its role as a little-used utility grass.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q044","module":"M9","question":"Rough bluegrass's sheath base is described in the textbook as having a distinctive appearance often compared to:","correct":"onion-skin","options":["onion-skin","cracked leather","snakeskin","frosted glass"],"feedback":"Rough bluegrass's sheath base has a distinctive \"onion-skin\" appearance, a useful identification cue.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q045","module":"M9","question":"Rough bluegrass is described as susceptible to injury from which herbicide type?","correct":"2,4-D and related herbicides","options":["2,4-D and related herbicides","glyphosate only","pre-emergent crabgrass herbicides only","sulfonylureas only"],"feedback":"Rough bluegrass is noted as susceptible to injury from 2,4-D and related herbicides.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q046","module":"M9","question":"The first turf-type rough bluegrass cultivar, mentioned alongside later improved cultivars like Colt and Cypress, was:","correct":"Sabre","options":["Sabre","Merion","Nugget","Reveille"],"feedback":"Sabre was the first turf-type rough bluegrass cultivar developed.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q047","module":"M9","question":"Annual bluegrass occurs primarily as two distinct phenotypes: an upright-growing \"wild-type\" winter annual, and a prostrate-growing, close-mowing-tolerant biotype called the:","correct":"greens-type","options":["greens-type","fairway-type","rough-type","utility-type"],"feedback":"Annual bluegrass's two main phenotypes are the upright wild-type winter annual and the prostrate, perennial greens-type.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q048","module":"M9","question":"Annual bluegrass is typically tetraploid with 28 chromosomes, but sterile amplihaploids with 14 chromosomes have been found that form very dense turfs while producing:","correct":"little vertical shoot growth and no viable seed","options":["little vertical shoot growth and no viable seed","excessive seed heads year-round","unusually deep root systems","resistance to all major diseases"],"feedback":"These sterile 14-chromosome amplihaploid forms of annual bluegrass produce dense turf with minimal vertical growth and no viable seed.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q049","module":"M9","question":"Which of these diseases is NOT listed among those requiring fungicide control on intensively managed annual bluegrass turf?","correct":"summer patch","options":["summer patch","dollar spot","Pythium blight","anthracnose"],"feedback":"The textbook lists dollar spot, brown patch, Pythium blight, anthracnose, and snow molds as key annual bluegrass disease concerns — summer patch is instead highlighted as a Kentucky bluegrass concern tied to high nitrogen.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q050","module":"M9","question":"Annual bluegrass's cultural intensity requirement is described in the textbook as:","correct":"high","options":["high","very low","moderate only","identical to Canada bluegrass"],"feedback":"Annual bluegrass demands high cultural intensity to sustain acceptable quality, unlike low-maintenance species like Canada bluegrass.","source":"Textbook Ch. 3, pp. 64-66: Turfgrass Species","kind":"enrichment"},{"id":"m9q051","module":"M9","question":"On a golf course, Kentucky bluegrass's adaptation to tees is rated:","correct":"marginally adapted","options":["marginally adapted","well adapted","not adapted","ideal"],"feedback":"Kentucky bluegrass is only marginally adapted to golf tees.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q052","module":"M9","question":"Kentucky bluegrass's adaptation to golf fairways is rated marginally adapted, specifically for:","correct":"closely mowed fairways","options":["closely mowed fairways","high-cut fairways only","fairways in shaded locations","sand-based fairways only"],"feedback":"Kentucky bluegrass is marginally adapted for closely mowed fairways.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q053","module":"M9","question":"For athletic playing surfaces, where wear resistance and recuperative capacity matter, Kentucky bluegrass is rated:","correct":"well adapted","options":["well adapted","marginally adapted","not adapted","not suitable"],"feedback":"Kentucky bluegrass is well adapted to athletic playing surfaces.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q054","module":"M9","question":"For lawn turf, Kentucky bluegrass is described as well adapted across which range of cultural intensity?","correct":"low to moderately high","options":["low to moderately high","only very high","only very low","moderate only"],"feedback":"Kentucky bluegrass is well adapted for lawn turf across low to moderately high intensities of culture.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q055","module":"M9","question":"For utility turf (light traffic, soil stabilization), Kentucky bluegrass is rated well adapted, though the module notes that:","correct":"other alternatives are available","options":["other alternatives are available","it requires the most cultural inputs of any use","it cannot tolerate any traffic","it is the only species suitable"],"feedback":"Kentucky bluegrass is well adapted for utility turf, but other alternative species are also available for this use.","source":"M9.2: Kentucky Bluegrass","kind":"module"},{"id":"m9q056","module":"M9","question":"On a golf course, annual bluegrass's adaptation to tees is rated:","correct":"well adapted","options":["well adapted","marginally adapted","not adapted","not suitable"],"feedback":"Annual bluegrass is well adapted to golf tees.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q057","module":"M9","question":"On a golf course, annual bluegrass's adaptation to fairways is rated:","correct":"well adapted","options":["well adapted","marginally adapted","not adapted","not suitable"],"feedback":"Annual bluegrass is well adapted to golf fairways.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q058","module":"M9","question":"On a golf course, annual bluegrass's adaptation to roughs is rated:","correct":"not well adapted","options":["not well adapted","well adapted","ideal","marginally superior"],"feedback":"Unlike greens, tees, and fairways, annual bluegrass is not well adapted to golf roughs.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q059","module":"M9","question":"For athletic playing surfaces, annual bluegrass is rated:","correct":"not adapted","options":["not adapted","well adapted","marginally adapted","ideal"],"feedback":"Annual bluegrass does not adapt to athletic-field use.","source":"M9.6: Annual Bluegrass","kind":"module"},{"id":"m9q060","module":"M9","question":"Beyond overseeding greens, rough bluegrass's adaptation to golf tees, fairways, and roughs is rated:","correct":"not suitable","options":["not suitable","marginally adapted","well adapted","ideal"],"feedback":"Aside from overseeding greens (e.g., dormant bermudagrass), rough bluegrass is not suitable for tees, fairways, or roughs.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q061","module":"M9","question":"For athletic playing surfaces, rough bluegrass is rated:","correct":"not suitable","options":["not suitable","well adapted","marginally adapted","ideal"],"feedback":"Rough bluegrass is not suitable for athletic-field use.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q062","module":"M9","question":"For utility turf (light traffic, soil stabilization), rough bluegrass is rated:","correct":"not adapted","options":["not adapted","well adapted","marginally adapted","ideal"],"feedback":"Rough bluegrass is not adapted for utility turf use.","source":"M9.8: Rough Bluegrass","kind":"module"},{"id":"m9q063","module":"M9","question":"In a field study comparing Kentucky bluegrass cultivars' resistance to weed invasion, which cultivar became infested with annual bluegrass while A-34 resisted invasion under the same conditions?","correct":"PENNSTAR","options":["PENNSTAR","Merion","Kenblue","Nugget"],"feedback":"In the field study, PENNSTAR became infested with annual bluegrass while A-34 resisted its invasion.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q064","module":"M9","question":"A photograph of a patchy Kentucky bluegrass stand at the Chicago Golf Club illustrates:","correct":"the separation of genotypes over time under the cultural system employed","options":["the separation of genotypes over time under the cultural system employed","complete turf failure from disease","the effects of a single catastrophic drought","uniform growth across all cultivars in a blend"],"feedback":"The patchy appearance reflects how different genotypes within the stand separated out over time under the golf course's cultural system.","source":"M9.3: Rhizome Development in Kentucky Bluegrass","kind":"module"},{"id":"m9q065","module":"M9","question":"The Merion-Kenblue blend comparison was established in early ________, with quality ratings taken in May of three successive years (1974-1976).","correct":"1972","options":["1972","1937","1965","1980"],"feedback":"The Merion-Kenblue blend plots were established in early 1972, with quality ratings taken each May for three years afterward.","source":"M9.4: Other Kentucky Bluegrass Cultivars","kind":"module"},{"id":"m9q066","module":"M9","question":"In the Merion-Kenblue quality rating chart, the scale runs from 1 to 9, where a rating of 1 represents:","correct":"the best quality","options":["the best quality","the worst quality","average quality","no data collected"],"feedback":"The Merion-Kenblue chart uses a \"1-best\" scale — a lower number means better quality.","source":"M9.4: Other Kentucky Bluegrass Cultivars","kind":"module"},{"id":"m9q067","module":"M9","question":"In the Nugget-versus-Park seasonal quality chart, the scale also runs from 1 to 9, but here a rating of 9 represents:","correct":"the best quality","options":["the best quality","the worst quality","average quality","no data collected"],"feedback":"Unlike the Merion-Kenblue chart, the Nugget-Park seasonal chart uses a \"9-best\" scale — a higher number means better quality.","source":"M9.4: Other Kentucky Bluegrass Cultivars","kind":"module"},{"id":"m9q068","module":"M9","question":"A root-system comparison image shows that, compared with A-34 Kentucky bluegrass, Reveille (the Texas x Kentucky bluegrass hybrid) has:","correct":"deeper, more extensive roots","options":["deeper, more extensive roots","a shallower, more compact root system","no visible taproot","roots identical in depth to A-34"],"feedback":"The root-system comparison image is captioned \"Improved rooting with Reveille,\" showing deeper roots than the A-34 Kentucky bluegrass cultivar.","source":"M9.5: Texas Bluegrass","kind":"module"},{"id":"m9q069","module":"M9","question":"On a golf green, the observed range of annual bluegrass phenotypes spans from a coarser \"rough type\" through intermediate \"turf type\" plants to a fine-textured, dense:","correct":"greens type","options":["greens type","fairway type","tee type","utility type"],"feedback":"Annual bluegrass phenotypes on a golf green range from rough type and turf type to the fine-textured, dense greens type.","source":"M9.7: Varieties of Annual Bluegrass","kind":"module"},{"id":"m9q070","module":"M9","question":"The photograph of a crew member syringing a greens-type annual bluegrass green was taken at:","correct":"Oakmont Country Club","options":["Oakmont Country Club","Merion Golf Club","Chicago Golf Club","St. Andrews"],"feedback":"The syringing photograph was taken at Oakmont Country Club.","source":"M9.7: Varieties of Annual Bluegrass","kind":"module"}];const KEY='turf235_exam1_m9_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M9 cleared</h2><p>You retired all 70 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M9 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
