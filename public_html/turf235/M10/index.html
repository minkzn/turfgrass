const BANK=[{"id":"m10q001","module":"M10","question":"At Beaver Stadium, perennial ryegrass is used to overseed the principally ________ turf whenever there is damage from play.","correct":"Kentucky bluegrass","options":["Kentucky bluegrass","creeping bentgrass","tall fescue","annual bluegrass"],"feedback":"Beaver Stadium's turf is principally Kentucky bluegrass, overseeded with perennial ryegrass to repair damage from play.","source":"M10.1: Overview","kind":"module"},{"id":"m10q002","module":"M10","question":"The traits that make perennial ryegrass almost ideal for overseeding wear-damaged turf are rapid germination, vigorous seedling growth, and:","correct":"excellent wear tolerance","options":["excellent wear tolerance","deep rhizome growth","low fertility requirements","shade tolerance"],"feedback":"Rapid germination, vigorous seedling growth, and excellent wear tolerance make perennial ryegrass well suited to overseeding damaged turf.","source":"M10.1: Overview","kind":"module"},{"id":"m10q003","module":"M10","question":"The Latin name of perennial ryegrass is:","correct":"Lolium perenne L.","options":["Lolium perenne L.","Lolium multiflorum Lam.","Poa pratensis L.","Festuca arundinacea Schreb."],"feedback":"Perennial ryegrass is Lolium perenne L.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q004","module":"M10","question":"The ligule on perennial ryegrass is overall described as:","correct":"medium, rounded, membranous","options":["medium, rounded, membranous","short, rounded, membranous","long, pointed, membranous","short, hairy, truncate"],"feedback":"Perennial ryegrass's ligule is medium, rounded, and membranous.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q005","module":"M10","question":"More precisely, the ligule on perennial ryegrass is:","correct":"membranous, 0.5 to 2 mm long, truncate to rounded","options":["membranous, 0.5 to 2 mm long, truncate to rounded","membranous, 0.5 to 2 mm long, rounded","membranous, 2 to 6 mm long, pointed or notched","a fringe of short hairs"],"feedback":"Perennial ryegrass's ligule is membranous, 0.5 to 2 mm long, and truncate to rounded in shape.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q006","module":"M10","question":"The preferred mowing height for perennial ryegrass is:","correct":"0.5 - 2.0 inches","options":["0.5 - 2.0 inches","0.75 - 2.5 inches","1.0 - 3.0 inches","less than 1 inch"],"feedback":"Perennial ryegrass is best mowed at 0.5 to 2.0 inches.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q007","module":"M10","question":"The preferred nitrogen fertilization rate for perennial ryegrass is:","correct":"2.0 - 6.0 lb. N / K ft² / year","options":["2.0 - 6.0 lb. N / K ft² / year","2.0 - 4.0 lb. N / K ft² / year","4.0 - 6.0 lb. N / K ft² / year","0.5 - 2.0 lb. N / K ft² / year"],"feedback":"Perennial ryegrass's preferred fertilization rate is 2.0 to 6.0 lb N/K ft²/year.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q008","module":"M10","question":"The preferred irrigation amount for perennial ryegrass is:","correct":"as needed","options":["as needed","frequent, often daily","minimal, only during establishment","none required"],"feedback":"Perennial ryegrass is irrigated as needed to sustain growth.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q009","module":"M10","question":"Besides mowing, fertilization, and irrigation, a key \"other\" cultural practice listed for perennial ryegrass is:","correct":"overseeding as needed","options":["overseeding as needed","core cultivation twice yearly","topdressing with sand","vertical mowing"],"feedback":"Overseeding as needed is listed as an additional cultural practice for perennial ryegrass.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q010","module":"M10","question":"On a golf course, perennial ryegrass's adaptation to greens is rated:","correct":"overseeding bermudagrass","options":["overseeding bermudagrass","well adapted as a permanent greens turf","not adapted","marginally adapted"],"feedback":"Perennial ryegrass on greens is used for overseeding bermudagrass, not as a permanent greens turf.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q011","module":"M10","question":"On a golf course, perennial ryegrass's adaptation to tees is rated:","correct":"adapted","options":["adapted","not adapted","marginally adapted","overseeding only"],"feedback":"Perennial ryegrass is rated adapted to golf tees.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q012","module":"M10","question":"On a golf course, perennial ryegrass's adaptation to fairways is rated:","correct":"adapted","options":["adapted","not adapted","marginally adapted","overseeding only"],"feedback":"Perennial ryegrass is rated adapted to golf fairways.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q013","module":"M10","question":"On a golf course, perennial ryegrass's adaptation to roughs is rated:","correct":"adapted","options":["adapted","not adapted","marginally adapted","overseeding only"],"feedback":"Perennial ryegrass is rated adapted to golf roughs.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q014","module":"M10","question":"For athletic playing surfaces, perennial ryegrass is rated:","correct":"well adapted","options":["well adapted","marginally adapted","not adapted","not suitable"],"feedback":"Perennial ryegrass is well adapted to athletic playing surfaces.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q015","module":"M10","question":"For lawn turf, perennial ryegrass is adapted for:","correct":"moderate-to-high intensity of culture","options":["moderate-to-high intensity of culture","only very low intensity of culture","only very high intensity of culture","any intensity of culture equally"],"feedback":"Perennial ryegrass is adapted for lawn turf at moderate-to-high intensities of culture.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q016","module":"M10","question":"For utility turf (light traffic, soil stabilization), perennial ryegrass is rated:","correct":"not well adapted","options":["not well adapted","well adapted","marginally adapted","ideal"],"feedback":"Perennial ryegrass is not well adapted for utility turf use.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q017","module":"M10","question":"Close-up images of perennial ryegrass show that its abaxial leaf surface is:","correct":"glossy, with a strong keel","options":["glossy, with a strong keel","dull and essentially flat","glossy but flat, without a keel","dull, with a strong keel"],"feedback":"Perennial ryegrass's abaxial leaf surface is glossy with a strong keel.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q018","module":"M10","question":"Genetic improvements distinguishing turf-type from forage-type perennial ryegrass include finer texture, higher density, improved mowing quality, improved stress tolerance, slower shoot growth rate, and:","correct":"more pleasing color","options":["more pleasing color","deeper rhizome growth","larger seed heads","higher chromosome number"],"feedback":"Turf-type perennial ryegrass was bred for finer texture, higher density, better mowing quality and stress tolerance, slower shoot growth, and more pleasing color than the forage type.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q019","module":"M10","question":"The popularity of perennial ryegrass fairways has diminished due to susceptibility to:","correct":"gray leaf spot disease","options":["gray leaf spot disease","dollar spot disease","summer patch disease","brown patch disease"],"feedback":"Perennial ryegrass fairways have become less popular because of the species' susceptibility to gray leaf spot disease.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q020","module":"M10","question":"Gray leaf spot disease can devastate a perennial ryegrass fairway in:","correct":"just a few days","options":["just a few days","about a month","a full growing season","several years"],"feedback":"Gray leaf spot can devastate a perennial ryegrass fairway in just a few days.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q021","module":"M10","question":"Perennial ryegrass seedlings are especially susceptible to:","correct":"gray leaf spot","options":["gray leaf spot","dollar spot","summer patch","brown patch"],"feedback":"Perennial ryegrass seedlings are very susceptible to gray leaf spot disease.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q022","module":"M10","question":"On a bermudagrass green overseeded with perennial ryegrass, during winter the bermudagrass is dormant and the ryegrass forms a(n):","correct":"overwintering turf","options":["overwintering turf","permanent replacement turf","weed infestation","nurse crop only"],"feedback":"The dormant-season bermudagrass green is kept playable by an overwintering turf of perennial ryegrass.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q023","module":"M10","question":"The perennial ryegrass overwintering turf on an overseeded bermudagrass green will transition back to bermudagrass:","correct":"the following spring","options":["the following spring","within two weeks","the following fall","it does not transition back"],"feedback":"The overseeded perennial ryegrass transitions back to bermudagrass the following spring.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q024","module":"M10","question":"Perennial ryegrass turf grown without a fungal endophyte often appears:","correct":"mostly brown, with a few patches of green","options":["mostly brown, with a few patches of green","uniformly dark green","pale yellow but dense","identical to endophyte-enhanced turf"],"feedback":"Without the fungal endophyte, perennial ryegrass turf is often mostly brown with only a few green patches.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q025","module":"M10","question":"The fungal endophyte found in perennial ryegrass seed forms a ________ association with the plant.","correct":"symbiotic","options":["symbiotic","parasitic","competitive","temporary"],"feedback":"The fungal endophyte forms a symbiotic association with the perennial ryegrass plant.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q026","module":"M10","question":"Besides improved stress tolerance, the fungal endophyte in perennial ryegrass also imparts:","correct":"foliar-feeding insect resistance","options":["foliar-feeding insect resistance","disease immunity","drought-proof rooting","faster seed germination"],"feedback":"The endophyte imparts both stress tolerance and resistance to foliar-feeding insects.","source":"M10.3: Close-up of Perennial Ryegrass","kind":"module"},{"id":"m10q027","module":"M10","question":"The Latin name of annual ryegrass is:","correct":"Lolium multiflorum Lam.","options":["Lolium multiflorum Lam.","Lolium perenne L.","Lolium hybridum Hausskn.","Poa annua L."],"feedback":"Annual ryegrass is Lolium multiflorum Lam.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q028","module":"M10","question":"The ligule on annual ryegrass is overall described as:","correct":"short, rounded, membranous","options":["short, rounded, membranous","medium, rounded, membranous","long, pointed, membranous","short, hairy, truncate"],"feedback":"Annual ryegrass's ligule is short, rounded, and membranous.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q029","module":"M10","question":"More precisely, the ligule on annual ryegrass is:","correct":"membranous, 0.5 to 2 mm long, rounded","options":["membranous, 0.5 to 2 mm long, rounded","membranous, 0.5 to 2 mm long, truncate to rounded","membranous, 2 to 6 mm long, pointed or notched","a fringe of short hairs"],"feedback":"Annual ryegrass's ligule is membranous, 0.5 to 2 mm long, and rounded.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q030","module":"M10","question":"The preferred mowing height for annual ryegrass is:","correct":"0.5 - 2.0 inches","options":["0.5 - 2.0 inches","0.75 - 2.5 inches","less than 1 inch","1.0 - 3.0 inches"],"feedback":"Annual ryegrass is best mowed at 0.5 to 2.0 inches, the same range as perennial ryegrass.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q031","module":"M10","question":"The preferred nitrogen fertilization rate for annual ryegrass is:","correct":"2.0 - 6.0 lb. N / K ft² / year","options":["2.0 - 6.0 lb. N / K ft² / year","2.0 - 4.0 lb. N / K ft² / year","4.0 - 6.0 lb. N / K ft² / year","0.5 - 2.0 lb. N / K ft² / year"],"feedback":"Annual ryegrass's preferred fertilization rate is 2.0 to 6.0 lb N/K ft²/year, the same as perennial ryegrass.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q032","module":"M10","question":"On a golf course, annual ryegrass's adaptation to greens is rated:","correct":"sometimes used for overseeding bermudagrass, but the perennial species is preferred","options":["sometimes used for overseeding bermudagrass, but the perennial species is preferred","well adapted as a permanent greens turf","not adapted at all","the preferred overseeding species"],"feedback":"Annual ryegrass is sometimes used for overseeding bermudagrass greens, but perennial ryegrass is preferred.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q033","module":"M10","question":"On a golf course, annual ryegrass's adaptation to tees is rated:","correct":"not suitable","options":["not suitable","adapted","marginally adapted","preferred"],"feedback":"Annual ryegrass is not suitable for golf tees.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q034","module":"M10","question":"On a golf course, annual ryegrass's adaptation to fairways is rated:","correct":"sometimes used for overseeding bermudagrass, but the perennial species is preferred","options":["sometimes used for overseeding bermudagrass, but the perennial species is preferred","well adapted as a permanent fairway turf","not adapted at all","the preferred overseeding species"],"feedback":"Annual ryegrass is sometimes used for overseeding bermudagrass fairways, but perennial ryegrass is preferred.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q035","module":"M10","question":"On a golf course, annual ryegrass's adaptation to roughs is rated:","correct":"not suitable","options":["not suitable","adapted","marginally adapted","preferred"],"feedback":"Annual ryegrass is not suitable for golf roughs.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q036","module":"M10","question":"For athletic playing surfaces, annual ryegrass is rated:","correct":"not suited","options":["not suited","well adapted","marginally adapted","ideal"],"feedback":"Annual ryegrass is not suited to athletic-field use.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q037","module":"M10","question":"For lawn turf, annual ryegrass is sometimes used for \"repairing\" damaged turf, but may persist as:","correct":"objectionable clumps","options":["objectionable clumps","a dense, uniform stand","a disease-free turf","a permanent cover crop"],"feedback":"Annual ryegrass used for lawn repair may persist as objectionable clumps rather than blending in.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q038","module":"M10","question":"For utility turf (light traffic, soil stabilization), annual ryegrass is rated:","correct":"not suitable","options":["not suitable","well adapted","marginally adapted","ideal"],"feedback":"Annual ryegrass is not suitable for utility turf use.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q039","module":"M10","question":"Annual ryegrass does not form a very good turf for very long because of its intolerance of:","correct":"environmental stresses","options":["environmental stresses","close mowing only","shade only","high fertility"],"feedback":"Annual ryegrass's intolerance of environmental stresses limits how long it forms a good turf.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q040","module":"M10","question":"Perennial and annual ryegrass share the same preferred mowing height range of:","correct":"0.5 - 2.0 inches","options":["0.5 - 2.0 inches","0.75 - 2.5 inches","1.0 - 3.0 inches","less than 1 inch"],"feedback":"Both perennial and annual ryegrass are mowed at 0.5 to 2.0 inches.","source":"M10.2: Perennial Ryegrass","kind":"module"},{"id":"m10q041","module":"M10","question":"Unlike perennial ryegrass, which is adapted to golf tees and roughs, annual ryegrass's rating for both is:","correct":"not suitable","options":["not suitable","marginally adapted","overseeding only","well adapted"],"feedback":"Annual ryegrass is not suitable for golf tees or roughs, unlike perennial ryegrass, which is adapted to both.","source":"M10.4: Annual Ryegrass","kind":"module"},{"id":"m10q042","module":"M10","question":"The ryegrasses belong to the genus:","correct":"Lolium","options":["Lolium","Festuca","Poa","Agrostis"],"feedback":"The ryegrasses belong to the genus Lolium.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q043","module":"M10","question":"The genus Lolium includes about how many species, distributed primarily within the temperate climatic zone?","correct":"10","options":["10","2","25","100"],"feedback":"About 10 Lolium species are distributed primarily within the temperate zone.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q044","module":"M10","question":"The two Lolium species used as turfgrasses are perennial ryegrass and:","correct":"annual ryegrass","options":["annual ryegrass","intermediate ryegrass","smooth bromegrass","crested dogtail"],"feedback":"Perennial ryegrass and annual ryegrass are the two Lolium species used as turfgrasses.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q045","module":"M10","question":"Perennial ryegrass (Lolium perenne) is also known by the traditional common name:","correct":"English ryegrass","options":["English ryegrass","Italian ryegrass","French ryegrass","German ryegrass"],"feedback":"Perennial ryegrass is traditionally known as English ryegrass.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q046","module":"M10","question":"Annual ryegrass (Lolium multiflorum) is also known by the traditional common name:","correct":"Italian ryegrass","options":["Italian ryegrass","English ryegrass","French ryegrass","Spanish ryegrass"],"feedback":"Annual ryegrass is traditionally known as Italian ryegrass.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q047","module":"M10","question":"Traditionally, the ryegrasses have been used in seed mixtures as:","correct":"nursegrasses","options":["nursegrasses","the sole permanent species","weed suppressants","soil amendments"],"feedback":"Ryegrasses have traditionally served as nursegrasses within seed mixtures.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q048","module":"M10","question":"Ryegrasses were traditionally valued as nursegrasses in seed mixtures because of their rapid germination rate and:","correct":"vigorous seedling growth","options":["vigorous seedling growth","deep root systems","low seeding rate","high shade tolerance"],"feedback":"Rapid germination and vigorous seedling growth made ryegrasses useful nursegrasses.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q049","module":"M10","question":"According to the textbook, perennial ryegrass has a ________ growth habit.","correct":"bunch-type","options":["bunch-type","rhizomatous","stoloniferous","a mix of rhizomatous and stoloniferous"],"feedback":"Perennial ryegrass is a bunch-type grass.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q050","module":"M10","question":"Perennial ryegrass is a diploid with how many chromosomes?","correct":"14 (2n = 2x = 14)","options":["14 (2n = 2x = 14)","28 (2n = 4x = 28)","56 (2n = 8x = 56)","42 (2n = 6x = 42)"],"feedback":"Perennial ryegrass is a diploid with 14 chromosomes (2n = 2x = 14).","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q051","module":"M10","question":"According to the textbook, the vernation of perennial ryegrass is:","correct":"folded","options":["folded","rolled","flat","convolute"],"feedback":"Perennial ryegrass has folded vernation.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q052","module":"M10","question":"According to the textbook, the auricles of perennial ryegrass are:","correct":"small, soft, clawlike","options":["small, soft, clawlike","pointed, clawlike","absent","long and pointed"],"feedback":"Perennial ryegrass's auricles are small, soft, and clawlike.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q053","module":"M10","question":"According to the textbook, the collar of perennial ryegrass is:","correct":"broad, divided","options":["broad, divided","broad, continuous","narrow, divided","narrow, continuous"],"feedback":"Perennial ryegrass's collar is broad and divided.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q054","module":"M10","question":"According to the textbook, the leaf blade of perennial ryegrass is how wide?","correct":"2 to 5 mm","options":["2 to 5 mm","3 to 7 mm","1 to 3 mm","8 to 12 mm"],"feedback":"Perennial ryegrass's leaf blade is 2 to 5 mm wide.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q055","module":"M10","question":"According to the textbook, the inflorescence of perennial ryegrass is a flat spike with:","correct":"awnless spikelets","options":["awnless spikelets","awned spikelets","a single terminal spikelet","a contracted panicle"],"feedback":"Perennial ryegrass's inflorescence is a flat spike with awnless spikelets.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q056","module":"M10","question":"Perennial ryegrass grows best in neutral to slightly acid, moist soils of:","correct":"moderate to high fertility","options":["moderate to high fertility","low fertility","high salinity","poorly drained, low-oxygen conditions"],"feedback":"Perennial ryegrass performs best in neutral to slightly acid, moist soils of moderate to high fertility.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q057","module":"M10","question":"Perennial ryegrass is combined with Kentucky bluegrass for:","correct":"intensively trafficked athletic turfs","options":["intensively trafficked athletic turfs","low-maintenance roadside turf","shaded woodland turf","saline coastal turf"],"feedback":"Perennial ryegrass combined with Kentucky bluegrass is used for intensively trafficked athletic turfs.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q058","module":"M10","question":"Football fields are overseeded with perennial ryegrass to promote spring recovery and provide:","correct":"a wear-resistant turf during the playing season","options":["a wear-resistant turf during the playing season","a permanent replacement for Kentucky bluegrass","disease immunity","reduced mowing frequency"],"feedback":"Overseeding with perennial ryegrass promotes spring recovery and provides wear-resistant turf during the playing season.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q059","module":"M10","question":"Mowing quality on perennial ryegrass is sometimes poor because of:","correct":"tough vascular bundles within the leaf blades","options":["tough vascular bundles within the leaf blades","excessive thatch buildup","its rhizomatous growth habit","its low shoot density"],"feedback":"Tough vascular bundles within perennial ryegrass leaf blades sometimes cause poor mowing quality.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q060","module":"M10","question":"The fungal endophyte found in perennial ryegrass cultivars is:","correct":"Neotyphodium lolii (formerly Acremonium)","options":["Neotyphodium lolii (formerly Acremonium)","Dreschlera poae","Bipolaris sorokiniana","Rhizoctonia solani"],"feedback":"The endophyte in perennial ryegrass cultivars is Neotyphodium lolii, formerly classified as Acremonium.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q061","module":"M10","question":"According to the textbook, the vernation of annual ryegrass is:","correct":"rolled","options":["rolled","folded","flat","convolute"],"feedback":"Annual ryegrass has rolled vernation, unlike perennial ryegrass's folded vernation.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q062","module":"M10","question":"According to the textbook, the auricles of annual ryegrass are:","correct":"pointed, clawlike","options":["pointed, clawlike","small, soft, clawlike","absent","short and blunt"],"feedback":"Annual ryegrass's auricles are pointed and clawlike.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q063","module":"M10","question":"According to the textbook, the collar of annual ryegrass is:","correct":"broad, continuous","options":["broad, continuous","broad, divided","narrow, divided","narrow, continuous"],"feedback":"Annual ryegrass's collar is broad and continuous, unlike perennial ryegrass's broad, divided collar.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q064","module":"M10","question":"According to the textbook, the leaf blade of annual ryegrass is how wide?","correct":"3 to 7 mm","options":["3 to 7 mm","2 to 5 mm","1 to 3 mm","8 to 12 mm"],"feedback":"Annual ryegrass's leaf blade is 3 to 7 mm wide.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q065","module":"M10","question":"According to the textbook, the abaxial leaf surface of annual ryegrass is:","correct":"smooth and glossy","options":["smooth and glossy","glossy with a strong keel","dull and essentially flat","dull with a strong keel"],"feedback":"Annual ryegrass's abaxial leaf surface is smooth and glossy, without the strong keel seen on perennial ryegrass.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q066","module":"M10","question":"According to the textbook, the inflorescence of annual ryegrass is a flat spike with:","correct":"awned spikelets","options":["awned spikelets","awnless spikelets","a single terminal spikelet","a contracted panicle"],"feedback":"Annual ryegrass's inflorescence is a flat spike with awned spikelets, unlike perennial ryegrass's awnless spikelets.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q067","module":"M10","question":"Annual ryegrass's use in seed mixtures is discouraged because its aggressive seedling growth may prevent establishment of:","correct":"the more desirable cool-season turfgrasses","options":["the more desirable cool-season turfgrasses","warm-season turfgrasses","its own seedlings","weeds"],"feedback":"Annual ryegrass's vigorous seedling growth can crowd out the more desirable cool-season turfgrasses it's mixed with.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q068","module":"M10","question":"In subtropical climates, annual ryegrass is widely used for overseeding dormant or semidormant warm-season turfs for winter play and:","correct":"color","options":["color","disease resistance","nitrogen fixation","soil stabilization"],"feedback":"Annual ryegrass overseeding provides winter play and color on dormant warm-season turf.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q069","module":"M10","question":"The annual ryegrass cultivar bred for better spring transition in overseeded warm-season turf is:","correct":"Panterra","options":["Panterra","Pennfine","Repell","Manhattan"],"feedback":"Panterra is a relatively fine-textured, slow-growing annual ryegrass cultivar bred for better spring transition.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q070","module":"M10","question":"Intermediate ryegrass's Latin name is:","correct":"Lolium x hybridum Hausskn.","options":["Lolium x hybridum Hausskn.","Lolium perenne x multiflorum","Lolium intermedium Lam.","Lolium hybridus Schreb."],"feedback":"Intermediate ryegrass is Lolium x hybridum Hausskn.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q071","module":"M10","question":"Intermediate ryegrass is a naturally occurring or human-made hybrid derived from crossing:","correct":"perennial ryegrass (L. perenne) and annual ryegrass (L. multiflorum)","options":["perennial ryegrass (L. perenne) and annual ryegrass (L. multiflorum)","perennial ryegrass and tall fescue","annual ryegrass and Kentucky bluegrass","two perennial ryegrass cultivars"],"feedback":"Intermediate ryegrass is a hybrid of perennial ryegrass and annual ryegrass.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q072","module":"M10","question":"Turf-type intermediate ryegrass cultivars were developed to combine perennial ryegrass's turf quality with annual ryegrass's rapid germination and:","correct":"quick spring transition characteristics","options":["quick spring transition characteristics","deep root system","disease resistance","shade tolerance"],"feedback":"Intermediate ryegrass combines perennial ryegrass's turf quality with annual ryegrass's rapid germination and quick spring transition.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q073","module":"M10","question":"Turf-type intermediate ryegrass cultivars include Froghair II, Transeze, and:","correct":"Transist","options":["Transist","Panterra","Pennfine","Repell"],"feedback":"Froghair II, Transeze, and Transist are turf-type intermediate ryegrass cultivars.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q074","module":"M10","question":"Improved turf-type perennial ryegrass cultivars listed in the textbook include Citation, Derby, Diplomat, Manhattan, Palmer, Pennant, Pennfine, and:","correct":"Repell","options":["Repell","Panterra","Transist","Reveille"],"feedback":"Repell is among the improved turf-type perennial ryegrass cultivars listed alongside Citation, Derby, Diplomat, Manhattan, Palmer, Pennant, and Pennfine.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q075","module":"M10","question":"Which ryegrass species has rolled vernation: perennial or annual?","correct":"annual ryegrass","options":["annual ryegrass","perennial ryegrass","both have rolled vernation","neither has rolled vernation"],"feedback":"Annual ryegrass has rolled vernation; perennial ryegrass's vernation is folded.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q076","module":"M10","question":"Which ryegrass species's inflorescence bears awned spikelets: perennial or annual?","correct":"annual ryegrass","options":["annual ryegrass","perennial ryegrass","both bear awned spikelets","neither bears awned spikelets"],"feedback":"Annual ryegrass's spikelets are awned; perennial ryegrass's spikelets are awnless.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"},{"id":"m10q077","module":"M10","question":"Which ryegrass species has a glossy, strongly keeled abaxial leaf surface: perennial or annual?","correct":"perennial ryegrass","options":["perennial ryegrass","annual ryegrass","both have a keeled abaxial surface","neither has a keeled abaxial surface"],"feedback":"Perennial ryegrass's abaxial leaf surface is glossy with a strong keel; annual ryegrass's is smooth and glossy without a keel.","source":"Textbook Ch. 3, pp. 66-68: Turfgrass Species","kind":"enrichment"}];const KEY='turf235_exam1_m10_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M10 cleared</h2><p>You retired all 77 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M10 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
