const BANK=[{"id":"m3q001","module":"M3","question":"The highly compressed, unelongated stem at the base of an aerial shoot, hidden among the leaves, is called the:","correct":"crown","options":["crown","culm","rhizome","node"],"feedback":"The crown is an unelongated stem at the base of the leaves, with a growing point at its top.","source":"M3.2: Grass Shoot","kind":"module"},{"id":"m3q002","module":"M3","question":"New turfgrass leaves arise from their respective:","correct":"growing points","options":["growing points","axillary buds","root initials","bud primordia"],"feedback":"New leaves arise from the growing point, which contains leaf primordia.","source":"M3.2: Grass Shoot","kind":"module"},{"id":"m3q003","module":"M3","question":"Rhizomes, as well as stolons, are lateral shoots that arise from the stem's:","correct":"axillary buds","options":["ancillary buds","axillary buds","primordial buds"],"feedback":"Axillary buds along the sides of the crown give rise to tillers, rhizomes, and stolons.","source":"M3.2: Grass Shoot","kind":"module"},{"id":"m3q004","module":"M3","question":"The process by which new tillers emerge intravaginally from axillary buds is called:","correct":"intravaginal","options":["extramural","intramural","extravaginal","intravaginal"],"feedback":"Tillers emerge intravaginally, growing upward within the enclosing leaf sheaths of the parent shoot.","source":"M3.2: Grass Shoot","kind":"module"},{"id":"m3q005","module":"M3","question":"The process by which lateral shoots (rhizomes and stolons) break through the enclosing leaf sheaths is called:","correct":"extravaginal","options":["extramural","intramural","extravaginal","intravaginal"],"feedback":"Rhizomes and stolons emerge extravaginally, breaking through the subtending leaf sheath.","source":"M3.2: Grass Shoot","kind":"module"},{"id":"m3q006","module":"M3","question":"In a turfgrass shoot, the oldest leaves are located at the ________ of the shoot.","correct":"base","options":["base","tip","midpoint","crown only"],"feedback":"The oldest leaves are at the base of the shoot; the youngest are at the uppermost position.","source":"M3.3: Growing Point","kind":"module"},{"id":"m3q007","module":"M3","question":"Leaf primordia arise due to cell division below the:","correct":"apical meristem","options":["apical meristem","root cap","endodermis","Casparian strip"],"feedback":"Leaf primordia arise from cell division below the apical meristem at the growing point.","source":"M3.3: Growing Point","kind":"module"},{"id":"m3q008","module":"M3","question":"Subsequent meristematic activity restricted to the basal portion of a leaf primordium establishes the:","correct":"intercalary meristem","options":["intercalary meristem","apical meristem","lateral meristem","root meristem"],"feedback":"After the leaf tip forms, meristematic activity becomes restricted to the base of the primordium, forming the intercalary meristem.","source":"M3.3: Growing Point","kind":"module"},{"id":"m3q009","module":"M3","question":"The entire length of a grass shoot's growing point is usually less than:","correct":"one millimeter","options":["one millimeter","one centimeter","one inch","five millimeters"],"feedback":"The growing point is usually less than one millimeter in total length.","source":"M3.3: Growing Point","kind":"module"},{"id":"m3q010","module":"M3","question":"A rhizome is a lateral shoot that grows beneath the ground via elongation of the:","correct":"stem internodes","options":["stem internodes","root hairs","leaf primordia","auricles"],"feedback":"A rhizome grows beneath the ground through stem internode elongation.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q011","module":"M3","question":"Once a rhizome tip reaches the surface, further internode elongation is stopped by:","correct":"light","options":["light","aeration","compression","heat"],"feedback":"Light inhibits further internode elongation once a rhizome reaches the surface, triggering formation of a daughter plant.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q012","module":"M3","question":"The two types of rhizomes are determinate and:","correct":"indeterminate","options":["indeterminate","adventitious","seminal","intravaginal"],"feedback":"Rhizomes are classified as determinate (short, three growth phases) or indeterminate (long, branching at nodes).","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q013","module":"M3","question":"Determinate rhizome growth occurs in three phases: initially downward, then horizontal, and finally:","correct":"upward","options":["upward","diagonal","stationary","lateral only"],"feedback":"Determinate rhizomes grow downward, then horizontal, then upward toward the surface.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q014","module":"M3","question":"Indeterminate rhizomes are long and tend to branch at the:","correct":"nodes","options":["nodes","tips only","root cap","crown"],"feedback":"Indeterminate rhizomes are long and branch at the nodes, with aerial shoots arising from axillary buds along them.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q015","module":"M3","question":"The conical tip of a rhizome is formed by bladeless, scale-like leaves called:","correct":"cataphylls","options":["primordia","protophylls","plastophylls","cataphylls"],"feedback":"Cataphylls are bladeless leaves produced at the rhizome's growing point, forming its conical tip.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q016","module":"M3","question":"The rhizome tip is actually a series of conical (cataphyll) leaves that encloses the:","correct":"growing point","options":["protophylls","growing point","nodes","rhizocaps"],"feedback":"The rhizome's conical tip of cataphylls encloses the growing point.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q017","module":"M3","question":"The rhizome tip is pushed through the soil primarily by elongation of the:","correct":"internodes","options":["internodes","nodes","leaves","roots"],"feedback":"Elongation of the stem internodes is largely responsible for pushing the rhizome tip through the soil.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q018","module":"M3","question":"During summer months, Kentucky bluegrass rhizomes tend to grow relatively long horizontally and are called:","correct":"extensor rhizomes","options":["extensor rhizomes","sprout rhizomes","determinate rhizomes only","cataphyll rhizomes"],"feedback":"Long, horizontally-growing summer rhizomes of Kentucky bluegrass are called \"extensor\" rhizomes.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q019","module":"M3","question":"During spring and fall, Kentucky bluegrass rhizomes that turn upward almost immediately are called:","correct":"sprout rhizomes","options":["sprout rhizomes","extensor rhizomes","cataphyll rhizomes","tiller rhizomes"],"feedback":"Kentucky bluegrass rhizomes that turn up almost immediately during spring and fall are called \"sprout\" rhizomes.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q020","module":"M3","question":"In a mature turfgrass community, the root system is expected to be entirely:","correct":"adventitious","options":["adventitious","seminal","determinate","indeterminate"],"feedback":"While both seminal and adventitious roots may be observed, the mature turfgrass root system is expected to be entirely adventitious.","source":"M3.4: Turfgrass Stems","kind":"module"},{"id":"m3q021","module":"M3","question":"In some species, only specialized epidermal cells called ________ can form root hairs.","correct":"tricoblasts","options":["tricoblasts","coleorhizae","epiblasts","coleoptiles"],"feedback":"In some species, only specialized epidermal cells called tricoblasts can form root hairs.","source":"M3.5: Roots","kind":"module"},{"id":"m3q022","module":"M3","question":"Root hairs measure about 100 microns in length and, per mm² of root surface, occur at a density of about:","correct":"50 to 100","options":["50 to 100","5 to 10","500 to 1,000","1 to 5"],"feedback":"Root hairs are about 100 microns long, 5-17 microns in diameter, at a density of 50-100 per mm² of root surface.","source":"M3.5: Roots","kind":"module"},{"id":"m3q023","module":"M3","question":"A root tip may produce as many as 18,000 new cells and extend up to ________ per day.","correct":"5 cm","options":["5 cm","5 mm","50 cm","1 cm"],"feedback":"Active meristematic growth at the root tip can produce up to 18,000 new cells and extend the root up to 5 cm per day.","source":"M3.5: Roots","kind":"module"},{"id":"m3q024","module":"M3","question":"The root cap is composed of loosely arranged cells that are completely renewed every:","correct":"6 to 9 days","options":["6 to 9 days","1 to 2 days","3 to 4 weeks","6 months"],"feedback":"The root cap's cells are completely renewed every 6 to 9 days.","source":"M3.5: Roots","kind":"module"},{"id":"m3q025","module":"M3","question":"In addition to protecting the root tip and regulating geotropic curvature, the root cap produces a \"slime sheath\" that:","correct":"lubricates the soil and favors mycorrhizae growth","options":["lubricates the soil and favors mycorrhizae growth","hardens the root surface against pests","increases root cell wall rigidity","prevents any water loss"],"feedback":"The slime sheath lubricates the soil, favors mycorrhizae growth, increases nutrient availability, promotes soil aggregation, and reduces desiccation susceptibility.","source":"M3.5: Roots","kind":"module"},{"id":"m3q026","module":"M3","question":"The central core of a turfgrass root, containing the vascular tissue, is called the:","correct":"stele","options":["stele","cortex","cataphyll","rhizosphere"],"feedback":"The stele is the central core of the root containing the vascular tissue, surrounded by the cortex and epidermis.","source":"M3.5: Roots","kind":"module"},{"id":"m3q027","module":"M3","question":"Root epidermal cells are covered by a protective hydrophobic lipid layer called the cuticle; their permeability decreases as they accumulate a waxy substance in the cell walls called:","correct":"suberin","options":["suberin","cutin","lignin","chitin"],"feedback":"As epidermal cells accumulate suberin (suberization), they become increasingly resistant to water and nutrient movement.","source":"M3.5: Roots","kind":"module"},{"id":"m3q028","module":"M3","question":"Water, nutrients, and growth regulators move from the roots to the shoots within the:","correct":"xylem","options":["xylem","phloem","cortex","cuticle"],"feedback":"The xylem carries water, nutrients, and growth regulators (originating in the roots) upward from roots to shoots.","source":"M3.5: Roots","kind":"module"},{"id":"m3q029","module":"M3","question":"Photoassimilates move from the shoots down to the roots within the:","correct":"phloem","options":["phloem","xylem","stele epidermis","root cap"],"feedback":"The phloem carries photoassimilates and growth regulators from the shoots down to the roots.","source":"M3.5: Roots","kind":"module"},{"id":"m3q030","module":"M3","question":"The movement of water and soluble nutrients (such as nitrate ions) from the soil to the root is called:","correct":"mass flow","options":["mass flow","active transport","osmosis alone","turgor pressure"],"feedback":"Mass flow describes the movement of water and soluble nutrients like nitrate from soil to root.","source":"M3.5: Roots","kind":"module"},{"id":"m3q031","module":"M3","question":"A root's ability to access less-soluble nutrients, such as phosphate ions, depends largely on:","correct":"root growth","options":["root growth","leaf color","mowing frequency","thatch depth"],"feedback":"Because less-soluble nutrients like phosphate aren't readily carried to the root by mass flow, access depends largely on root growth reaching them.","source":"M3.5: Roots","kind":"module"},{"id":"m3q032","module":"M3","question":"Which of the following is listed as a soil factor (rather than a root factor) affecting water uptake?","correct":"hydraulic conductivity","options":["hydraulic conductivity","root density","root depth","root distribution"],"feedback":"Hydraulic conductivity — the rate water moves through soil toward the root — is a soil factor, distinct from root growth, density, depth, resistance, distribution, and soil contact.","source":"M3.6: Water Uptake by Roots","kind":"module"},{"id":"m3q033","module":"M3","question":"The sum of forces a root must overcome to absorb water from the soil is called soil:","correct":"water potential","options":["water potential","hydraulic conductivity","mechanical impedance","aeration"],"feedback":"Water potential is the sum of forces a root must overcome to absorb water from the soil.","source":"M3.6: Water Uptake by Roots","kind":"module"},{"id":"m3q034","module":"M3","question":"Physical obstacles such as compaction that restrict water movement through soil are described as:","correct":"mechanical impedance","options":["mechanical impedance","water potential","hydraulic conductivity","water table depth"],"feedback":"Mechanical impedance refers to physical obstacles, like compaction, that restrict water movement toward the root.","source":"M3.6: Water Uptake by Roots","kind":"module"},{"id":"m3q035","module":"M3","question":"Even a well-developed root system cannot compensate for soil that physically restricts water movement, and even ideal soil conditions cannot be exploited by a poorly developed:","correct":"root system","options":["root system","thatch layer","shoot canopy","irrigation system"],"feedback":"Soil water-uptake factors and root factors interact — neither alone can compensate for a deficiency in the other.","source":"M3.6: Water Uptake by Roots","kind":"module"},{"id":"m3q036","module":"M3","question":"The soil zone deeply modified by root activity, differing measurably from bulk soil only millimeters away, is the:","correct":"rhizosphere","options":["rhizosphere","cortex","stele","endodermis"],"feedback":"The rhizosphere is the zone of soil deeply modified by root activity.","source":"M3.7: Soil Changes Induced by Roots","kind":"module"},{"id":"m3q037","module":"M3","question":"As roots grow and expand, they physically compress the surrounding soil — this is an example of a ________ change induced by roots.","correct":"physical","options":["physical","chemical","biological only","none of these"],"feedback":"Soil compression at the root surface is a physical change induced by root growth.","source":"M3.7: Soil Changes Induced by Roots","kind":"module"},{"id":"m3q038","module":"M3","question":"Root respiration increases soil CO2 and decreases soil O2 near the root — this is an example of a ________ change induced by roots.","correct":"chemical","options":["chemical","physical only","mechanical","none of these"],"feedback":"Respiration-induced changes in soil CO2 and O2 are chemical changes induced by roots in the rhizosphere.","source":"M3.7: Soil Changes Induced by Roots","kind":"module"},{"id":"m3q039","module":"M3","question":"Roots lower the pH of the thin layer of soil immediately surrounding them through ion exchange and:","correct":"exudate release","options":["exudate release","mechanical compression","water table rise","thatch decomposition"],"feedback":"Rhizosphere pH alteration occurs through ion exchange and the release of root exudates.","source":"M3.7: Soil Changes Induced by Roots","kind":"module"},{"id":"m3q040","module":"M3","question":"The rhizosphere soil zone directly affected by root exudates, lysates, and mucilages — distinct from the root's own cortex tissue — is called the:","correct":"ectorhizosphere","options":["ectorhizosphere","endorhizosphere","apoplast","symplast"],"feedback":"The ectorhizosphere is the soil zone modified by root activity, distinguished from the endorhizosphere (the cortex tissue within the root).","source":"M3.8: Rhizosphere","kind":"module"},{"id":"m3q041","module":"M3","question":"Rhizosphere soil contains how many times as many microorganisms as bulk soil?","correct":"50 to 100 times","options":["50 to 100 times","2 to 5 times","1,000 times","about the same"],"feedback":"Rhizosphere soil contains as many as 50 to 100 times as many microorganisms as bulk soil, due to root exudates, lysates, and mucilages.","source":"M3.8: Rhizosphere","kind":"module"},{"id":"m3q042","module":"M3","question":"In the root cap zone, massive amounts of exudates and mucilages are excreted; mucilages are best described as:","correct":"carbohydrate materials","options":["carbohydrate materials","waxy lipid compounds","mineral salts","protein fibers"],"feedback":"Mucilages are carbohydrate materials excreted by the root cap zone into the rhizosphere.","source":"M3.8: Rhizosphere","kind":"module"},{"id":"m3q043","module":"M3","question":"In the rhizosphere effect progression, epidermal cell autolysis refers to cells that:","correct":"enzymatically self-destruct, providing substrates for microbial growth","options":["enzymatically self-destruct, providing substrates for microbial growth","divide rapidly to repair damage","secrete a new secondary cell wall","block microbial invasion entirely"],"feedback":"Epidermal cell autolysis is the enzymatic self-destruction of cells, which provides lysates as substrate for microbial growth.","source":"M3.8: Rhizosphere","kind":"module"},{"id":"m3q044","module":"M3","question":"Which of these is listed as an unfavorable environmental (not cultural) condition for turfgrass root growth?","correct":"O2 deficiency","options":["O2 deficiency","close mowing","excessive nitrogen","thatch accumulation"],"feedback":"O2 deficiency (along with high soil temperature, unfavorable pH, and high salt) is an unfavorable environmental factor; close mowing, excess N, K deficiency, and thatch are cultural factors.","source":"M3.9: Root Growth","kind":"module"},{"id":"m3q045","module":"M3","question":"Unfavorable root growth conditions include soil pH substantially below 5.0 or above:","correct":"7.0","options":["7.0","6.0","8.5","10.0"],"feedback":"Soil pH below 5.0 or above 7.0 is unfavorable for turfgrass root growth.","source":"M3.9: Root Growth","kind":"module"},{"id":"m3q046","module":"M3","question":"Which of these is listed as an unfavorable cultural (not environmental) factor for turfgrass root growth?","correct":"excessive nitrogen fertilization","options":["excessive nitrogen fertilization","high soil temperature","O2 deficiency","high salt concentration"],"feedback":"Excessive nitrogen (along with close mowing, K deficiency, and thatch) is a cultural factor; the others are environmental.","source":"M3.9: Root Growth","kind":"module"},{"id":"m3q047","module":"M3","question":"An important goal of turfgrass culture is maintaining a favorable balance between root growth and:","correct":"shoot growth","options":["shoot growth","seed production","thatch accumulation","soil compaction"],"feedback":"Maintaining a favorable root:shoot ratio is an important goal of turfgrass culture.","source":"M3.9: Root Growth","kind":"module"},{"id":"m3q048","module":"M3","question":"If much of a cool-season turfgrass's root system is lost during summer and too few new roots develop, the community's capacity to meet its moisture and nutritional needs from the soil is:","correct":"reduced","options":["reduced","unaffected","increased","doubled"],"feedback":"Seasonal loss of roots without adequate replacement reduces the turf's capacity to draw moisture and nutrients from the soil.","source":"M3.9: Root Growth","kind":"module"},{"id":"m3q049","module":"M3","question":"Separating the stele from the cortex is a layer of specialized cells called the:","correct":"endodermis","options":["pericycle","epidermis","epicycle","endodermis"],"feedback":"The endodermis is the layer of specialized cells separating the stele from the cortex.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q050","module":"M3","question":"A band of suberin on the endodermal cell walls that impedes apoplastic movement of materials into the stele is called the:","correct":"Casparian strip","options":["Casparian strip","Carthetian band","suberdermis","cuticle"],"feedback":"The Casparian strip is a band of suberin on endodermal cell walls that blocks apoplastic movement into the stele.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q051","module":"M3","question":"Water diverted into the endodermal cells passes through the pericycle and into the conducting cells of the:","correct":"xylem","options":["xylem","phloem","cortex","epidermis"],"feedback":"Water moves through the pericycle into the xylem's conducting cells after crossing the endodermis.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q052","module":"M3","question":"Diffusion of materials through the living cortex cells themselves (not through cell-wall pores) is called ________ movement.","correct":"symplastic","options":["symplastic","apoplastic","basipetal","acropetal"],"feedback":"Symplastic movement is diffusion through the living cortex cells; apoplastic movement is diffusion through pores in the cell walls.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q053","module":"M3","question":"Diffusion of materials through pores within the cortex cell walls (rather than through the living cells) is called ________ movement.","correct":"apoplastic","options":["symplastic","apoplastic","basipetal","acropetal"],"feedback":"Apoplastic movement is diffusion through pores within the cell walls, as opposed to symplastic movement through living cells.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q054","module":"M3","question":"The upward movement of water and nutrients absorbed from the soil, from the root tip toward the base of the plant, is called ________ transport.","correct":"basipetal","options":["basipetal","acropetal","symplastic","apoplastic"],"feedback":"Basipetal transport moves absorbed water and nutrients from the root tip toward the base of the plant.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q055","module":"M3","question":"Subsequent movement of water and nutrients from the base of the plant up to the leaves is called ________ transport.","correct":"acropetal","options":["acropetal","basipetal","symplastic","apoplastic"],"feedback":"Acropetal transport carries water and nutrients from the base of the plant onward to the leaves.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q056","module":"M3","question":"Kentucky bluegrass, which retains a major portion of its roots for more than a year, is described as a ________ rooting grass.","correct":"perennial","options":["perennial","annual","biennial","ephemeral"],"feedback":"Kentucky bluegrass is a perennial rooting grass, retaining much of its root system beyond one year.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q057","module":"M3","question":"Bentgrasses, perennial ryegrass, bermudagrass, and rough bluegrass, which replace most of their root systems each year, are described as ________ rooting types.","correct":"annual","options":["annual","perennial","biennial","determinate"],"feedback":"These species replace most of their roots annually, classifying them as annual rooting types (unlike perennial-rooting Kentucky bluegrass).","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q058","module":"M3","question":"The life of an individual turfgrass shoot is usually not more than:","correct":"1 year","options":["1 year","1 week","1 month","5 years"],"feedback":"The life of an individual shoot is usually not more than 1 year, and frequently less; the plant community persists as dying shoots are replaced by new ones.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q059","module":"M3","question":"Tillers formed in the fall are especially important for:","correct":"winter survival and spring regrowth","options":["winter survival and spring regrowth","summer heat tolerance","seed production","disease resistance"],"feedback":"Fall tillers are important to winter survival and spring regrowth, though they may die during summer.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q060","module":"M3","question":"Tillers that initiate inflorescences in spring usually:","correct":"die before the end of summer","options":["die before the end of summer","live longer than vegetative tillers","become rhizomes","develop extra root systems"],"feedback":"Tillers that initiate inflorescences in spring usually die before summer's end.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q061","module":"M3","question":"A young tiller depends on the parent shoot for photoassimilates until it has developed several leaves and an adequate:","correct":"root system","options":["root system","rhizome network","seed head","thatch layer"],"feedback":"A young tiller relies on the parent shoot for photoassimilates until it grows enough leaves and roots to support itself.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q062","module":"M3","question":"Turfgrass stem internodes with a single ring of vascular bundles between the cortex and pith, as in Kentucky bluegrass, have a ________ arrangement.","correct":"simple","options":["simple","multiple","complex","compound"],"feedback":"Kentucky bluegrass exemplifies a simple internode arrangement, with a single ring of vascular bundles.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q063","module":"M3","question":"Bermudagrass exemplifies a ________ internode vascular arrangement, with an added outer circle of minor bundles in the cortex.","correct":"multiple","options":["multiple","simple","complex","compound"],"feedback":"Bermudagrass has a multiple arrangement, adding an outer circle of minor vascular bundles beyond the simple pattern.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q064","module":"M3","question":"St. Augustinegrass exemplifies a ________ internode vascular arrangement, with major bundles distributed around a continuous pith.","correct":"complex","options":["complex","simple","multiple","basal"],"feedback":"St. Augustinegrass has a complex arrangement, with major bundles distributed around the continuous pith.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q065","module":"M3","question":"Creeping bentgrass exemplifies a ________ node anatomy, where nodes are spaced far apart so a single leaf encloses each one.","correct":"simple","options":["simple","compound","complex","multiple"],"feedback":"Creeping bentgrass has simple node anatomy — widely spaced nodes each enclosed by a single leaf.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q066","module":"M3","question":"Bermudagrass exemplifies a ________ node anatomy, where several closely-spaced nodes are enclosed within several leaves.","correct":"compound","options":["compound","simple","complex","basal"],"feedback":"Bermudagrass has compound node anatomy, with several nodes close together enclosed within multiple leaves.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q067","module":"M3","question":"Mature leaves — those with the highest photosynthetic rate — primarily contribute photoassimilate to:","correct":"the growth of other plant organs","options":["the growth of other plant organs","their own further elongation","seed dormancy","root cap renewal only"],"feedback":"Mature leaves have the highest photosynthetic rate and export photoassimilate to support the growth of other plant organs.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q068","module":"M3","question":"Newly emerging leaves, which have not yet begun exporting photoassimilate, use it entirely to sustain:","correct":"their own growth","options":["their own growth","the parent shoot's roots","adjacent tillers","the rhizome system"],"feedback":"Newly emerging leaves are net importers of photoassimilate, using it all for their own growth before maturing into net exporters.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q069","module":"M3","question":"Where turfgrasses grow in severely compacted or waterlogged soils, oxygen deficiency for root respiration can restrict material transport within roots, producing a condition known as:","correct":"wet wilt","options":["wet wilt","dry rot","chlorosis","leaf scorch"],"feedback":"Oxygen deficiency in compacted or waterlogged soil can restrict root transport, causing wet wilt and other adverse effects.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"},{"id":"m3q070","module":"M3","question":"As a root ages, decay typically begins in the cortex and eventually spreads to the:","correct":"stele","options":["stele","root cap","epidermis only","root hairs only"],"feedback":"Root decay begins in the cortex and eventually spreads to the stele; the cortex may slough off entirely (decortication) in older root portions.","source":"Textbook Ch. 2, pp. 21-31: Growth and Development","kind":"enrichment"}];const KEY='turf235_exam1_m3_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M3 cleared</h2><p>You retired all 70 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M3 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
