const BANK=[{"id": "m3q001", "module": "M3", "question": "Complete the source statement: “Adventitious (secondary, nodal) roots begin forming soon after the first leaf emerges from within the ________, and subsequent formation occurs from lower nodes of rhizomes and stolons.”", "correct": "coleoptile following seed germination", "options": ["longitudinal section, (b) cross-section", "coleoptile following seed germination", "fertilization practices also affect", "shoot become almost indistinguishable."], "feedback": "Adventitious (secondary, nodal) roots begin forming soon after the first leaf emerges from within the coleoptile following seed germination, and subsequent formation occurs from lower nodes of rhizomes and stolons.", "source": "M3 assigned text · Chapter_2_Growth_and_Development · PDF p.20", "kind": "book"}, {"id": "m3q002", "module": "M3", "question": "Complete the source statement: “The arrangement of spikelets within an inflorescence is of three primary types: ________ (Figure 2.19).”", "correct": "raceme, panicle, and spike", "options": ["raceme, panicle, and spike", "producing a slime sheath.", "a-d) until leaf elongation", "sides and adventitious roots"], "feedback": "The arrangement of spikelets within an inflorescence is of three primary types: raceme, panicle, and spike (Figure 2.19).", "source": "M3 assigned text · Chapter_2_Growth_and_Development · PDF p.21", "kind": "book"}, {"id": "m3q003", "module": "M3", "question": "Complete the source statement: “2.8 Process of ________ with embryo positioned at one end, (b) emergence of a primary root and coleoptile, (c) emergence of additional seminal roots, (d) root branching, and (e) emergence of the first leaf through the top of the coleoptile.”", "correct": "germination, showing (a) caryopsis", "options": ["physically restricts water movement", "germination, showing (a) caryopsis", "natural environmental and cultural", "support; however, climatic stresses"], "feedback": "2.8 Process of germination, limate exists.”", "correct": "initiation usually takes place", "options": ["initiation usually takes place", "sheath occurs at approximately", "continuing cycle of replacement", "sheath assume different shapes."], "feedback": "Although root initiation usually takes place at or below the surface of the ground, some root formation may occur above the surface (prop roots) in dense turfs where a favorable microclimate exists.", "source": "M3 assigned text · Chapter_2_Growth_and_Development · PDF p.20", "kind": "book"}, {"id": "m3q028", "module": "M3", "question": "Complete the source statement: “Thus, a grass plant appears to be a highly organized system rather than a ________ entities.”", "correct": "collection of competing tiller", "options": ["meristem from abrasive effects", "shows the anatomical features", "collection of competing tiller", "succeeding leaf sheath occurs"], "feedback": "Thus, a grass plant appears to be a highly organized system rather than a collection of competing tiller entities.", "source": "M3 assigned text · Chapter_2_Growth_and_Development · PDF p.18", "kind": "book"}, {"id": "m3q029", "module": "M3", "question": "Complete the source statement: “The extent of rhizome growth varies from ________) to several inches or longer (extensor rhizome).”", "correct": "almost none (sprout rhizome", "options": ["forming the stem intercalary", "almost none (sprout rhizome", "crown continually forms leaf", "off (decortication) in older"], "feedback": "The extent of rhizome growth varies from almost none (sprout rhizome) to several inches or longer (extensor rhizome).", "source": "M3 assigned text · Chapter_2_Growth_and_Development · PDF p.16", "kind": "book"}, {"id": "m3q030", "module": "M3", "question": "Complete the source statement: “Although a mature tiller may appear to function as an independent entity, some relationship ________ interconnected by a common vascular system.”", "correct": "apparently exists among tillers", "options": ["Cells Elongated e
