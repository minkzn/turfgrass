const BANK=[{"id":"m1q001","module":"M1","question":"An interconnecting community of turfgrasses and the soil adhering to their roots and other belowground organs is called:","correct":"turf","options":["turf","turfgrass","sod","grass","sward"],"feedback":"Turf is an interconnecting community of turfgrasses and the soil adhering to their roots and other below-ground organs.","source":"M1.2: Terminology","kind":"module"},{"id":"m1q002","module":"M1","question":"Plants that form a more-or-less contiguous ground cover that persists under regular mowing and traffic are called:","correct":"turfgrasses","options":["turfgrasses","turf","sod","sward"],"feedback":"Turfgrasses are plants that form a more-or-less contiguous ground cover that persists under regular mowing and traffic.","source":"M1.2: Terminology","kind":"module"},{"id":"m1q003","module":"M1","question":"When the surface layer of a turf is harvested for transplanting, it is called:","correct":"sod","options":["turf","turfgrass","sod","grass","sward"],"feedback":"When the surface layer of a turf is harvested for transplanting, it is called sod.","source":"M1.2: Terminology","kind":"module"},{"id":"m1q004","module":"M1","question":"Turf and turfgrass differ in that turfgrass refers only to the plant community, while turf also includes:","correct":"the soil adhering to the roots and belowground organs","options":["the soil adhering to the roots and belowground organs","the mowing equipment used to maintain it","only the aerial shoots above the crown","the irrigation system beneath it"],"feedback":"Turf represents a higher level of ecological organization than turfgrass by including a portion of the medium (soil) the turfgrasses are growing in.","source":"M1.2: Terminology","kind":"module"},{"id":"m1q005","module":"M1","question":"The most basic function of any turf, requiring the least intensive management, is:","correct":"soil stabilization","options":["soil stabilization","aesthetics","sport and recreation","erosion display"],"feedback":"Turfs maintained solely for soil stabilization require infrequent mowing and little to no fertilization, irrigation, or other cultural practices.","source":"M1.5: Turf Function and Cultural Intensity","kind":"module"},{"id":"m1q006","module":"M1","question":"Among soil-stabilization turf, residential lawns, and sports turf, which demands the highest intensity of culture?","correct":"sports turf","options":["sports turf","residential lawns","utility turf","roadside turf"],"feedback":"Sports turfs demand the highest intensity of culture because they must withstand physical stresses of play while meeting strict playability standards.","source":"M1.5: Turf Function and Cultural Intensity","kind":"module"},{"id":"m1q007","module":"M1","question":"As mowing height [decreases/increases], the intensity of culture required to maintain acceptable turf quality goes up.","correct":"decreases","options":["decreases","increases"],"feedback":"Lower mowing heights remove a greater proportion of leaf tissue, limiting photosynthesis and root development, so closely mowed turf needs more intensive culture.","source":"M1.5: Turf Function and Cultural Intensity","kind":"module"},{"id":"m1q008","module":"M1","question":"On a typical golf course, putting greens make up about what share of the total turf area?","correct":"less than 2 percent","options":["less than 2 percent","about 10 percent","about 30 percent","about 50 percent"],"feedback":"Greens are the most intensively cultured turf on a golf course but usually constitute less than 2 percent of its area.","source":"M1.6: Turf Fields","kind":"module"},{"id":"m1q009","module":"M1","question":"Tees and collars on a golf course add up to an additional:","correct":"1 or 2 percent","options":["1 or 2 percent","10 percent","20 percent","40 percent"],"feedback":"Tees and collars add up to an additional 1 or 2 percent of golf course turf area, beyond the greens.","source":"M1.6: Turf Fields","kind":"module"},{"id":"m1q010","module":"M1","question":"Fairways and aprons on a golf course might make up as much as:","correct":"30 percent","options":["5 percent","10 percent","30 percent","60 percent"],"feedback":"Fairways and aprons might make up as much as 30 percent of golf course turf area; the rest is rough.","source":"M1.6: Turf Fields","kind":"module"},{"id":"m1q011","module":"M1","question":"The turf on the Royal Ascot Racecourse track is predominantly:","correct":"colonial bentgrass and annual bluegrass","options":["colonial bentgrass and annual bluegrass","perennial ryegrass and tall fescue","Kentucky bluegrass and red fescue","bermudagrass and zoysiagrass"],"feedback":"The Royal Ascot track is predominantly colonial bentgrass and annual bluegrass.","source":"M1.6: Turf Fields","kind":"module"},{"id":"m1q012","module":"M1","question":"At Royal Ascot, ________ was intentionally seeded into the track turf to improve wear tolerance.","correct":"yarrow","options":["yarrow","clover","Cotula","plantain"],"feedback":"Some yarrow was intentionally seeded at Royal Ascot to improve the wear tolerance of the turf.","source":"M1.6: Turf Fields","kind":"module"},{"id":"m1q013","module":"M1","question":"The dog racing track described in the module (New Zealand) was seeded to:","correct":"perennial ryegrass and tall fescue","options":["perennial ryegrass and tall fescue","colonial bentgrass and annual bluegrass","Kentucky bluegrass and creeping bentgrass","bermudagrass and zoysiagrass"],"feedback":"The New Zealand dog racing track was seeded to perennial ryegrass and tall fescue.","source":"M1.6: Turf Fields","kind":"module"},{"id":"m1q014","module":"M1","question":"On New Zealand lawn bowling greens, ________ — a broadleaf species — is used in place of grass.","correct":"Cotula","options":["Cotula","yarrow","clover","moss"],"feedback":"In New Zealand, Cotula (a broadleaf species) is used on lawn bowling greens in place of grass.","source":"M1.6: Turf Fields","kind":"module"},{"id":"m1q015","module":"M1","question":"Turfgrass communities exist in intimate association with their climatic, biotic, and ________ environments.","correct":"edaphic","options":["edaphic","aquatic","urban","mechanical"],"feedback":"The turfgrass ecosystem involves climatic, edaphic (soil-related), and biotic environments.","source":"M1.7: Turfgrass Ecosystem","kind":"module"},{"id":"m1q016","module":"M1","question":"A measure of the number of aerial shoots per unit area is:","correct":"density","options":["density","texture","uniformity","color","smoothness"],"feedback":"Density is a measure of the number of aerial shoots per unit area.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q017","module":"M1","question":"A measure of the width of the leaf blades is:","correct":"texture","options":["density","texture","uniformity","color","smoothness"],"feedback":"Texture is a measure of the width of the leaf blades.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q018","module":"M1","question":"An estimate of the even appearance of a turf is:","correct":"uniformity","options":["density","texture","uniformity","color","smoothness"],"feedback":"Uniformity is an estimate of the even appearance of a turf.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q019","module":"M1","question":"A measure of the light reflected by a turfgrass is:","correct":"color","options":["density","texture","uniformity","color","smoothness"],"feedback":"Color is a measure of the light reflected by a turfgrass.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q020","module":"M1","question":"A surface feature of a turf that is degraded by mowing with a dull or poorly adjusted mower is:","correct":"smoothness","options":["density","texture","uniformity","color","smoothness"],"feedback":"Smoothness is a surface feature affecting visual and functional quality; a dull mower shreds leaves and reduces it.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q021","module":"M1","question":"Within the mowing tolerance range of a species, closer mowing produces a turf of higher density and [finer/coarser] texture.","correct":"finer","options":["finer","coarser"],"feedback":"Closer mowing (within tolerance) produces higher density and finer texture, but less root and rhizome growth.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q022","module":"M1","question":"At a particular mowing height, turf density increases with increasing:","correct":"nitrogen fertility","options":["nitrogen fertility","potassium fertility","irrigation frequency alone","soil compaction"],"feedback":"At a particular mowing height, density increases with increasing nitrogen fertility.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q023","module":"M1","question":"As mowing height increases (within a species' tolerance range), root and rhizome growth tend to:","correct":"increase","options":["increase","decrease","stay the same"],"feedback":"Root growth and rhizome growth tend to increase with increasing mowing height.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q024","module":"M1","question":"Tall fescue is relatively [coarse/fine] -textured, while red fescue is quite fine-textured.","correct":"coarse","options":["coarse","fine"],"feedback":"Tall fescue is a relatively coarse-textured species; red fescue is fine-textured, with bluegrasses, ryegrasses, and bentgrasses intermediate.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q025","module":"M1","question":"Coarse-textured (wide leaf bladed) turfgrasses tend to have relatively [low/high] density.","correct":"low","options":["low","high"],"feedback":"Texture and density are related: coarse-textured turfgrasses have relatively low densities, while fine-textured ones can have very high densities.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q026","module":"M1","question":"Turfgrasses spread primarily or exclusively by tillering are said to have a ________ growth habit.","correct":"bunch-type","options":["bunch-type","rhizomatous","stoloniferous","creepy"],"feedback":"Bunch-type turfgrasses spread primarily or exclusively by tillering (the development of side shoots).","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q027","module":"M1","question":"Turfgrasses that spread by belowground shoots called rhizomes (in addition to tillering) have a ________ growth habit.","correct":"rhizomatous","options":["bunch-type","rhizomatous","stoloniferous","creepy"],"feedback":"Rhizomatous turfgrasses can spread by belowground shoots called rhizomes.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q028","module":"M1","question":"Turfgrasses that spread by aboveground shoots called stolons have a ________ growth habit.","correct":"stoloniferous","options":["bunch-type","rhizomatous","stoloniferous","creepy"],"feedback":"Stoloniferous turfgrasses spread by aboveground shoots called stolons.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q029","module":"M1","question":"In the module's example images, a bunch-type growth habit is shown in:","correct":"perennial ryegrass","options":["perennial ryegrass","Kentucky bluegrass","creeping bentgrass","tall fescue"],"feedback":"The module shows a bunch-type growth habit in perennial ryegrass.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q030","module":"M1","question":"In the module's example images, Kentucky bluegrass demonstrates a ________ growth habit.","correct":"rhizomatous","options":["rhizomatous","bunch-type","stoloniferous"],"feedback":"The module shows a rhizomatous growth habit in Kentucky bluegrass.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q031","module":"M1","question":"In the module's example images, creeping bentgrass demonstrates a ________ growth habit.","correct":"stoloniferous","options":["stoloniferous","bunch-type","rhizomatous"],"feedback":"The module shows a stoloniferous growth habit in creeping bentgrass.","source":"M1.8: Turf Quality","kind":"module"},{"id":"m1q032","module":"M1","question":"The resistance of turfgrass leaves to compression is:","correct":"rigidity","options":["rigidity","elasticity","resiliency","verdure","yield"],"feedback":"Rigidity refers to the resistance of turfgrass leaves to compression.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q033","module":"M1","question":"The tendency of turfgrass leaves to spring back once a compressing force is removed is:","correct":"elasticity","options":["rigidity","elasticity","resiliency","verdure","yield"],"feedback":"Elasticity is the tendency of turfgrass leaves to spring back once a compressing force is removed.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q034","module":"M1","question":"The capacity of a turf to absorb shock without altering its surface characteristics is:","correct":"resiliency","options":["rigidity","elasticity","resiliency","verdure","yield"],"feedback":"Resiliency is the capacity of a turf to absorb shock without altering its surface characteristics.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q035","module":"M1","question":"A measure of the clippings removed with mowing is called:","correct":"yield","options":["rigidity","elasticity","resiliency","verdure","yield"],"feedback":"Yield is a measure of the clippings removed with mowing.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q036","module":"M1","question":"A measure of the amount of aerial shoots remaining after mowing is:","correct":"verdure","options":["rigidity","elasticity","resiliency","verdure","yield"],"feedback":"Verdure is a measure of the amount of aerial shoots remaining after mowing.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q037","module":"M1","question":"The amount of root growth evident at any one time during the growing season is called:","correct":"rooting","options":["rooting","verdure","yield","tillering"],"feedback":"Rooting is the amount of root growth evident at any one time during the growing season.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q038","module":"M1","question":"The capacity of turfgrasses to recover from damage caused by disease organisms, insects, and traffic is called:","correct":"recuperative capacity","options":["elasticity","uniformity","density","rooting","recuperative capacity"],"feedback":"Recuperative capacity is the capacity of turfgrasses to recover from damage caused by disease organisms, insects, and traffic.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q039","module":"M1","question":"The average distance a ball travels upon being released to a turf surface is called:","correct":"ball roll","options":["ball roll","verdure","rigidity","yield"],"feedback":"Ball roll is the average distance a ball travels upon being released to a turf surface; it is used as an estimate of putting green speed.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q040","module":"M1","question":"Which device is commonly used to measure ball roll (putting green speed) on golf greens?","correct":"Stimpmeter","options":["Stimpmeter","penetrometer","turf gauge","verdure meter"],"feedback":"A Stimpmeter is a mechanical device used to release a ball at a consistent speed to measure ball roll on golf greens.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q041","module":"M1","question":"Close, frequent mowing produces a turf with [fast/slow] putting speed.","correct":"fast","options":["fast","slow"],"feedback":"Close, frequent mowing produces a turf with fast putting speed; higher, less-frequent mowing produces relatively slow putting speed.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q042","module":"M1","question":"Within the same genotype and mowing height, verdure is directly proportional to:","correct":"density","options":["elasticity","uniformity","density","rooting","recuperative capacity"],"feedback":"With the same genotype and mowing height, verdure is directly proportional to density.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q043","module":"M1","question":"At higher mowing heights, the same genotype will often have [more/less] verdure.","correct":"more","options":["more","less"],"feedback":"At higher mowing heights, the same genotype will often have more verdure and generally better wear resistance.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q044","module":"M1","question":"Elasticity is dramatically reduced when turf is:","correct":"frozen","options":["frozen","wet","recently fertilized","freshly mowed"],"feedback":"Elasticity is dramatically reduced when turf is frozen — traffic should be withheld on frosted turf until the frost disappears.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q045","module":"M1","question":"Where rooting is shallow or largely confined to a thatch layer, problems can be anticipated especially during periods of:","correct":"stress","options":["stress","dormancy","overseeding","aeration"],"feedback":"Shallow rooting confined to a thatch layer makes turf especially vulnerable during periods of stress.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q046","module":"M1","question":"Excessively high yields (often from excessive nitrogen fertilization) may accompany reductions in rooting, stress tolerance, and:","correct":"disease resistance","options":["disease resistance","recuperative capacity","resiliency","elasticity"],"feedback":"Excessively high yields may indicate excessive nitrogen use, often accompanied by reduced rooting, stress tolerance, and disease resistance.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q047","module":"M1","question":"Recuperative capacity is reduced by severely compacted soils, inadequate or excessive fertility and moisture, unfavorable temperatures, insufficient light, toxic soil residues, and:","correct":"disease","options":["disease","high mowing height","deep rooting","cool weather"],"feedback":"Disease, along with compacted soils, poor fertility/moisture balance, unfavorable temperatures, insufficient light, and toxic soil residues, all reduce recuperative capacity.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q048","module":"M1","question":"Rigidity is influenced by the chemical composition of plant tissue, water content, shoot size, and:","correct":"density","options":["density","color","soil pH","day length"],"feedback":"Rigidity is influenced by the chemical composition of the plant tissue, water content, shoot size, and density.","source":"M1.9: Functional Components of Turf Quality","kind":"module"},{"id":"m1q049","module":"M1","question":"Overall turf quality level reflects the balance between growth/development factors (climate, soil, culture) and factors that cause:","correct":"decomposition and deterioration","options":["decomposition and deterioration","photosynthesis","transpiration","germination"],"feedback":"Turf quality level is determined by the relationship between growth/development factors and factors causing decomposition and deterioration.","source":"M1.10: Turfgrass Quality Level","kind":"module"},{"id":"m1q050","module":"M1","question":"Which of the following is listed as a factor contributing to decomposition and deterioration, rather than growth and development?","correct":"weeds","options":["weeds","soil","climate","culture"],"feedback":"Insects/pests, disease-causing organisms, weeds, and traffic are decomposition/deterioration factors, as opposed to climate, soil, and culture.","source":"M1.10: Turfgrass Quality Level","kind":"module"},{"id":"m1q051","module":"M1","question":"Before mechanical mowers were invented, turf was kept trimmed primarily by:","correct":"grazing animals","options":["grazing animals","hand shears only","controlled burning","no maintenance at all"],"feedback":"Grazing animals like sheep and rabbits served as the original mowers, trimming turf while simultaneously fertilizing it.","source":"M1.3: Mowing","kind":"module"},{"id":"m1q052","module":"M1","question":"The first mower was invented by ________, a textile engineer, who adapted it from a rotary shear used to trim carpet nap.","correct":"Edwin Budding","options":["Edwin Budding","Old Tom Morris","Walter Camp","John Kaminski"],"feedback":"Edwin Budding invented the first mower in 1827 and patented it in 1830.","source":"M1.3: Mowing","kind":"module"},{"id":"m1q053","module":"M1","question":"Edwin Budding's mower was invented in ________ and patented in 1830.","correct":"1827","options":["1827","1850","1870","1900"],"feedback":"Budding invented the first mower in 1827 and patented it in 1830.","source":"M1.3: Mowing","kind":"module"},{"id":"m1q054","module":"M1","question":"Because of its weight, Budding's mower required how many operators?","correct":"two","options":["one","two","three","four"],"feedback":"Because of the mower's weight, two operators were required: one to pull and the other to push and guide it.","source":"M1.3: Mowing","kind":"module"},{"id":"m1q055","module":"M1","question":"Turfgrasses evolved under the selection pressure of grazing animals, which favored plants whose growing points (apical meristems) were located:","correct":"near the surface of the ground","options":["near the surface of the ground","deep underground","at the tip of the leaf blade","within the seed head"],"feedback":"Close grazing by large herbivores ensured the survival of plants with growing points (apical meristems, or crowns) near the ground surface.","source":"M1.4: Turfgrasses","kind":"module"},{"id":"m1q056","module":"M1","question":"According to the textbook, the purposeful use of turf as part of the landscape likely dates back to the early gardens of:","correct":"Persia","options":["Persia","Rome","England","Egypt"],"feedback":"The purposeful use of turf probably dates back to early Persian gardens, developed many centuries before the birth of Christ.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q057","module":"M1","question":"The conquests of Alexander of Macedonia helped spread the use of Persian gardens throughout the:","correct":"Hellenistic world","options":["Hellenistic world","Roman Empire","British Isles","Ottoman Empire"],"feedback":"The conquests of Alexander of Macedonia (356–323 BC) spread the use of Persian gardens throughout the Hellenistic world.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q058","module":"M1","question":"During the medieval period, an area of lawn called the \"cloister garth\" was built at the heart of:","correct":"monasteries","options":["monasteries","castles","universities","marketplaces"],"feedback":"Monks created elaborate gardens within their monasteries, including the cloister garth — a lawn around which they walked and studied.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q059","module":"M1","question":"Some historians date the birth of the modern American lawn to the ________, when new suburbs, commuter railroads, and affordable mowers combined to make it possible.","correct":"1870s","options":["1870s","1820s","1900s","1950s"],"feedback":"The American lawn is thought to have been born in the 1870s, when suburbs, commuter rail, and affordable mowers combined to make it possible.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q060","module":"M1","question":"Frank J. Scott, an influential advocate for the American front lawn, called a smooth, closely shaven lawn surface the most essential element of ________ on the grounds of a suburban house.","correct":"beauty","options":["beauty","function","economy","shade"],"feedback":"Frank J. Scott wrote in 1870 that \"a smooth, closely shaven surface of grass is by far the most essential element of beauty on the grounds of a suburban house.\"","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q061","module":"M1","question":"The ancient sport of chogān — the forerunner of modern polo — was first played on extensive meadows in:","correct":"Persia","options":["Persia","England","India","Mongolia"],"feedback":"Chogān, today called polo, was first played on extensive meadows in Persia.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q062","module":"M1","question":"Lacrosse evolved centuries ago from ball-and-stick games played on open meadows by:","correct":"Native Americans","options":["Native Americans","Roman soldiers","Persian nobles","British colonists"],"feedback":"Lacrosse evolved from ball-and-stick games played by Native Americans, called baggataway by the Algonquin and tewaarathon by the Iroquois.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q063","module":"M1","question":"The first intercollegiate American football game was played in 1869 between Princeton and:","correct":"Rutgers","options":["Rutgers","Yale","Harvard","Penn State"],"feedback":"The first intercollegiate game was played between Rutgers and Princeton in 1869.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q064","module":"M1","question":"Walter Camp, considered the \"father\" of American football, proposed the rules establishing the modern game in:","correct":"1880","options":["1880","1869","1900","1920"],"feedback":"Yale coach Walter Camp proposed the rules establishing the game as played today in 1880.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q065","module":"M1","question":"Cricket's principal playing surface, maintained by close and frequent mowing and rolling, is called the:","correct":"pitch","options":["pitch","green","court","crease"],"feedback":"Cricket's principal playing surface is called the pitch, maintained by close, frequent mowing and rolling.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q066","module":"M1","question":"Alexander Cartwright, known as the \"father of baseball,\" devised the first rules for the modern game and invented the modern:","correct":"baseball field","options":["baseball field","baseball bat","baseball glove","pitcher's mound"],"feedback":"Alexander Cartwright devised the first rules for the modern game and invented the modern baseball field.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q067","module":"M1","question":"The modern game of croquet is credited to ________, who developed it in England in 1867.","correct":"Walter Whitmore","options":["Walter Whitmore","Walter Wingfield","Henry Gem","Old Tom Morris"],"feedback":"Walter Whitmore developed the modern game of croquet in England in 1867 and is considered its inventor.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q068","module":"M1","question":"Major Walter Wingfield, often credited as the true inventor of modern lawn tennis, patented the game in 1874 under the Greek name:","correct":"Sphairistike","options":["Sphairistike","Tewaarathon","Chogān","Baggataway"],"feedback":"Walter Wingfield published his rules and patented the game as Sphairistike in 1874.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q069","module":"M1","question":"The first Wimbledon championships were held in:","correct":"1877","options":["1877","1858","1888","1901"],"feedback":"The first Wimbledon championships were held in 1877.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q070","module":"M1","question":"The oldest bowling green still in operation, located in Southampton, England, has been used since:","correct":"AD 1299","options":["AD 1299","AD 1588","AD 1856","AD 1920"],"feedback":"The oldest bowling green, in Southampton, England, has been in operation since AD 1299.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q071","module":"M1","question":"According to legend, ________ was playing a game of bowls when notified of the approaching Spanish Armada in 1588.","correct":"Sir Francis Drake","options":["Sir Francis Drake","Old Tom Morris","King James III","Walter Camp"],"feedback":"Legend holds that Sir Francis Drake was in a game of bowls when notified of the Spanish Armada's approach in 1588.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q072","module":"M1","question":"King James III banned \"ye golf\" in 1471 chiefly because it interfered with the practice of:","correct":"archery","options":["archery","farming","church attendance","horse racing"],"feedback":"King James III banned golf in 1471 because it interfered with the practice of archery by men called to serve as foot soldiers.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q073","module":"M1","question":"The Scottish links are protected from off-shore winds by sand dunes stabilized by natural populations of:","correct":"marram grass","options":["marram grass","red fescue","colonial bentgrass","Kentucky bluegrass"],"feedback":"The dunes protecting the Scottish links are stabilized by natural populations of marram grass (Ammophila arenaria).","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q074","module":"M1","question":"The native grasses that formed the early, acceptable-quality turf on Scottish links were browntop (colonial) bentgrass and:","correct":"red fescue","options":["red fescue","tall fescue","perennial ryegrass","Kentucky bluegrass"],"feedback":"Native browntop (colonial) bentgrass and red fescue formed natural turfs of acceptable playing quality on the Scottish links.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"},{"id":"m1q075","module":"M1","question":"________, keeper of the green at St. Andrews from 1865–1904, is remembered for urging \"Mair saund\" (more sand) to topdress the links turf.","correct":"Old Tom Morris","options":["Old Tom Morris","Edwin Budding","Walter Camp","Frank J. Scott"],"feedback":"Old Tom Morris, legendary keeper of the green at St. Andrews, urged his assistant to add more sand topdressing to maintain the turf.","source":"Textbook Ch. 1: History of Turf","kind":"enrichment"}];const KEY='turf235_exam1_m1_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M1 cleared</h2><p>You retired all 75 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M1 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
