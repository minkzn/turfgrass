const BANK=[{"id":"m4q001","module":"M4","question":"The emergence of an inflorescence indicates a grass plant has changed from the vegetative to the ________ stage of growth.","correct":"reproductive","options":["reproductive","dormant","juvenile","senescent"],"feedback":"Inflorescence emergence signals the transition from vegetative to reproductive growth.","source":"M4.2: Inflorescence","kind":"module"},{"id":"m4q002","module":"M4","question":"The inflorescence occurs at the terminal end of a rapidly elongating stem called the:","correct":"flowering culm","options":["flowering culm","rhizome","stolon","crown"],"feedback":"The inflorescence sits atop the flowering culm, which develops from the growing point of the flowering shoot.","source":"M4.2: Inflorescence","kind":"module"},{"id":"m4q003","module":"M4","question":"Inflorescence development occurs in spring for cool-season turfgrasses and in ________ for warm-season species.","correct":"summer","options":["summer","fall","winter","early spring only"],"feedback":"Cool-season turfgrasses develop inflorescences in spring; warm-season species do so during summer.","source":"M4.2: Inflorescence","kind":"module"},{"id":"m4q004","module":"M4","question":"Because flowering shoots are unable to produce new leaf primordia, each eventually dies and is replaced by new tillers emerging from:","correct":"vegetative shoots","options":["vegetative shoots","seed germination","rhizome cataphylls","the same flowering shoot"],"feedback":"Flowering shoots cannot form new leaf primordia and are eventually replaced by tillers from vegetative shoots.","source":"M4.2: Inflorescence","kind":"module"},{"id":"m4q005","module":"M4","question":"In seed production, flowering culms are swathed and allowed to dry in windrows; optimum swathing moisture ranges from a high of 43 percent for tall fescue down to a low of 25 percent for:","correct":"creeping red fescue","options":["creeping red fescue","Kentucky bluegrass","perennial ryegrass","bermudagrass"],"feedback":"Optimum seed moisture for swathing ranges from 43% (tall fescue) to 25% (creeping red fescue).","source":"M4.2: Inflorescence","kind":"module"},{"id":"m4q006","module":"M4","question":"In grass seed production, seed is combined (harvested) once field moisture dries to:","correct":"12 percent","options":["12 percent","25 percent","43 percent","60 percent"],"feedback":"Seed is combined when moisture dries to 12 percent in the field.","source":"M4.2: Inflorescence","kind":"module"},{"id":"m4q007","module":"M4","question":"The basic unit of organization within a grass inflorescence is the:","correct":"spikelet","options":["spikelet","floret","panicle","glume"],"feedback":"The spikelet is the basic organizational unit of the inflorescence, composed of florets, glumes, and rachilla.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q008","module":"M4","question":"A spikelet is composed of one or more florets, two basal glumes, and stem segments called:","correct":"rachilla","options":["rachilla","lemma","palea","pedicel"],"feedback":"The spikelet's stem segments, connecting its parts, are called the rachilla.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q009","module":"M4","question":"Bentgrass spikelets have a single floret, while ryegrass spikelets have:","correct":"many florets","options":["many florets","no florets","exactly two florets","only glumes"],"feedback":"Bentgrass spikelets contain a single floret; ryegrass spikelets contain many.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q010","module":"M4","question":"The two floral bracts enclosing the male and female components of a grass flower are called the lemma and:","correct":"palea","options":["palea","glume","rachilla","pericarp"],"feedback":"The lemma and palea are the two floral bracts enclosing each grass flower.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q011","module":"M4","question":"The male portion of the grass flower, composed of three filaments and their pollen-containing anthers, is called the:","correct":"stamen","options":["stamen","pistil","stigma","ovary"],"feedback":"The stamen is the male portion of the grass flower, made up of filaments and anthers.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q012","module":"M4","question":"The female portion of the grass flower, made up of feathery stigmas, styles, and an ovary, is called the:","correct":"pistil","options":["pistil","stamen","anther","glume"],"feedback":"The pistil is the female portion of the grass flower.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q013","module":"M4","question":"In a raceme, spikelets are borne on short stalks called pedicels; in a spike, spikelets are attached:","correct":"directly to the main culm","options":["directly to the main culm","on spreading branches","on compressed branches only","nowhere on the culm"],"feedback":"A spike has its spikelets attached directly to the main culm, unlike the pedicels of a raceme.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q014","module":"M4","question":"In a panicle, spikelets are spaced along:","correct":"spreading or compressed branches","options":["spreading or compressed branches","pedicels off the main culm only","the main culm directly","the flag leaf"],"feedback":"A panicle has its spikelets spaced along spreading or compressed branches.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q015","module":"M4","question":"Which inflorescence type is produced by zoysiagrasses, St. Augustinegrass, bahiagrass, and centipedegrass?","correct":"raceme","options":["raceme","panicle","spike","corymb"],"feedback":"Zoysiagrasses, St. Augustinegrass, bahiagrass, and centipedegrass all produce racemes.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q016","module":"M4","question":"Which inflorescence type is produced by bluegrasses, bentgrasses, and fescues?","correct":"panicle","options":["panicle","raceme","spike","corymb"],"feedback":"Bluegrasses, bentgrasses, and fescues produce panicles.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q017","module":"M4","question":"Which inflorescence type is produced by ryegrasses, wheatgrasses, and bermudagrasses?","correct":"spike","options":["spike","raceme","panicle","corymb"],"feedback":"Ryegrasses, wheatgrasses, and bermudagrasses produce spikes.","source":"M4.3: Inflorescence Structure","kind":"module"},{"id":"m4q018","module":"M4","question":"The four phases of inflorescence development, in order, are maturation, induction, initiation, and:","correct":"development","options":["development","germination","vernalization","pollination"],"feedback":"The four phases are: maturation, induction, initiation, and development.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q019","module":"M4","question":"Until maturation, a juvenile plant is insensitive to environmental conditions that later promote:","correct":"flowering","options":["flowering","germination","mowing damage","drought stress"],"feedback":"A juvenile plant is insensitive to flowering-promoting environmental conditions until it reaches maturation.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q020","module":"M4","question":"Low-temperature induction, which occurs in the growing point, is also called:","correct":"vernalization","options":["vernalization","initiation","photoperiodism","devernalization"],"feedback":"Low-temperature induction occurring in the growing point is called vernalization.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q021","module":"M4","question":"Photoperiodic induction, involving translocation of a flowering stimulus to the stem apex, occurs in the:","correct":"leaves","options":["leaves","growing point","roots","endosperm"],"feedback":"Photoperiodic induction takes place in the leaves, unlike vernalization, which occurs in the growing point.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q022","module":"M4","question":"Cool-season grasses are typically ________-day plants, flowering only after exposure to daylengths greater than a critical number of hours.","correct":"long","options":["long","short","day-neutral","dark"],"feedback":"Cool-season grasses are typically long-day plants.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q023","module":"M4","question":"Warm-season grasses are predominantly ________-day plants, with flower induction occurring under daylengths shorter than a critical number of hours.","correct":"short","options":["short","long","day-neutral","cold"],"feedback":"Warm-season grasses are predominantly short-day plants.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q024","module":"M4","question":"A day-neutral plant flowers:","correct":"at any naturally occurring daylength, if other requirements are met","options":["at any naturally occurring daylength, if other requirements are met","only above a critical daylength","only below a critical daylength","only after vernalization"],"feedback":"Day-neutral plants flower at any naturally occurring daylength as long as other requirements are satisfied.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q025","module":"M4","question":"The most effective vernalization temperature range for cool-season grasses is:","correct":"32°F to 50°F","options":["32°F to 50°F","0°F to 32°F","50°F to 70°F","70°F to 90°F"],"feedback":"Vernalization is most effective between 32°F and 50°F.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q026","module":"M4","question":"In perennial ryegrass and colonial bentgrass, short days can substitute for vernalization; in creeping bentgrass:","correct":"only short days are required for induction","options":["only short days are required for induction","vernalization is always mandatory","neither short days nor vernalization matter","only long days induce flowering"],"feedback":"Creeping bentgrass requires only short days for induction — vernalization isn't needed at all.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q027","module":"M4","question":"Warm-season (panicoid/eragrostoid) grasses have:","correct":"no vernalization requirement","options":["no vernalization requirement","the same vernalization requirement as pooid grasses","a higher vernalization temperature requirement","a vernalization requirement only in shade"],"feedback":"Unlike cool-season (festucoid) grasses, warm-season grasses have no vernalization requirement.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q028","module":"M4","question":"The transformation of the stem apex from a vegetative to a flowering axis is called:","correct":"initiation","options":["induction","development","maturation","initiation"],"feedback":"Initiation is the third phase, transforming the stem apex from vegetative to flowering.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q029","module":"M4","question":"During initiation, the development of lateral buds in the axils of leaf primordia results in the formation of:","correct":"double ridges","options":["double ridges","cataphylls","the coleoptile","the mesocotyl"],"feedback":"Lateral bud development in leaf primordia axils forms double ridges along the elongating stem apex.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q030","module":"M4","question":"The formation and elevation of the inflorescence — including branches, spikelets, and florets — is called:","correct":"development","options":["induction","development","maturation","initiation"],"feedback":"Development is the fourth phase, encompassing formation of branches, spikelets, florets, and elevation of the inflorescence.","source":"M4.4: Phases of Inflorescence Development","kind":"module"},{"id":"m4q031","module":"M4","question":"The process by which a pollen grain is carried to the stigma and germinates, forming a pollen tube, is called:","correct":"pollination","options":["pollination","fertilization","germination","vernalization"],"feedback":"Pollination is the transfer and germination of pollen on the stigma, forming a pollen tube.","source":"M4.5: Pollination","kind":"module"},{"id":"m4q032","module":"M4","question":"Upon entering the embryo sac, two sperm nuclei are released: one unites with the egg to form a zygote, and the other unites with two polar nuclei to form the:","correct":"endosperm cell","options":["endosperm cell","aleurone layer","scutellum","pericarp"],"feedback":"One sperm nucleus fertilizes the egg (forming the zygote); the other unites with two polar nuclei to form the endosperm cell.","source":"M4.5: Pollination","kind":"module"},{"id":"m4q033","module":"M4","question":"The endosperm is formed following the union of:","correct":"1 sperm and 2 polar nuclei","options":["1 sperm and 1 polar nucleus","1 sperm and 2 polar nuclei","2 sperm and 1 polar nucleus","2 sperm and 2 polar nuclei"],"feedback":"One sperm nucleus unites with two polar nuclei to form the endosperm cell.","source":"M4.5: Pollination","kind":"module"},{"id":"m4q034","module":"M4","question":"The sexual unions involving sperm nuclei with both the egg and the polar nuclei are together called:","correct":"double fertilization","options":["double fertilization","double pollination","apomixis","cleistogamy"],"feedback":"These two sperm-nuclei unions (egg and polar nuclei) are together called double fertilization.","source":"M4.5: Pollination","kind":"module"},{"id":"m4q035","module":"M4","question":"Asexual seed production without fusion of male and female gametes, common in many Kentucky bluegrasses and yielding offspring identical to the female parent, is called:","correct":"apomixis","options":["apomixis","pollination","vernalization","double fertilization"],"feedback":"Apomixis is asexual seed production without gamete fusion; apomictic Kentucky bluegrasses breed true-to-type from seed.","source":"M4.5: Pollination","kind":"module"},{"id":"m4q036","module":"M4","question":"For successful germination, the new seedbed should be lightly raked and then lightly rolled in order to:","correct":"establish good seed-to-soil contact and retain moisture","options":["establish good seed-to-soil contact and retain moisture","bury the seed as deeply as possible","increase soil temperature rapidly","remove weed seeds from the site"],"feedback":"Rolling firms the seedbed to establish good seed-to-soil contact and retain moisture near the seed.","source":"M4.6: Germination","kind":"module"},{"id":"m4q037","module":"M4","question":"Favorable seed-to-soil contact reduces the likelihood of ________ of young seedling structures during germination.","correct":"desiccation","options":["desiccation","photosynthesis","vernalization","apomixis"],"feedback":"Good seed-to-soil contact stabilizes the seed and reduces desiccation risk during germination.","source":"M4.6: Germination","kind":"module"},{"id":"m4q038","module":"M4","question":"Grass \"seed\" harvested from the inflorescence is actually the mature:","correct":"floret","options":["floret","spikelet","flower","glume"],"feedback":"Grass \"seed\" is actually a mature floret, composed of a caryopsis enclosed by the lemma and palea.","source":"M4.7: Grass Seed","kind":"module"},{"id":"m4q039","module":"M4","question":"At the base of the palea, extending as a short stemlike structure, is the:","correct":"rachilla","options":["rachilla","pericarp","aleurone layer","caryopsis"],"feedback":"The rachilla extends from the base of the palea.","source":"M4.7: Grass Seed","kind":"module"},{"id":"m4q040","module":"M4","question":"The caryopsis, or \"dried fruit,\" contains the true seed surrounded by a remnant of the ovary wall called the:","correct":"pericarp","options":["pericarp","aleurone layer","seed coat","rachilla"],"feedback":"The pericarp is the remnant of the ovary wall surrounding the true seed within the caryopsis.","source":"M4.7: Grass Seed","kind":"module"},{"id":"m4q041","module":"M4","question":"Just inside the seed coat, a thin proteinaceous layer that plays an important role in germination is the:","correct":"aleurone layer","options":["aleurone layer","pericarp","scutellum","coleorhiza"],"feedback":"The aleurone layer is a thin, proteinaceous material just inside the seed coat, important to germination.","source":"M4.7: Grass Seed","kind":"module"},{"id":"m4q042","module":"M4","question":"Among fescues/ryegrasses, bluegrasses, and bentgrasses, caryopsis size ranks from largest to smallest as:","correct":"fescues/ryegrasses, bluegrasses, bentgrasses","options":["fescues/ryegrasses, bluegrasses, bentgrasses","bentgrasses, bluegrasses, fescues/ryegrasses","bluegrasses, fescues/ryegrasses, bentgrasses","all approximately equal"],"feedback":"Fescues and ryegrasses have the largest caryopses, bluegrasses are intermediate, and bentgrasses are smallest.","source":"M4.7: Grass Seed","kind":"module"},{"id":"m4q043","module":"M4","question":"The embryo and endosperm inside the seed serve as the plant's food supply until it is capable of producing its own food through:","correct":"photosynthesis","options":["photosynthesis","respiration only","transpiration","apomixis"],"feedback":"The embryo and endosperm sustain the plant until it becomes capable of photosynthesis.","source":"M4.7: Grass Seed","kind":"module"},{"id":"m4q044","module":"M4","question":"The germination process begins when the seed imbibes (absorbs):","correct":"water","options":["water","oxygen","nitrogen","carbon dioxide"],"feedback":"Germination begins with imbibition — the seed's absorption of water.","source":"M4.8: Nourishment of the Embryo","kind":"module"},{"id":"m4q045","module":"M4","question":"After water is imbibed, hydrolytic enzymes break down starch in the endosperm into simpler carbohydrates to nourish the:","correct":"embryo","options":["embryo","pericarp","aleurone layer","seed coat"],"feedback":"Hydrolytic enzymes break down endosperm starch into simple carbohydrates for the embryo.","source":"M4.8: Nourishment of the Embryo","kind":"module"},{"id":"m4q046","module":"M4","question":"Hydrolytic enzymes for endosperm breakdown are produced in the aleurone layer in response to gibberellins produced in the:","correct":"scutellum","options":["scutellum","pericarp","coleoptile","coleorhiza"],"feedback":"Gibberellins produced in the scutellum trigger hydrolytic enzyme production in the aleurone layer.","source":"M4.8: Nourishment of the Embryo","kind":"module"},{"id":"m4q047","module":"M4","question":"Carbohydrates released from endosperm breakdown are absorbed by the scutellum and:","correct":"transmitted to other parts of the embryo","options":["transmitted to other parts of the embryo","stored permanently in the aleurone layer","excreted into the rhizosphere","converted directly to lignin"],"feedback":"The scutellum absorbs endosperm carbohydrates and transmits them to other parts of the embryo.","source":"M4.8: Nourishment of the Embryo","kind":"module"},{"id":"m4q048","module":"M4","question":"Germination is the process by which a quiescent embryonic plant contained within a caryopsis is stimulated to develop into a:","correct":"seedling","options":["seedling","spikelet","floret","tiller"],"feedback":"Germination stimulates the quiescent embryo within the caryopsis to develop into a seedling.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q049","module":"M4","question":"The first morphological development evident during germination is enlargement of the:","correct":"coleorhiza","options":["endosperm","scutellum","coleorhiza","embryo"],"feedback":"The coleorhiza enlarges first, and root-hair-like structures emerge from it to anchor the embryo.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q050","module":"M4","question":"Root-hair-like anchoring structures emerge from the coleorhiza, followed by emergence of the primary root and the:","correct":"coleoptile","options":["coleoptile","scutellum","aleurone layer","pericarp"],"feedback":"After the primary root, the coleoptile emerges, enclosing the first true leaf.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q051","module":"M4","question":"In some species, growth of the coleoptile is associated with elongation of the mesocotyl — an internode located between the coleoptile and the:","correct":"scutellar node","options":["scutellar node","root cap","endosperm","aleurone layer"],"feedback":"The mesocotyl is an internode located between the scutellar node and the coleoptile.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q052","module":"M4","question":"During germination, a seedling still dependent on the endosperm for food is described as:","correct":"heterotrophic","options":["heterotrophic","autotrophic","geotrophic","phototrophic"],"feedback":"A seedling relying on the endosperm's food reserves is heterotrophic.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q053","module":"M4","question":"Once a seedling produces its own food photosynthetically and is entirely independent of the endosperm, it is described as:","correct":"autotrophic","options":["autotrophic","heterotrophic","geotrophic","phototrophic"],"feedback":"A seedling that has become independent of the endosperm through photosynthesis is autotrophic.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q054","module":"M4","question":"With further seedling development and depletion of the endosperm's food reserves, the outer \"skin\" of the caryopsis (pericarp fused with the seed coat):","correct":"collapses","options":["collapses","thickens","turns green","splits into two seeds"],"feedback":"As the endosperm's reserves are depleted, the caryopsis's outer pericarp/seed-coat layer collapses.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q055","module":"M4","question":"Successful seed germination depends on endosperm reserves, planting depth, light availability, moisture, and:","correct":"a suitable temperature range","options":["a suitable temperature range","high nitrogen fertility","low soil pH only","thatch thickness"],"feedback":"Germination success depends on endosperm reserves, planting depth, light, moisture, and a suitable temperature range.","source":"M4.9: Seed Germination","kind":"module"},{"id":"m4q056","module":"M4","question":"The flowering portion of the grass shoot, devoid of leaves except for the floral bracts within spikelets, is called the:","correct":"inflorescence","options":["inflorescence","culm","crown","cataphyll"],"feedback":"The inflorescence is the flowering portion of the shoot, bearing only modified-leaf floral bracts.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q057","module":"M4","question":"In a raceme or spike, the main flowering axis is called the rachis; in a panicle, the term rachis instead refers to the:","correct":"lateral branches","options":["lateral branches","main axis only","glumes","pedicels only"],"feedback":"In a panicle, \"rachis\" refers to the lateral branches rather than a single main axis.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q058","module":"M4","question":"Panicoid grasses have two-flowered spikelets: a perfect upper floret (with both stamens and pistil) and a lower floret that is:","correct":"staminate (stamens only) or sterile","options":["staminate (stamens only) or sterile","pistillate only","identical to the upper floret","entirely absent"],"feedback":"Panicoid spikelets have a perfect upper floret and a staminate/sterile lower floret.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q059","module":"M4","question":"In panicoid grasses, spikelet disarticulation (separation at maturity) occurs below the glumes; in pooid and chloridoid grasses, it typically occurs:","correct":"above the glumes, often between florets","options":["above the glumes, often between florets","below the glumes as well","at the coleoptile","within the rachilla only"],"feedback":"Disarticulation happens below the glumes in panicoid grasses, but above the glumes (often between florets) in pooid and chloridoid grasses.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q060","module":"M4","question":"The lowermost organs of the grass flower, which become turgid at floral maturity and force the lemma and palea apart to expose the stigmas and anthers, are the:","correct":"lodicules","options":["lodicules","glumes","rachilla","pedicels"],"feedback":"Lodicules become turgid at anthesis, forcing the lemma and palea open to expose the stigmas and anthers.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q061","module":"M4","question":"Pollination occurring within a closed floret, ensuring self-pollination and common in some annual species, is called:","correct":"cleistogamy","options":["cleistogamy","apomixis","vernalization","anthesis"],"feedback":"Cleistogamy is pollination within a closed floret, ensuring self-pollination.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q062","module":"M4","question":"Despite predominant self-pollination in some grass species, outcrossing of up to about 5% can occur in:","correct":"annual bluegrass","options":["annual bluegrass","tall fescue","bermudagrass","zoysiagrass"],"feedback":"Even in largely self-pollinating species, up to about 5% outcrossing can occur in annual bluegrass, aiding genetic exchange.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q063","module":"M4","question":"Once the stem apex transforms to the flowering state, mowing off the inflorescence does not remove future leaf-producing structures but instead may stimulate the development of:","correct":"subsidiary tillers","options":["subsidiary tillers","new rhizomes only","additional inflorescences","the mesocotyl"],"feedback":"Because flowering shoots stop producing leaf primordia anyway, mowing off seedheads can instead stimulate subsidiary tiller development.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q064","module":"M4","question":"Under regular mowing, seed maturation in most turf is interrupted before viable seed forms; a notable exception that produces viable seed very quickly is:","correct":"annual bluegrass","options":["annual bluegrass","Kentucky bluegrass","tall fescue","perennial ryegrass"],"feedback":"Annual bluegrass is a notable exception, maturing viable seed quickly enough to build a large seed reservoir despite mowing.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q065","module":"M4","question":"Extensive inflorescence development in turf is generally undesirable in part because of the temporary reduction in ________ following the death of flowering shoots.","correct":"shoot density","options":["shoot density","root growth","soil pH","seed viability"],"feedback":"Because flowering shoots eventually die, extensive inflorescence development temporarily reduces shoot density.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"},{"id":"m4q066","module":"M4","question":"Vernalization is a reversible process; reversal under high-temperature conditions is called:","correct":"devernalization","options":["devernalization","dehiscence","disarticulation","decortication"],"feedback":"Devernalization can reverse the vernalization effect under high-temperature conditions.","source":"Textbook Ch. 2, pp. 19-22, 31-34: Growth and Development","kind":"enrichment"}];const KEY='turf235_exam1_m4_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M4 cleared</h2><p>You retired all 66 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M4 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
