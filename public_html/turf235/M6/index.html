const BANK=[{"id":"m6q001","module":"M6","question":"In a bag of turfgrass \"seed,\" the actual seeds are usually not visible; what you actually see are:","correct":"florets","options":["florets","glumes","rachillae","lodicules"],"feedback":"A bag of turfgrass \"seed\" actually contains florets, not bare seeds.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q002","module":"M6","question":"A turfgrass seed label provides variety name, germination percentage, percent crop seed, percent inert material, percent weed seed, seed lot ID, and:","correct":"origin","options":["origin","planting depth","recommended mowing height","fertilizer schedule"],"feedback":"The seed label lists origin (where the seed was harvested) among its required components.","source":"M6.1: Overview","kind":"module"},{"id":"m6q003","module":"M6","question":"When a floret matures, the palea and lemma no longer enclose the flower; instead they enclose the fruit of the grass plant, called the:","correct":"caryopsis","options":["caryopsis","rachilla","glume","lodicule"],"feedback":"The mature floret's palea and lemma enclose the caryopsis, the grass fruit developed from the ovary.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q004","module":"M6","question":"The caryopsis is dry at maturity, and its fruit wall (pericarp) is fused to the:","correct":"seed coat","options":["seed coat","aleurone layer","scutellum","rachilla"],"feedback":"The caryopsis's pericarp is fused to the seed coat, meaning the true seed can never be seen separately from the fruit wall.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q005","module":"M6","question":"The organs at the base of the floret that swell at anthesis, pushing the palea and lemma apart to expose the anthers and stigmas, are the:","correct":"lodicules","options":["lodicules","glumes","rachillae","awns"],"feedback":"Lodicules swell during anthesis, forcing the palea and lemma apart to expose the reproductive parts for pollination.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q006","module":"M6","question":"A bentgrass spikelet is composed of a single floret enclosed by:","correct":"two glumes","options":["two glumes","one glume","no glumes","four glumes"],"feedback":"Bentgrass spikelets contain just one floret, enclosed by two glumes.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q007","module":"M6","question":"A ryegrass spikelet has only one glume and as many as:","correct":"twenty florets","options":["twenty florets","two florets","five florets","fifty florets"],"feedback":"A ryegrass spikelet has a single glume but can carry up to twenty florets.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q008","module":"M6","question":"Each floret in a spikelet is attached to the rachilla of the floret below it by its:","correct":"callus (base)","options":["callus (base)","apex","awn","lodicule"],"feedback":"Florets attach to the spikelet's rachilla at their base, or callus.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q009","module":"M6","question":"In the front view of a floret, the bract facing toward the viewer is the:","correct":"palea","options":["palea","lemma","glume","rachilla"],"feedback":"In the front view, the palea faces the viewer; in the back view, the lemma faces the viewer.","source":"M6.3: Directions, windrows and combining of turfgrass seeds","kind":"module"},{"id":"m6q010","module":"M6","question":"The rachilla, the stem-like segment protruding from the callus on the palea side, is notably absent in which genus?","correct":"bentgrass","options":["bentgrass","bluegrass","fescue","ryegrass"],"feedback":"Among the four genera studied, the bentgrass floret lacks a rachilla.","source":"M6.3: Directions, windrows and combining of turfgrass seeds","kind":"module"},{"id":"m6q011","module":"M6","question":"On a lemma, the vein running down the middle from apex to base is the mid-nerve; the veins along the edges are called:","correct":"lateral nerves","options":["lateral nerves","intermediate nerves","awns","rachillae"],"feedback":"Lateral nerves run along the lemma's edges, while the mid-nerve runs down the center.","source":"M6.3: Directions, windrows and combining of turfgrass seeds","kind":"module"},{"id":"m6q012","module":"M6","question":"When the intermediate nerves of a lemma (between mid-nerve and lateral nerve) are not visible, the lemma is described as:","correct":"3-nerved","options":["3-nerved","5-nerved","7-nerved","nerveless"],"feedback":"A lemma is called 3-nerved when its intermediate nerves aren't visible, and 5-nerved when they are.","source":"M6.3: Directions, windrows and combining of turfgrass seeds","kind":"module"},{"id":"m6q013","module":"M6","question":"The awn — a narrow extension of the lemma's mid-nerve — is notably absent in:","correct":"bluegrass","options":["bluegrass","fescue","ryegrass","bentgrass"],"feedback":"Among the species compared, the awn is absent in bluegrass.","source":"M6.3: Directions, windrows and combining of turfgrass seeds","kind":"module"},{"id":"m6q014","module":"M6","question":"When turfgrass \"seed\" is harvested, cut stalks are laid in rows to mature and dry before harvesting; these are called:","correct":"windrows","options":["windrows","furrows","drills","swales"],"feedback":"Cut stalks are laid in windrows to mature and reach a dryness suitable for harvesting without damaging the florets.","source":"M6.3: Directions, windrows and combining of turfgrass seeds","kind":"module"},{"id":"m6q015","module":"M6","question":"If harvested \"seed\" is too dry, the rough harvesting operation could fracture the caryopsis and injure the embryo, thereby destroying:","correct":"seed viability","options":["seed viability","seed color","seed weight only","the rachilla"],"feedback":"Overly dry seed risks caryopsis fracture and embryo damage during harvest, destroying viability.","source":"M6.3: Directions, windrows and combining of turfgrass seeds","kind":"module"},{"id":"m6q016","module":"M6","question":"In the seed cleaning process, the device that rubs seed against seed to remove hairs and break spikelets into separate florets is the:","correct":"debearder","options":["debearder","air screen","gravity table","carter"],"feedback":"The debearder is the first cleaning device, rubbing seed to remove hairs and break spikelets into florets.","source":"M6.4: Seed Cleaning Process","kind":"module"},{"id":"m6q017","module":"M6","question":"After the debearder, the sample passes to the air screen, where air suction pulls out lighter debris while the sample falls through:","correct":"screens of various sizes","options":["screens of various sizes","a single fine mesh","a magnetic separator","a vibrating funnel"],"feedback":"The air screen cleans and separates the sample by passing it through screens of various sizes while suction removes lighter debris.","source":"M6.4: Seed Cleaning Process","kind":"module"},{"id":"m6q018","module":"M6","question":"The cleaning device consisting of 50-gallon barrels rotating on their sides, used for a second size separation, is called the:","correct":"indents","options":["indents","carters","gravity table","debearder"],"feedback":"The indents are rotating 50-gallon barrels used to separate the sample further by size.","source":"M6.4: Seed Cleaning Process","kind":"module"},{"id":"m6q019","module":"M6","question":"A third size separation, using revolving discs, occurs in the:","correct":"carters","options":["carters","indents","air screen","debearder"],"feedback":"The carters use revolving discs to perform a third size separation.","source":"M6.4: Seed Cleaning Process","kind":"module"},{"id":"m6q020","module":"M6","question":"The final cleaning device, a vibrating, tilted table with air forced upward through its cloth surface, sorts the sample by:","correct":"weight","options":["weight","color","moisture content","germination rate"],"feedback":"The gravity table sorts the cleaned sample according to weight.","source":"M6.4: Seed Cleaning Process","kind":"module"},{"id":"m6q021","module":"M6","question":"Before cleaning, Kentucky bluegrass florets show a mass of basal pubescence; after cleaning, this pubescence is:","correct":"mostly or entirely removed","options":["mostly or entirely removed","unaffected","doubled in density","relocated to the apex"],"feedback":"Cleaning rubs away most or all of Kentucky bluegrass's basal pubescence, an important caveat for identification.","source":"M6.4: Seed Cleaning Process","kind":"module"},{"id":"m6q022","module":"M6","question":"Among ryegrasses/fescues, bluegrasses, and bentgrasses, which genus group has the largest florets, averaging about 6mm?","correct":"ryegrasses and fescues","options":["ryegrasses and fescues","bluegrasses","bentgrasses","all are equal size"],"feedback":"Lolium (ryegrasses) and Festuca (fescues) have the largest florets, averaging about 6mm.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q023","module":"M6","question":"To identify ryegrasses and fescues, an adequate sample size is about:","correct":"10 florets","options":["10 florets","25 florets","50 florets","100 florets"],"feedback":"About 10 florets are adequate for identifying ryegrasses and fescues, which are large enough to see with the naked eye.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q024","module":"M6","question":"Between the two ryegrass species, red fescue, and tall fescue, which is smallest at about 5mm?","correct":"red fescue","options":["red fescue","tall fescue","annual ryegrass","perennial ryegrass"],"feedback":"Red fescue is the smallest of this group at about 5mm; the ryegrasses are largest at just above 6mm.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q025","module":"M6","question":"The best way to first distinguish a ryegrass floret from a fescue floret is to look at the:","correct":"rachilla","options":["rachilla","color","weight","germination rate"],"feedback":"Rachilla shape is the best first distinguishing feature: ryegrass has a wide, flattened rachilla; fescue has a narrow, cylindrical one.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q026","module":"M6","question":"A ryegrass floret has a wide rachilla flattened against the palea, with an oblong top outline; a fescue floret has a rachilla that is:","correct":"narrow and cylindrical, with a circular, flared top","options":["narrow and cylindrical, with a circular, flared top","identical to the ryegrass rachilla","completely absent","triangular and rigid"],"feedback":"Fescue's rachilla is narrow and cylindrical, with a circular, somewhat flared upper end — unlike ryegrass's wide, flattened rachilla.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q027","module":"M6","question":"In floret shape, ryegrass tends to be wide at apex and base, giving it a rectangular outline; fescue tends toward a shape that is:","correct":"elliptical","options":["elliptical","triangular","square","heart-shaped"],"feedback":"Fescue narrows at both base and apex, giving it an elliptical outline, unlike ryegrass's rectangular shape.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q028","module":"M6","question":"Ryegrass inflorescences are spikes; fescue inflorescences are:","correct":"panicles","options":["panicles","racemes","corymbs","umbels"],"feedback":"Ryegrasses have spike inflorescences, while fescues have panicles.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q029","module":"M6","question":"Spikelets of annual (Italian) ryegrass may have from 6 to 20 florets; those of perennial ryegrass typically have:","correct":"6 to 10 florets","options":["6 to 10 florets","1 to 2 florets","20 to 30 florets","50 or more florets"],"feedback":"Perennial ryegrass spikelets have fewer florets (6-10) than the wider range (6-20) of annual ryegrass.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q030","module":"M6","question":"Annual (Italian) ryegrass, Lolium multiflorum, is distinguished from perennial ryegrass mainly by:","correct":"very often having a long, slender awn","options":["very often having a long, slender awn","having no rachilla at all","being much larger overall","having a spike inflorescence instead of a panicle"],"feedback":"Annual ryegrass usually has a long, slender awn; perennial ryegrass does not have an awn.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q031","module":"M6","question":"Tall fescue is distinguished from red fescue by being generally:","correct":"wide and flattened front to back","options":["wide and flattened front to back","narrow and cylindrical","bright green in color","completely awnless"],"feedback":"Tall fescue is wide and flattened bract to bract, unlike red fescue's narrow, cylindrical shape.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q032","module":"M6","question":"Red fescue is generally narrow and cylindrical, with the lemma curling far around the palea; in side view, the floret often appears to:","correct":"arch away from the palea side","options":["arch away from the palea side","lie perfectly flat","fold in half","split down the middle"],"feedback":"Red fescue's floret often arches away from the palea side when viewed from the side.","source":"M6.5: Ryegrass and Fescue","kind":"module"},{"id":"m6q033","module":"M6","question":"Bluegrass (Poa) florets are intermediate in size, averaging about:","correct":"2.5mm","options":["2.5mm","1.5mm","6mm","10mm"],"feedback":"Bluegrass florets average 2.5mm, intermediate between the smaller bentgrasses and larger ryegrasses/fescues.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q034","module":"M6","question":"To identify a bluegrass sample, about how many florets should be examined?","correct":"25","options":["25","10","50","5"],"feedback":"A sample of about 25 florets is used to identify bluegrass species.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q035","module":"M6","question":"Identifying bluegrass florets requires magnification of about:","correct":"10X","options":["10X","2X","30X","100X"],"feedback":"Bluegrass identification requires about 10X magnification through a dissecting scope.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q036","module":"M6","question":"Among the four Poa species studied, which has the fewest florets per spikelet (2 to 3)?","correct":"Poa trivialis (rough bluegrass)","options":["Poa trivialis (rough bluegrass)","Poa pratensis (Kentucky bluegrass)","Poa annua (annual bluegrass)","Poa compressa (Canada bluegrass)"],"feedback":"Poa trivialis (rough bluegrass) has only 2 to 3 florets per spikelet, versus 3 to 6 or so in the others.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q037","module":"M6","question":"Canada bluegrass (Poa compressa) is distinguished by a smooth lemma (no visible intermediate nerves) and a characteristic:","correct":"widening/flaring of the lemma above the middle toward the apex","options":["widening/flaring of the lemma above the middle toward the apex","dense basal pubescence","long, slender awn","translucent, plump caryopsis"],"feedback":"Canada bluegrass has a smooth lemma with a distinctive flaring above the middle, toward the apex, visible in back view.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q038","module":"M6","question":"Rough bluegrass (Poa trivialis) is readily identified by often retaining a remnant of basal pubescence plus prominent:","correct":"intermediate nerves","options":["intermediate nerves","awns","glumes only","rachillae"],"feedback":"Rough bluegrass shows prominent intermediate nerves and often a surviving remnant of basal pubescence after cleaning.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q039","module":"M6","question":"Compared to Kentucky bluegrass, rough bluegrass's lemma edges are:","correct":"straight to the apex and often severely folded over the palea","options":["straight to the apex and often severely folded over the palea","curved and weakly wrapped around the palea","entirely absent","fused permanently to the caryopsis"],"feedback":"Rough bluegrass has straight lemma edges folded severely over the palea, unlike Kentucky bluegrass's curved, weaker wrap.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q040","module":"M6","question":"Kentucky bluegrass (Poa pratensis) has basal pubescence before processing, but this is removed by cleaning; remaining hairs, if any, are found along the:","correct":"lateral and/or mid-nerves","options":["lateral and/or mid-nerves","awn tip only","rachilla","palea edge only"],"feedback":"After cleaning, any surviving hairs on Kentucky bluegrass are found along the lateral and/or mid-nerves, not at the base.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q041","module":"M6","question":"Annual bluegrass (Poa annua) florets often show very prominent intermediate, lateral, and mid-nerves, with the palea and lemma appearing tightly sucked in around the caryopsis, making the floret look:","correct":"plump","options":["plump","flattened","elongated","translucent only"],"feedback":"Annual bluegrass florets often appear plump, with nerves and pubescence prominent along them.","source":"M6.6: Bluegrass Seed","kind":"module"},{"id":"m6q042","module":"M6","question":"Bentgrass (Agrostis) florets are the smallest of the genera studied, averaging about:","correct":"1.5mm","options":["1.5mm","2.5mm","6mm","4mm"],"feedback":"Bentgrass florets average just 1.5mm — the smallest of the genera studied.","source":"M6.7: Bentgrass Seed","kind":"module"},{"id":"m6q043","module":"M6","question":"Because bentgrass florets are so small, a sample of about how many is needed for identification?","correct":"50","options":["50","10","25","5"],"feedback":"Because bentgrass identification features may not appear on every floret, a sample of about 50 is needed.","source":"M6.7: Bentgrass Seed","kind":"module"},{"id":"m6q044","module":"M6","question":"Identifying bentgrass florets requires magnification of about:","correct":"30X","options":["30X","10X","5X","100X"],"feedback":"Bentgrass identification requires about 30X magnification, higher than the 10X needed for bluegrass.","source":"M6.7: Bentgrass Seed","kind":"module"},{"id":"m6q045","module":"M6","question":"Among the four Agrostis species discussed, which is smallest?","correct":"velvet bentgrass (Agrostis canina)","options":["velvet bentgrass (Agrostis canina)","colonial bentgrass (Agrostis capillaris)","creeping bentgrass (Agrostis stolonifera)","redtop (Agrostis alba)"],"feedback":"Velvet bentgrass is the smallest of the four Agrostis species; creeping bentgrass is the largest.","source":"M6.7: Bentgrass Seed","kind":"module"},{"id":"m6q046","module":"M6","question":"Among the four Agrostis species discussed, which is largest?","correct":"creeping bentgrass (Agrostis stolonifera)","options":["creeping bentgrass (Agrostis stolonifera)","velvet bentgrass (Agrostis canina)","colonial bentgrass (Agrostis capillaris)","redtop (Agrostis alba)"],"feedback":"Creeping bentgrass is the largest of the four Agrostis species discussed; redtop is intermediate, and velvet is smallest.","source":"M6.7: Bentgrass Seed","kind":"module"},{"id":"m6q047","module":"M6","question":"The bentgrass inflorescence type is the:","correct":"panicle","options":["panicle","spike","raceme","corymb"],"feedback":"Bentgrass produces a panicle inflorescence, variably open or compressed.","source":"M6.7: Bentgrass Seed","kind":"module"},{"id":"m6q048","module":"M6","question":"Velvet bentgrass (Agrostis canina) is distinguished by an awn that is bent, arising from the mid-rib about halfway from base to apex, along with a lemma that appears:","correct":"grainy or stippled, not shiny","options":["grainy or stippled, not shiny","glossy and smooth","translucent and colorless","heavily pubescent throughout"],"feedback":"Velvet bentgrass has a non-shiny, grainy/stippled lemma and a bent awn from the mid-rib's midpoint; its palea is rudimentary or absent.","source":"M6.8: Typical Bentgrass Sample","kind":"module"},{"id":"m6q049","module":"M6","question":"In velvet bentgrass, how many nerves are visible below the awn's point of attachment, versus above it?","correct":"5 below, 4 above","options":["5 below, 4 above","3 below, 5 above","4 below, 4 above","2 below, 2 above"],"feedback":"Velvet bentgrass shows 5 nerves below the awn's attachment point and 4 above it.","source":"M6.8: Typical Bentgrass Sample","kind":"module"},{"id":"m6q050","module":"M6","question":"Colonial bentgrass (Agrostis capillaris) is distinguished by shiny paleas and lemmas, 3 or 5 visible nerves, and characteristic:","correct":"stiff hairs arising from the lemma surface","options":["stiff hairs arising from the lemma surface","a grainy, dull lemma","a completely awnless floret in all cases","a wide, flattened rachilla"],"feedback":"Colonial bentgrass is identified by shiny bracts and stiff hairs arising from the lemma surface; an awn may originate near the callus.","source":"M6.8: Typical Bentgrass Sample","kind":"module"},{"id":"m6q051","module":"M6","question":"In creeping bentgrass (Agrostis stolonifera), an awn is present but rarely survives cleaning, leaving only a stub on the mid-nerve toward the apex; the lemma is most often:","correct":"5-nerved","options":["5-nerved","3-nerved","nerveless","7-nerved"],"feedback":"Creeping bentgrass's lemma is most often 5-nerved (though it can be 3-nerved), with shiny bracts and a palea as long or longer than the caryopsis.","source":"M6.8: Typical Bentgrass Sample","kind":"module"},{"id":"m6q052","module":"M6","question":"Redtop (Agrostis alba) closely resembles creeping bentgrass but is distinguished mainly by:","correct":"being more often 3-nerved, with longer basal hairs","options":["being more often 3-nerved, with longer basal hairs","having a completely different inflorescence type","lacking a palea entirely","being far larger than creeping bentgrass"],"feedback":"Redtop is more often 3-nerved than creeping bentgrass and has longer basal hairs, though the two are otherwise very similar.","source":"M6.8: Typical Bentgrass Sample","kind":"module"},{"id":"m6q053","module":"M6","question":"A bentgrass sample's spikelets (as opposed to loose florets) can be recognized by their opaque bracts, slightly larger size, and sometimes retained:","correct":"pedicels","options":["pedicels","rachillae","awns only","lodicules"],"feedback":"Bentgrass spikelets may retain their pedicels, the short stem segments attaching them to inflorescence branches.","source":"M6.8: Typical Bentgrass Sample","kind":"module"},{"id":"m6q054","module":"M6","question":"In a bentgrass sample, translucent paleas and lemmas on the florets give a glimpse of the:","correct":"caryopsis inside","options":["caryopsis inside","rachilla","lodicules","awn base"],"feedback":"Bentgrass florets have translucent bracts, allowing a view of the caryopsis inside.","source":"M6.8: Typical Bentgrass Sample","kind":"module"},{"id":"m6q055","module":"M6","question":"The grass flower usually has three stamens and one ovary with two feathery:","correct":"stigmas","options":["stigmas","lodicules","glumes","rachillae"],"feedback":"The grass flower typically has three stamens and one ovary topped with two feathery stigmas.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q056","module":"M6","question":"A caryopsis cross-section reveals the pericarp, seed coat, aleurone layer, embryo, endosperm, and:","correct":"scutellum","options":["scutellum","rachilla","lodicule","glume"],"feedback":"The caryopsis cross-section shows the pericarp, seed coat, aleurone layer, embryo, scutellum, and endosperm.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q057","module":"M6","question":"Grass inflorescence structure varies by species; the three general types described are raceme, panicle, and:","correct":"spike","options":["spike","corymb","umbel","cyme"],"feedback":"Grass inflorescences take one of three general forms: raceme, panicle, or spike.","source":"M6.2: Turfgrass Seed","kind":"module"},{"id":"m6q058","module":"M6","question":"Which tool is described as essential, alongside a dissecting scope, for maneuvering tiny florets into position during identification?","correct":"probes and tweezers","options":["probes and tweezers","a soil probe","a Stimpmeter","a pH meter"],"feedback":"Probes and tweezers are useful for maneuvering tiny florets into position beneath the dissecting scope.","source":"M6.1: Overview","kind":"module"}];const KEY='turf235_exam1_m6_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){state=s;return true}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M6 cleared</h2><p>You retired all 58 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}submit.onclick=submitBatch;next.onclick=nextBatch;restart.onclick=()=>{if(confirm('Restart M6 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
