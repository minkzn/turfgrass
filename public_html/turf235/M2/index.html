const BANK=[{"id":"m2q001","module":"M2","question":"The lower portion of a grass leaf, tightly rolled or folded around the shoot's main axis, is called the:","correct":"sheath","options":["sheath","blade","ligule","collar"],"feedback":"The lower portion of the leaf is called the sheath; the upper, flatter portion is the blade (lamina).","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q002","module":"M2","question":"The flattened, upper portion of a grass leaf is called the:","correct":"blade","options":["blade","ligule","auricle","sheath"],"feedback":"The flattened, upper portion of the leaf is called the blade.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q003","module":"M2","question":"At the junction of the blade and sheath, the structure on the inner (adaxial) side of the leaf is the:","correct":"ligule","options":["ligule","collar","auricle","sheath"],"feedback":"The ligule sits at the junction of blade and sheath on the inner (adaxial) side.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q004","module":"M2","question":"At the junction of the blade and sheath, the structure on the outer (abaxial) side of the leaf is the:","correct":"collar","options":["collar","ligule","auricle","blade"],"feedback":"The collar is on the outer (abaxial) side of the blade-sheath junction, opposite the ligule.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q005","module":"M2","question":"In some grasses, the base of the leaf blade extends into two claw-like appendages called:","correct":"auricles","options":["auricles","collars","ligules","sheathes"],"feedback":"Auricles are appendages that the base of the leaf blade extends into, in some grasses.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q006","module":"M2","question":"The compressed, base structure of a grass shoot from which leaves, roots, and stems arise is the:","correct":"crown","options":["crown","culm","node","mesocotyl"],"feedback":"The crown is at the base of the plant, a highly compressed stem in the vegetative stage.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q007","module":"M2","question":"During flowering, elongation of the stem internodes produces a stem called a ________, which terminates in an inflorescence.","correct":"culm","options":["culm","rhizome","stolon","crown"],"feedback":"A flowering shoot's elongated stem is called a culm, and it terminates in an inflorescence.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q008","module":"M2","question":"The two root types of a grass plant are seminal and:","correct":"adventitious","options":["adventitious","determinate","indeterminate","rhizomatous"],"feedback":"Grass roots are of two types: seminal (from seed germination) and adventitious (arising from stem nodes).","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q009","module":"M2","question":"Roots arising from stem nodes in a mature turfgrass community are called:","correct":"adventitious","options":["determinate","indeterminate","seminal","adventitious"],"feedback":"Adventitious (secondary/nodal) roots arise from stem nodes and make up most of the root system in a mature turf.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q010","module":"M2","question":"Roots that develop during seed germination are called:","correct":"seminal","options":["determinate","indeterminate","seminal","adventitious"],"feedback":"Seminal (primary) roots develop during seed germination and survive only a relatively short period.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q011","module":"M2","question":"In a new turfgrass plant grown from seed, a rhizome-like structure that may be present is called the:","correct":"mesocotyl","options":["mesocotyl","coleoptile","radicle","plumule"],"feedback":"The mesocotyl is a rhizome-like structure sometimes present in a new seedling.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q012","module":"M2","question":"Below-ground, lateral shoots growing away from the mother plant that give rise to new shoots at their nodes are:","correct":"rhizomes","options":["stolons","rhizomes","culms","crowns"],"feedback":"Rhizomes grow below the surface of the ground and give rise to new shoots at their terminals and nodes.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q013","module":"M2","question":"Above-ground, lateral shoots that produce new shoots and adventitious roots along the ground surface are:","correct":"stolons","options":["stolons","rhizomes","culms","crowns"],"feedback":"Stolons resemble rhizomes but grow along the surface of the ground rather than below it.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q014","module":"M2","question":"The three organs of the turfgrass plant are leaves, stems, and:","correct":"roots","options":["roots","shoots","crowns","flowers"],"feedback":"The three organs of the turfgrass plant are leaves, stems, and roots.","source":"M2.2: Grass Plant","kind":"module"},{"id":"m2q015","module":"M2","question":"The upper (adaxial) surface of a turfgrass leaf blade may be flat across the blade or contain a prominent:","correct":"midrib","options":["midrib","auricle","collar","keel"],"feedback":"The adaxial surface may be flat or contain a prominent midrib, depending on species.","source":"M2.3: Leaf Surfaces","kind":"module"},{"id":"m2q016","module":"M2","question":"If the adaxial leaf surface has a midrib, the abaxial surface often appears as the keel of a boat — this feature is described as:","correct":"keeled","options":["keeled","ridged","bulliform","truncate"],"feedback":"If the adaxial surface has a midrib, the abaxial surface may be keeled, resembling the keel of a boat.","source":"M2.3: Leaf Surfaces","kind":"module"},{"id":"m2q017","module":"M2","question":"Meyer zoysiagrass has an adaxial leaf surface that is smooth, relatively flat, and bears long, slender:","correct":"hairs","options":["hairs","ridges","keels","spines"],"feedback":"Meyer zoysiagrass is smooth and relatively flat with long, slender hairs on its adaxial leaf surface.","source":"M2.3: Leaf Surfaces","kind":"module"},{"id":"m2q018","module":"M2","question":"The adaxial leaf surface of Kentucky bluegrass is [ridged/smooth].","correct":"smooth","options":["ridged","smooth"],"feedback":"Kentucky bluegrass has a smooth and ridgeless adaxial leaf surface.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q019","module":"M2","question":"The abaxial leaf surface of Kentucky bluegrass is [dull/glossy].","correct":"dull","options":["dull","glossy"],"feedback":"Kentucky bluegrass has a dull abaxial leaf surface (though it is prominently keeled).","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q020","module":"M2","question":"The abaxial leaf surface of rough bluegrass is [dull/glossy].","correct":"glossy","options":["dull","glossy"],"feedback":"Rough bluegrass has a glossy abaxial leaf surface, distinguishing it from Kentucky bluegrass.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q021","module":"M2","question":"The adaxial leaf surface of tall fescue is [ridged/smooth].","correct":"ridged","options":["ridged","smooth"],"feedback":"Tall fescue's adaxial surface has ridges variable in shape and size, prominently ridged overall.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q022","module":"M2","question":"The abaxial leaf of tall fescue is [strongly keeled/essentially flat].","correct":"essentially flat","options":["strongly keeled","essentially flat"],"feedback":"Unlike many other species, tall fescue's abaxial surface is essentially flat rather than strongly keeled.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q023","module":"M2","question":"The adaxial leaf surface of perennial ryegrass is [ridged/smooth].","correct":"ridged","options":["ridged","smooth"],"feedback":"Perennial ryegrass has a distinctly ridged adaxial surface, with somewhat rounded, unequal ridges.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q024","module":"M2","question":"The abaxial leaf surface of perennial ryegrass is [dull/glossy].","correct":"glossy","options":["dull","glossy"],"feedback":"Perennial ryegrass has a glossy, keeled abaxial surface.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q025","module":"M2","question":"The abaxial leaf of perennial ryegrass is [keeled/flat].","correct":"keeled","options":["keeled","flat"],"feedback":"Perennial ryegrass's abaxial surface is keeled.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q026","module":"M2","question":"The adaxial leaf surface of creeping bentgrass is [ridged/smooth].","correct":"ridged","options":["ridged","smooth"],"feedback":"Creeping bentgrass has an acutely ridged adaxial surface.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q027","module":"M2","question":"The adaxial leaf surface of red fescue is [ridged/smooth].","correct":"ridged","options":["ridged","smooth"],"feedback":"Red fescue's adaxial surface has five to seven ridges.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q028","module":"M2","question":"The abaxial leaf surface of bermudagrass is generally:","correct":"smooth and nearly flat","options":["smooth and nearly flat","prominently keeled","acutely ridged","deeply furrowed"],"feedback":"Bermudagrass's adaxial and abaxial surfaces are generally smooth and nearly flat.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q029","module":"M2","question":"Cells that occur on the epidermis and, along with veins, occupy much of a leaf's internal volume are the:","correct":"mesophyll cells","options":["mesophyll cells","bulliform cells","guard cells","fiber cells"],"feedback":"Mesophyll cells, along with veins, occupy much of the internal volume of the leaf, enclosed within the epidermis.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q030","module":"M2","question":"Openings in the leaf epidermis through which gaseous exchange takes place are called:","correct":"stomates","options":["bundles","stroma","stomates","avenues"],"feedback":"Stomates are openings permeating the epidermis, allowing gaseous exchange with the atmosphere.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q031","module":"M2","question":"Specialized cells that absorb water and change shape to open and close the stomates are the:","correct":"guard cells","options":["guard cells","bulliform cells","fiber cells","mesophyll cells"],"feedback":"Guard cells absorb water and change shape to provide the epidermal stomatal openings.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q032","module":"M2","question":"Large cells that, when fully expanded with water, help open leaf blades are called ________ cells.","correct":"bulliform","options":["bulliform","mesophyll","sheath","bundle"],"feedback":"Bulliform cells are enlarged, thin-walled epidermal cells involved in leaf blade unrolling/unfolding.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q033","module":"M2","question":"Leaf hairs that vary in size and density among turfgrass species are called:","correct":"trichomes","options":["tricoblasts","trichomes","epiblasts","pubes"],"feedback":"Trichomes are leaf hairs whose size and density vary among turfgrass species.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q034","module":"M2","question":"The surface layer of cells in a turfgrass leaf form the:","correct":"epidermis","options":["mesophyll","endodermis","epidermis","sheath"],"feedback":"A single layer of epidermal cells forms both the adaxial and abaxial leaf surfaces.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q035","module":"M2","question":"A double layer of cells forms the bundle sheath around veins in ________ turfgrasses (C3, cool-season).","correct":"pooid","options":["pooid","chloridoid","panicoid","agrostoid"],"feedback":"Pooid (C3, cool-season) turfgrasses like Kentucky bluegrass have a double-layered bundle sheath.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q036","module":"M2","question":"In C4 (warm-season) turfgrasses like bermudagrass, the bundle sheath is formed by a single layer of cells bordered by elongated mesophyll cells radiating from the vascular bundles — this arrangement is called:","correct":"Kranz anatomy","options":["Kranz anatomy","bulliform anatomy","pooid anatomy","stomatal anatomy"],"feedback":"This radiating arrangement of elongated mesophyll cells around a single-layer bundle sheath is called Kranz anatomy, characteristic of C4 turfgrasses.","source":"M2.4: Leaf Blade Cross Section","kind":"module"},{"id":"m2q037","module":"M2","question":"The leaf tip shape shared by all bluegrass species (Kentucky, annual, rough, Canada) is:","correct":"boat-shaped","options":["boat-shaped","truncate","pointed","tapered and rounded"],"feedback":"All bluegrass species have boat-shaped leaf tips, formed where the two sides of the blade come together.","source":"M2.5: Leaf Tips","kind":"module"},{"id":"m2q038","module":"M2","question":"The leaf tip of annual bluegrass is:","correct":"boat-shaped","options":["pointed","rounded","boat-shaped","truncate"],"feedback":"Annual bluegrass, like other bluegrasses, has a boat-shaped leaf tip — and it is especially evident (parallel-sided) in this species.","source":"M2.5: Leaf Tips","kind":"module"},{"id":"m2q039","module":"M2","question":"Compared with Kentucky and annual bluegrass, the boat shape of rough and Canada bluegrass leaf tips is less evident because their leaves are more:","correct":"tapered","options":["tapered","parallel-sided","ridged","pubescent"],"feedback":"Rough and Canada bluegrass leaves are tapered rather than parallel-sided, making their boat shape less obvious.","source":"M2.5: Leaf Tips","kind":"module"},{"id":"m2q040","module":"M2","question":"Redtop has a leaf tip that is:","correct":"sharply pointed","options":["sharply pointed","boat-shaped","tapered and rounded","truncate"],"feedback":"Redtop has a sharply pointed leaf tip.","source":"M2.5: Leaf Tips","kind":"module"},{"id":"m2q041","module":"M2","question":"The leaf tip of centipedegrass is:","correct":"pointed","options":["pointed","rounded","boat-shaped","truncate"],"feedback":"Centipedegrass has a pointed leaf tip.","source":"M2.5: Leaf Tips","kind":"module"},{"id":"m2q042","module":"M2","question":"The leaf tip of St. Augustinegrass is:","correct":"tapered and rounded","options":["pointed and narrow","tapered and rounded","boat-shaped","truncate"],"feedback":"St. Augustinegrass has a rounded and tapered leaf tip, in addition to being coarser-textured than centipedegrass.","source":"M2.5: Leaf Tips","kind":"module"},{"id":"m2q043","module":"M2","question":"The vernation on Kentucky bluegrass is [folded/rolled].","correct":"folded","options":["folded","rolled"],"feedback":"Kentucky bluegrass has folded vernation.","source":"M2.6: Vernation","kind":"module"},{"id":"m2q044","module":"M2","question":"The vernation on creeping bentgrass is [folded/rolled].","correct":"rolled","options":["folded","rolled"],"feedback":"Creeping bentgrass has rolled vernation.","source":"M2.6: Vernation","kind":"module"},{"id":"m2q045","module":"M2","question":"Rolled vernation appears, when viewed from above, as a:","correct":"swirl","options":["swirl","neat V shape","flat ribbon","double point"],"feedback":"Rolled vernation appears as a swirling out of the new leaf; folded vernation appears neatly tucked in a V shape.","source":"M2.6: Vernation","kind":"module"},{"id":"m2q046","module":"M2","question":"The best way to observe vernation on a turfgrass plant is to look:","correct":"straight down on the tip of the emerging leaves","options":["straight down on the tip of the emerging leaves","across the mowed surface at dusk","at a stained cross-section under a microscope","along the length of a mature blade"],"feedback":"Vernation is best observed by looking directly down on the tip of the emerging leaves.","source":"M2.6: Vernation","kind":"module"},{"id":"m2q047","module":"M2","question":"The ligule sits at the junction of the leaf blade and sheath on the ________ side of the leaf.","correct":"adaxial","options":["adaxial","abaxial","lateral","distal"],"feedback":"The ligule is located at the blade-sheath junction on the adaxial (inner) side.","source":"M2.7: Ligule","kind":"module"},{"id":"m2q048","module":"M2","question":"Ligules may be absent, a fringe of hairs, or a:","correct":"membranous structure","options":["membranous structure","waxy cuticle","spiny appendage","double keel"],"feedback":"Ligules take one of three general forms: absent, a fringe of hairs, or a membranous structure.","source":"M2.7: Ligule","kind":"module"},{"id":"m2q049","module":"M2","question":"As a general rule, warm-season (C4) turfgrasses typically have ________ ligules.","correct":"hairy","options":["hairy","membranous","absent","waxy"],"feedback":"Warm-season (C4) grasses typically have hairy (fringe-of-hairs) ligules; St. Augustinegrass is an occasional exception.","source":"M2.7: Ligule","kind":"module"},{"id":"m2q050","module":"M2","question":"Tall fescue has a ligule that is:","correct":"minute, membranous, truncate","options":["minute, membranous, truncate","long, membranous, pointed","fringe of hairs","short, hairy, truncate"],"feedback":"Tall fescue has a minute, membranous, truncate ligule — so small it may not be visible if the leaf isn't pulled away.","source":"M2.7: Ligule","kind":"module"},{"id":"m2q051","module":"M2","question":"The ligule on rough bluegrass is:","correct":"long, membranous, pointed","options":["long, membranous, pointed","short, hairy, truncate","short, membranous, pointed","short, membranous, truncate"],"feedback":"Rough bluegrass has a long, membranous, pointed ligule.","source":"M2.7: Ligule","kind":"module"},{"id":"m2q052","module":"M2","question":"The ligule associated with hybrid bermudagrass is:","correct":"a fringe of short hairs","options":["a fringe of short hairs","minute and membranous","absent entirely","long and pointed"],"feedback":"Hybrid bermudagrass has a fringe-of-hairs ligule, with especially evident long hairs at the ends.","source":"M2.7: Ligule","kind":"module"},{"id":"m2q053","module":"M2","question":"Auricles are extensions of the bases of the leaf blades that may be long and slender, short and blunt, or:","correct":"absent","options":["absent","spiraled","hairy only","fused to the collar"],"feedback":"Auricles may be long and slender, short and blunt, or absent altogether, depending on species.","source":"M2.8: Auricles","kind":"module"},{"id":"m2q054","module":"M2","question":"Annual ryegrass has auricles that are:","correct":"very long, pointed, clawlike","options":["very long, pointed, clawlike","short and blunt","entirely absent","pubescent only"],"feedback":"Annual ryegrass has very long, pointed, clawlike auricles.","source":"M2.8: Auricles","kind":"module"},{"id":"m2q055","module":"M2","question":"Auricles on annual ryegrass are:","correct":"long, pointed","options":["short, blunt","long, pointed","absent","pubescent"],"feedback":"Annual ryegrass's auricles are long and pointed (clawlike).","source":"M2.8: Auricles","kind":"module"},{"id":"m2q056","module":"M2","question":"Kentucky bluegrass has auricles that are:","correct":"absent","options":["absent","long and slender","short and blunt","pubescent"],"feedback":"Kentucky bluegrass has no auricles, along with a short, truncate ligule.","source":"M2.8: Auricles","kind":"module"},{"id":"m2q057","module":"M2","question":"Perennial ryegrass has auricles that are:","correct":"very short, clawlike","options":["very short, clawlike","very long, pointed","absent","short, blunt, pubescent"],"feedback":"Perennial ryegrass has very short, clawlike auricles.","source":"M2.8: Auricles","kind":"module"},{"id":"m2q058","module":"M2","question":"Tall fescue's auricles are:","correct":"short, blunt, and pubescent","options":["short, blunt, and pubescent","very long, pointed","absent","large and clawlike"],"feedback":"Tall fescue's auricles are short, blunt, and pubescent.","source":"M2.8: Auricles","kind":"module"},{"id":"m2q059","module":"M2","question":"The collar is a light-colored band on the ________ side of the leaf at the blade-sheath junction.","correct":"abaxial","options":["abaxial","adaxial","lateral","distal"],"feedback":"The collar occurs on the abaxial (outer) side of the leaf at the blade-sheath junction.","source":"M2.9: Collar","kind":"module"},{"id":"m2q060","module":"M2","question":"A collar band can be narrow or broad, and continuous or:","correct":"divided","options":["divided","keeled","pubescent","fringed"],"feedback":"Collar bands vary from narrow to broad, and from continuous to divided.","source":"M2.9: Collar","kind":"module"},{"id":"m2q061","module":"M2","question":"Bermudagrass has a collar that is:","correct":"narrow and continuous","options":["narrow and continuous","broad and continuous","broad and divided","narrow and divided"],"feedback":"Bermudagrass has a narrow, continuous collar.","source":"M2.9: Collar","kind":"module"},{"id":"m2q062","module":"M2","question":"St. Augustinegrass has a collar that is broad, continuous, and additionally:","correct":"severely constricted","options":["severely constricted","fringed with hairs","divided at the midrib","absent"],"feedback":"St. Augustinegrass has a broad, continuous collar that is also severely constricted.","source":"M2.9: Collar","kind":"module"},{"id":"m2q063","module":"M2","question":"Redtop has a collar that is:","correct":"broad and divided","options":["broad and divided","narrow and continuous","broad and continuous","narrow and divided"],"feedback":"Redtop has a broad, divided collar.","source":"M2.9: Collar","kind":"module"},{"id":"m2q064","module":"M2","question":"Perennial ryegrass has a collar that is:","correct":"broad and divided","options":["broad and divided","narrow and continuous","broad and continuous","narrow and divided"],"feedback":"Perennial ryegrass, like redtop, has a broad, divided collar.","source":"M2.9: Collar","kind":"module"},{"id":"m2q065","module":"M2","question":"According to the textbook, membranous ligules are typical of pooid grasses, while a fringe-of-hairs ligule is typical of ________ grasses.","correct":"chloridoid","options":["chloridoid","panicoid","agrostoid","festucoid"],"feedback":"Membranous ligules are typical of pooid (C3) grasses; fringe-of-hairs ligules are typical of chloridoid (C4) grasses.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q066","module":"M2","question":"Among membranous ligules, Kentucky bluegrass's is short and truncate, while annual bluegrass's is:","correct":"long and pointed","options":["long and pointed","short and hairy","absent","broad and divided"],"feedback":"Membranous ligules vary in size and shape — short/truncate in Kentucky bluegrass, long/pointed in annual bluegrass.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q067","module":"M2","question":"According to the textbook, auricles are entirely absent in the bluegrasses, short and blunt in tall fescue, and long and pointed in:","correct":"annual ryegrass","options":["annual ryegrass","bermudagrass","St. Augustinegrass","redtop"],"feedback":"Auricles may be absent (bluegrasses), short and blunt (tall fescue), or long and pointed (annual ryegrass).","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q068","module":"M2","question":"According to the textbook, collars can be narrow and continuous (bermudagrass), narrow and divided (Canada bluegrass), broad and continuous (centipedegrass), or broad and divided in:","correct":"perennial ryegrass","options":["perennial ryegrass","tall fescue","annual bluegrass","redtop"],"feedback":"The textbook lists four collar patterns, with broad-and-divided illustrated by perennial ryegrass.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q069","module":"M2","question":"According to the textbook's general pattern, vernation is folded in the bluegrasses and rolled in the:","correct":"bentgrasses","options":["bentgrasses","fescues","ryegrasses","zoysiagrasses"],"feedback":"As a general textbook pattern, vernation is folded in bluegrasses and rolled in bentgrasses.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q070","module":"M2","question":"According to the textbook's general pattern, the upper (adaxial) leaf surface tends to be smooth in the bluegrasses and ridged in the:","correct":"bentgrasses","options":["bentgrasses","fescues","zoysiagrasses","bermudagrasses"],"feedback":"As a general textbook pattern, adaxial surfaces tend to be smooth in bluegrasses and ridged in bentgrasses.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q071","module":"M2","question":"According to the textbook's general pattern, the lower (abaxial) leaf surface tends to be dull in tall fescue and glossy in:","correct":"perennial ryegrass","options":["perennial ryegrass","Kentucky bluegrass","bermudagrass","centipedegrass"],"feedback":"As a general textbook pattern, abaxial surfaces tend to be dull in tall fescue and glossy in perennial ryegrass.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q072","module":"M2","question":"According to the textbook, leaf blades tend to be parallel-sided in Kentucky and annual bluegrasses, but tapering in Canada and:","correct":"rough bluegrass","options":["rough bluegrass","tall fescue","perennial ryegrass","redtop"],"feedback":"Leaf blade shape can be parallel-sided (Kentucky and annual bluegrasses) or tapering (Canada and rough bluegrasses).","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q073","module":"M2","question":"According to the textbook's general pattern, leaf tips vary from pointed in the bentgrasses, to rounded in St. Augustinegrass, to boat-shaped in the:","correct":"bluegrasses","options":["bluegrasses","fescues","ryegrasses","zoysiagrasses"],"feedback":"As a general textbook pattern, leaf tips range from pointed (bentgrasses) to rounded (St. Augustinegrass) to boat-shaped (bluegrasses).","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q074","module":"M2","question":"Turfgrass management is defined as the range of activities, including cultural practices, for establishing and sustaining turf at a desired level of:","correct":"quality","options":["quality","cost","biomass","color"],"feedback":"Turfgrass management involves the activities and cultural practices needed to establish and sustain a desired level of turf quality.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q075","module":"M2","question":"Where turfgrass quality falls below an acceptable level, the textbook attributes this usually to:","correct":"mismanagement","options":["mismanagement","poor seed genetics alone","climate change","insufficient equipment"],"feedback":"The textbook states that below-acceptable turfgrass quality is usually due to mismanagement.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"},{"id":"m2q076","module":"M2","question":"Where a grass seed germinates below the soil surface, the growing point rises toward the surface via the:","correct":"mesocotyl","options":["mesocotyl","coleoptile","rhizome","stolon"],"feedback":"The mesocotyl elongates to raise the growing point closer to the surface when a seed germinates below ground.","source":"Textbook Ch. 2, pp. 16-19: The Grass Plant","kind":"enrichment"}];const KEY='turf235_exam1_m2_150_v1';let state={remaining:[],mastered:[],misses:0,current:[],submitted:false};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.remaining)&&Array.isArray(s.mastered)){let ids=new Set([...s.remaining,...s.mastered]),bankIds=new Set(BANK.map(q=>q.id));if(ids.size===bankIds.size&&[...ids].every(id=>bankIds.has(id))){state=s;return true}}}catch(e){}return false}function byId(id){return BANK.find(q=>q.id===id)}function reset(){state={remaining:shuffle(BANK.map(q=>q.id)),mastered:[],misses:0,current:[],submitted:false};save();nextBatch()}function nextBatch(){if(!state.remaining.length){done();return}state.current=state.remaining.slice(0,10);state.submitted=false;save();render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){quiz.innerHTML=state.current.map((id,i)=>{let q=byId(id),opts=shuffle(q.options);return `<section class="card" id="${q.id}"><div class="head"><span>Question ${i+1}</span><span>${q.kind==='book'?'Assigned textbook':'Course module'}</span></div><div class="body"><div class="stem">${esc(q.question)}</div>${opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${encodeURIComponent(o)}">${esc(o)}</label>`).join('')}<div class="feedback"></div><div class="src">Source: ${esc(q.source)}</div></div></section>`}).join('');submit.disabled=false;next.disabled=true;batch.textContent='Batch: —';stats()}function submitBatch(){if(state.submitted)return;state.submitted=true;let right=0,wrong=[];for(let id of state.current){let q=byId(id),sec=document.getElementById(id),c=sec.querySelector(`input[name="${id}"]:checked`),v=c?decodeURIComponent(c.value):null,ok=v===q.correct;sec.classList.add(ok?'correct':'wrong');sec.querySelectorAll('.opt').forEach(l=>{let inp=l.querySelector('input'),x=decodeURIComponent(inp.value);inp.disabled=true;if(x===q.correct)l.classList.add('good');if(v&&x===v&&v!==q.correct)l.classList.add('bad')});sec.querySelector('.feedback').textContent=ok?q.feedback:`Correct answer: ${q.correct}. Source statement: ${q.feedback}`;if(ok){right++;if(!state.mastered.includes(id))state.mastered.push(id)}else{state.misses++;wrong.push(id)}}state.remaining=state.remaining.filter(id=>!state.current.includes(id));state.remaining.push(...wrong);batch.textContent=`Batch: ${right}/${state.current.length}`;submit.disabled=true;next.disabled=false;save();stats()}function stats(){remaining.textContent=`Remaining: ${state.remaining.length}`;mastered.textContent=`Mastered: ${state.mastered.length}`;misses.textContent=`Misses: ${state.misses}`;let t=state.remaining.length+state.mastered.length;bar.style.width=(t?Math.round(state.mastered.length/t*100):100)+'%'}function done(){quiz.innerHTML=`<div class="done"><h2>M2 cleared</h2><p>You retired all 76 questions.</p><p>Total misses along the way: ${state.misses}</p></div>`;submit.disabled=true;next.disabled=true;stats()}function toTop(){window.scrollTo({top:0,behavior:"smooth"})}submit.onclick=()=>{submitBatch();toTop()};next.onclick=()=>{nextBatch();toTop()};restart.onclick=()=>{if(confirm('Restart M2 from zero?'))reset()};clear.onclick=()=>{localStorage.removeItem(KEY);reset()};if(!load())reset();else{state.current=[];nextBatch()}
</script></body></html>
